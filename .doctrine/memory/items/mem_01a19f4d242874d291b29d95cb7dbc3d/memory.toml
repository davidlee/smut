status = "active"
title = "`std::env::home_dir()` answers for an unset *or empty* HOME, so a fixture must set HOME rather than unset it"
summary = """Rust's `std::env::home_dir()` returns $HOME when set and non-empty, else the passwd entry, else None — so `env -u HOME` and `HOME=` both still resolve a home, and any test or design that treats "no $HOME" as "no home" is wrong."""
created = "2026-11-03"
updated = "2026-11-03"

