title = "The REV target set refuses a decision — DEC amendments land through `doctrine knowledge edit`"
summary = 'A REV cannot target a DEC (targets are SPEC/PRD/REQ/ADR/POL/STD); decision amendments land through `doctrine knowledge edit`, so a brief that files decisions under "REV" must be corrected before authoring — and `--body` from an empty staging file wipes the record.'
