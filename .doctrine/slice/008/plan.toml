[[phase]]
id        = "PHASE-05"
name      = "The seed carries its origin"
objective = "Give the declaration its origin: `seed(set)` gains `source` — the literal `conventions/<name>.md`, the same string at every layer, because the seed is handed a set and never a kind — and the version rule the design fixes (the author's frontmatter version for a file set, the crate's for the shipped one, absent when a file declares none), keeps `smut_id` fixed at `conventions-<name>` and the title verbatim, seeds the body unchanged, moves the declaration's key list from five names to six, and still prints one compact line whose second install reports the replaced body under `previous`."
entrance_criteria = [
  { id = "EN-1", text = "Design §1 and §5 are read again with DEC-017 (fixed id, upsert, `previous`), DEC-028's id and `source` clause, DEC-031 rule 3 and ADR-001's reserved-key rule; §5's layer-blind provenance paragraph and the design's second hedge are read as the accepted consequence, not re-opened." },
  { id = "EN-2", text = "PHASE-04 is green and the seed path is exercised through the binary. `tests/conventions.rs`'s three upsert rows — declare once, re-install reports `previous`, `--compact` omits it — are read before they are extended, and `entity::serialise` with `Form::Stdout` is confirmed as the printer, so the phase changes no engine code." }
]
exit_criteria = [
  { id = "EX-1", text = "`seed(set: &Set) -> Value` emits `smut_id` as `conventions-<name>` (fixed, layer-blind), `type` as `convention`, `version` per EX-2, `source` as the literal `conventions/<name>.md`, `title` verbatim and `body` unchanged; `smut_id` prints first and the rest lexically, and the printed declaration is one compact line ending in one newline. `source` is the literal because §6's `seed(set: &Set)` has no `kind`: the loader's genericity stops at `load`, so the seed cannot derive a leaf path from a kind it was never handed, and that gap is a design question recorded in plan.md rather than a signature this phase invents. The declaration's exact key set is part of the contract — `smut_id` first, then `body`, `source`, `title`, `type`, `version` — so today's five-name assertion in `tests/conventions.rs` is amended to six names, never deleted to make the suite green, and pinned as `fn the_seed_key_set_is_six_names`." },
  { id = "EX-2", text = "The version rule is stated once and tested in all three shapes: a file set's frontmatter `version` when it declares one; the crate's `env!(\"CARGO_PKG_VERSION\")` for the binary layer, which arrives on the set from the loader rather than being re-derived in `seed`; and the field absent for a file set that declares none, so the seed never claims the crate's version for an author's file (DEC-031). The omission is asserted, so an always-present version cannot pass." },
  { id = "EX-3", text = "The body the seed carries is the body the prose prints, less the one newline the printer adds, and both assertions live in one test — so a lost trailing newline, an appended footer or a re-introduced heading cannot stay green (RV-029 F-19). The seed's `body` and its `source` file diff clean, which is the property DEC-031 keeps the bytes for." },
  { id = "EX-4", text = "A second install under the same id is an upsert: the reply reports the body it replaced under `previous`, `--compact` still omits it, and an amended body reports the amendment. No command, flag or id change is added, and the id remains identical at every layer, which is why the listing — not the record — is what names the layer." },
  { id = "EX-5", text = "No `title_of`-style transformation survives: the title is the heading the file carries, a lower-case heading keeps its case, and a file with no heading falls back to its filename — that last row is also this phase's one pin on §1's name, since the name itself is PHASE-02/EX-1's." }
]
verification = [
  { id = "VT-1", expects = "The seed's origin and its three version shapes exist under their pinned names, and the fixed id and verbatim title are unchanged.", test_file = "src/conventions.rs", keywords = ["fn the_seed_omits_a_version_a_file_does_not_declare", "fn a_file_sets_version_is_the_authors", "fn the_source_is_the_conventions_leaf_path", "fn a_file_with_no_heading_falls_back_to_its_filename"], waived = false },
  { id = "VT-2", expects = "The declaration the binary prints carries its source at every layer, agrees with the prose on the body, keeps a six-name key set, and still upserts on the second install.", test_file = "tests/conventions.rs", keywords = ["fn the_seed_names_its_source_and_the_authors_version", "fn the_source_is_the_same_at_every_layer", "fn the_prose_and_the_seed_agree_on_the_body", "fn the_seed_key_set_is_six_names", "fn a_second_install_reports_the_body_it_replaced", "fn the_seed_is_one_compact_line"], waived = false },
  { id = "VA-1", expects = "Run `cargo test`, `cargo test --test conventions`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check`, then `just check`; record the results." },
