# Implementation plan for SL-008 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-008"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Find the project root and the user root"
objective = "Add `Roots`, `Roots::under`, `project_root` and `user_root` to `src/conventions.rs` as pure functions over the values they are handed — the nearest ancestor whose `.git` entry is a directory or a regular file, the config home from `$XDG_CONFIG_HOME` else `$HOME/.config`, an unresolvable home as an absent layer, and the one join that turns a repository root into the project layer directory (`<repo>/.config/smut`) — proved by in-module unit tests over scratch directories, with no caller, no environment read, and no change to any existing behaviour."
entrance_criteria = [
  { id = "EN-1", text = "Design §2 and DEC-032 are read in full, and DEC-026 is read for the walk-up terminus. Confirmed against the current tree that nothing in `src/` detects a `.git` entry or reads a config home (`grep -rn '\\.git\\b' src/` and `grep -rn 'home_dir\\|XDG\\|config_dir' src/` both return nothing), so this phase adds machinery rather than adapting it." },
  { id = "EN-2", text = "The gate is green at baseline (`just check`), or a pre-existing failure is isolated and reported. `just check` is what green means for every phase: it also runs the `fault-injection` feature set that a bare `cargo test` does not, so the narrower `cargo` invocations a phase's VA row names are evidence of one named property and never a substitute for the gate. This tree carries concurrent threads: the phase commits path-limited (`git commit -m … -- src/conventions.rs`), never `-a`, never `--amend`, and leaves `Cargo.toml`, `README.md` (dirty on disk) and `tests/readme_example.rs` untouched." },
  { id = "EN-3", text = "RV-029 F-17 is read (`doctrine review show 29 -f F-17`). Its directory-level half is this phase's obligation — a home above a repository must never become the project root. Its process-level half (the same fixture through the binary) is PHASE-04's." },
  { id = "EN-4", text = "The test strategy is settled before the first assertion: scratch trees are built under `std::env::temp_dir()` and removed on drop, as `src/store/mod.rs`'s unit tests already do; the symlink fixture is `#[cfg(unix)]`, because a `.git` symlink is the only way to produce an entry that is neither a directory nor a regular file. Every fixture that depends on there being no repository above it first asserts, plainly, that no ancestor of the scratch directory holds a `.git` — a `$TMPDIR` inside a checkout would otherwise redden that fixture for its own reason rather than the test's." }
]
exit_criteria = [
  { id = "EX-1", text = "`project_root(start: &Path) -> PathBuf` returns the nearest ancestor of `start`, inclusive, whose `.git` entry is a directory or a regular file, and returns `start` when the walk reaches the filesystem root without one — no walk-up past the current directory. The entry's kind is read with `symlink_metadata`, so a `.git` symlink is neither kind and the walk continues, while a clone's `.git` directory and a worktree's `gitdir:` file are both repositories. Nothing here reads the environment, spawns a process, or opens a file (RV-029 F-17: the terminus is what stops a directory above a repository — a user's home — being adopted as project policy). It returns the repository itself, not the layer directory: the `.config/smut` segment is `Roots::under`'s to join (EX-3), which is the only function that joins it, so `load` still joins `<kind>` exactly once (PHASE-03/EX-1). A `.git` symlink is not a repository here because §2's rule is written over the entry's own kind; git accepts that layout, so the reading is named and the design question is recorded in plan.md rather than a rule this phase may invent." },
  { id = "EX-2", text = "`user_root(config_home: Option<&Path>, home: Option<&Path>) -> Option<PathBuf>` returns `Some(<config-home>/smut)`, where config-home is the non-empty `config_home` else `<home>/.config`, and `None` when neither resolves. It never reads the environment and never fails: an unresolvable home is an absent layer, not an error (DEC-032). The `<kind>` segment is not joined here, or anywhere but `load` (PHASE-03/EX-1), so no root can carry a kind and none can be joined twice. The `.config/smut` segment is not joined here either: a config home already names `.config`, so this function's result is the user layer root exactly as design §2 fixes it, and the project layer's corresponding segment is `Roots::under`'s (EX-3)." },
  { id = "EX-3", text = "`Roots { project: PathBuf, user: Option<PathBuf> }` holds the two `…/smut` layer directories and nothing deeper, and `Roots::under(project_root: PathBuf, user_root: Option<PathBuf>) -> Roots` is the function that builds it: it appends exactly one segment, `.config/smut`, to the repository root it is handed, and stores the user root unchanged, because `user_root` already returned `<config-home>/smut`. DEC-026 fixes the project layer as `<project-root>/.config/smut/<kind>/`, and this is the one place that `.config/smut` is joined — so no caller repeats it, `project_root` keeps returning the repository (EX-1), and `load` still joins only `<kind>`. `Layer`, `Origin`, `Cause` and the rest arrive in PHASE-02; the phase adds no field a later phase has to remove." },
  { id = "EX-4", text = "In-module unit tests pin every branch, each naming the change that reddens it: `.git` as a directory; `.git` as a regular file; no `.git` at any level, where the root is the start directory and a `.git`-less parent's `.config/smut/conventions/` is unreachable (F-17's directory-level pin); a repository nested inside another, nearest wins; a `.git` symlink, where the walk continues; `config_home` given; `config_home` empty, falling through to `home`; `home` only; neither, which is `None`; and `fn the_layer_roots_are_the_two_smut_directories` over `Roots::under`, which pins `<repo>/.config/smut` for the project layer, the user layer root stored unchanged, and an absent user layer staying `None` — the row that would have caught the project layer being read as `<repo>/conventions/`." },
  { id = "EX-5", text = "The phase adds these four items and their tests, nothing else. `Set`, `HYGIENE`, `SETS`, `Ask`, `resolve`, `answer`, `listing` and `seed` are byte-identical, `tests/conventions.rs` is untouched, and `cargo test`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check` are green." }
]
verification = [
  { id = "VT-1", expects = "The two root functions and the root value exist with the pinned names, and the `.git` predicate reads the entry's own kind rather than following it.", test_file = "src/conventions.rs", keywords = ["fn project_root", "fn user_root", "fn under(", "struct Roots", "symlink_metadata"], patterns = ["^\\s*pub fn (project_root|user_root)"], waived = false },
  { id = "VT-2", expects = "Every branch of EX-4 has a test under its pinned name, so a missing branch fails the gate instead of passing the suite.", test_file = "src/conventions.rs", keywords = ["fn the_project_root_is_the_nearest_repository", "fn the_walk_stops_at_the_nearest_repository", "fn a_git_file_marks_a_repository", "fn a_git_entry_that_is_neither_kind_does_not_stop_the_walk", "fn the_user_root_is_the_config_home", "fn an_empty_config_home_falls_through_to_home", "fn no_config_home_is_an_absent_layer", "fn the_layer_roots_are_the_two_smut_directories"], waived = false },
  { id = "VA-1", expects = "Run `cargo test --lib conventions::`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check`, then `just check` — the gate EN-2 names — keeping the actual results in the phase evidence, separate from verify-vt's source-presence mandates." },
  { id = "VA-2", expects = "Read the new code and record that no `std::env` call, no `Command` and no `fs::read` reaches it, and that both roots are values the caller supplies; record the two greps from EN-1 beside the new code so the absence is evidence rather than a claim." }
]
