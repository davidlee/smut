[[phase]]
id        = "PHASE-03"
name      = "Load three layers, and resolve a name by precedence"
objective = "Add `load(roots, kind) -> Result<Vec<Entry>, Error>` and `set_in_force(entries, name)` — the only two places the filesystem and precedence appear: `load` joins the declaration kind once, reads project then user then binary, skips an absent directory and refuses an existing-but-unreadable one at exit 1, takes `.md` files whose names do not begin with a dot, reports a non-UTF-8 filename as a failed row, sorts each layer by name and hands the binary layer the crate's version after `parse`; `set_in_force` takes the first entry for a name and never falls through a failed one."
entrance_criteria = [
  { id = "EN-1", text = "Design §2, §3 and §4 are read again for the load-time facts — the kind joined once, the candidate filter, sorting, the crate's version, precedence, and validity not being a tie-breaker — with DEC-031 rules 1 to 5 and DEC-033's exit line. RV-029 F-5, F-12, F-13, F-14 and F-16 are read with `-f` and discharged here." },
  { id = "EN-2", text = "PHASE-02's types, reader and binary-layer helper are in place and green, and PHASE-01's `Roots` is in place. The phase adds no environment read and no dependency; both roots arrive as arguments (DEC-032)." },
  { id = "EN-3", text = "The fixture strategy is settled: every layer tree is a scratch directory under `std::env::temp_dir()` removed on drop, and the unreadable-layer case must not depend on the identity of the process running the suite — a layer path that exists but cannot be read as a directory is produced portably, with the mode-000 fixture only as a second row where the platform permits it — that row cannot fail as root, so where it is skipped the test says so in its own message and the class is proved by the exists-but-not-a-directory row (design question recorded in plan.md)." }
]
exit_criteria = [
  { id = "EX-1", text = "`load(roots: &Roots, kind: &str) -> Result<Vec<Entry>, Error>` joins `<kind>` exactly once, as `<root>/<kind>/`, so no root carries a kind and no caller can join it twice (RV-029 F-5); it concatenates project, then user, then binary in that order; and the declaration kind is a parameter, so nothing in the function is specific to `conventions` (RV-029 F-14, slice objective 7)." },
  { id = "EX-2", text = "A candidate is a regular file — including one reached through a symlink — whose extension is `.md` and whose filename does not begin with a dot. Directories, other extensions and dotfiles are not entries at all: not listed, not failed, because a directory the user controls should not produce noise. An absent directory contributes no entries and no error, which is the state of every project that has not opted in. A directory that exists and cannot be read refuses at exit 1 through `StoreError::FileSystem { step, path, source }`, whose message is `<step> failed for <path>: <the operating system's reason>`, with `step` naming the layer read (`reading the conventions layer`) so no line of it carries store vocabulary — and its doc comment's scope widens from store boundaries to layer reads, since no criterion otherwise accounts for a doc that contradicts the use. There is no file here, so there is no `Origin`, and §6's artefact variant cannot carry this class (design question recorded in plan.md); reusing the filesystem variant is the reading this plan takes, and `load`'s `Result` exists for exactly this branch (RV-029 F-12)." },
  { id = "EX-3", text = "A filename that is not UTF-8 becomes an `Entry` with `name: None` and `Outcome::Failed`, with a reason saying the filename is not UTF-8, produced before any read so no lossy `String` is ever built (RV-029 F-2). Every other file is read to bytes, decoded, and handed to `parse` with `Origin { layer, path }`. The two failures below that read are separate rows because §3 gives them separate reasons: a file that cannot be opened or read is a `Failed` row carrying the operating system's own words and the path, while bytes that are not UTF-8 are a `Failed` row whose reason is §3's fixed sentence *the file is not UTF-8 text* with the path — never the decoder's own message." },
  { id = "EX-4", text = "Each layer's entries are sorted by name, the binary layer's names coming from `SHIPPED`, so the listing's order is the loader's and never `read_dir`'s arbitrary order (RV-029 F-16); a `name: None` entry sorts last within its layer, which makes that order total and the listing deterministic. Sorting is by the decoded name only, and the `None`-last order has its own row because `Option`'s own ordering puts `None` first." },
  { id = "EX-5", text = "The crate's version is applied to the binary layer after `parse` and to nothing else (RV-029 F-15): a file set's `version` is what its frontmatter declares, or absent. The injection lives in the one helper PHASE-02/EX-4 introduced, which `load` calls for the binary layer; `load` does not apply it a second time." },
  { id = "EX-6", text = "`set_in_force(entries: &[Entry], name: &str) -> Option<&Entry>` returns the first entry whose name is `Some(name)`, relying on the order `load` produced, and is the only place precedence appears. A failed nearer entry is returned like any other, so validity never promotes a later layer and a broken project set still wins its name (DEC-031 rule 1)." },
  { id = "EX-7", text = "Unit tests pin: project beats user beats binary for one name; a set that exists only in the user layer resolves; an absent layer yields no entries and no error; an existing-but-unreadable layer is an error naming its path; a non-UTF-8 filename is a failed row and never an `Ok` name; each layer is ordered by name with undecodable names last; the crate's version lands on the binary layer and an author's on a file; `<kind>` is joined once for a kind other than `conventions`, which is the genericity pin; a broken project set still wins its name over a working user set; only `.md` files whose names do not begin with a dot are entries, pinned as `fn only_dotless_markdown_files_are_entries` over a fixture holding a subdirectory, a `.txt` file and a dotfile; a symlink to a `.md` file is an ordinary entry, pinned as `#[cfg(unix)] fn a_symlinked_set_is_an_ordinary_entry`; bytes that are not UTF-8 are a failed row, pinned as `fn a_file_that_is_not_utf8_text_is_a_failed_row`; an undecodable name sorts last, pinned as `fn an_undecodable_name_sorts_last`; and `<kind>` is joined once for a kind other than `conventions`, pinned as `fn a_second_kind_uses_the_same_loader`, which is the genericity pin." },
  { id = "EX-8", text = "Nothing calls `load` or `set_in_force` from the binary in this phase; `resolve`, `answer`, `listing` and `seed` are unchanged, every existing test stays green, and the phase's only new public items are the two functions. The loader is written before its consumer on purpose: it is the slice's risk centre and it gets its own red/green cycle rather than sharing one with the surface rewrite." }
]
