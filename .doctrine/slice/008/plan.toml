# Implementation plan for SL-008 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-008"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

[[phase]]
id        = "PHASE-01"
name      = "Find the project root and the user root"
objective = "Add `Roots`, `project_root` and `user_root` to `src/conventions.rs` as pure functions over the values they are handed — the nearest ancestor whose `.git` entry is a directory or a regular file, the config home from `$XDG_CONFIG_HOME` else `$HOME/.config`, and an unresolvable home as an absent layer — proved by in-module unit tests over scratch directories, with no caller, no environment read, and no change to any existing behaviour."
entrance_criteria = [
  { id = "EN-1", text = "Design §2 and DEC-032 are read in full, and DEC-026 is read for the walk-up terminus. Confirmed against the current tree that nothing in `src/` detects a `.git` entry or reads a config home (`grep -rn '\\.git\\b' src/` and `grep -rn 'home_dir\\|XDG\\|config_dir' src/` both return nothing), so this phase adds machinery rather than adapting it." },
  { id = "EN-2", text = "The gate is green at baseline (`just check`), or a pre-existing failure is isolated and reported. This tree carries concurrent threads: the phase commits path-limited (`git commit -m … -- src/conventions.rs`), never `-a`, never `--amend`, and leaves `Cargo.toml`, `README.md` (dirty on disk) and `tests/readme_example.rs` untouched." },
  { id = "EN-3", text = "RV-029 F-17 is read (`doctrine review show 29 -f F-17`). Its directory-level half is this phase's obligation — a home above a repository must never become the project root. Its process-level half (the same fixture through the binary) is PHASE-04's." },
  { id = "EN-4", text = "The test strategy is settled before the first assertion: scratch trees are built under `std::env::temp_dir()` and removed on drop, as `src/store/mod.rs`'s unit tests already do; the symlink fixture is `#[cfg(unix)]`, because a `.git` symlink is the only way to produce an entry that is neither a directory nor a regular file." }
]
exit_criteria = [
  { id = "EX-1", text = "`project_root(start: &Path) -> PathBuf` returns the nearest ancestor of `start`, inclusive, whose `.git` entry is a directory or a regular file, and returns `start` when the walk reaches the filesystem root without one — no walk-up past the current directory. The entry's kind is read with `symlink_metadata`, so a `.git` symlink is neither kind and the walk continues, while a clone's `.git` directory and a worktree's `gitdir:` file are both repositories. Nothing here reads the environment, spawns a process, or opens a file (RV-029 F-17: the terminus is what stops a directory above a repository — a user's home — being adopted as project policy)." },
  { id = "EX-2", text = "`user_root(config_home: Option<&Path>, home: Option<&Path>) -> Option<PathBuf>` returns `Some(<config-home>/smut)`, where config-home is the non-empty `config_home` else `<home>/.config`, and `None` when neither resolves. It never reads the environment and never fails: an unresolvable home is an absent layer, not an error (DEC-032). The `<kind>` segment is not joined here, or anywhere but `load` (PHASE-03/EX-1), so no root can carry a kind and none can be joined twice." },
  { id = "EX-3", text = "`Roots { project: PathBuf, user: Option<PathBuf> }` is the plain value the loader will take, deriving only what the phase needs. `Layer`, `Origin`, `Cause` and the rest arrive in PHASE-02; the phase adds no field a later phase has to remove." },
  { id = "EX-4", text = "In-module unit tests pin every branch, each naming the change that reddens it: `.git` as a directory; `.git` as a regular file; no `.git` at any level, where the root is the start directory and a `.git`-less parent's `.config/smut/conventions/` is unreachable (F-17's directory-level pin); a repository nested inside another, nearest wins; a `.git` symlink, where the walk continues; `config_home` given; `config_home` empty, falling through to `home`; `home` only; neither, which is `None`." },
  { id = "EX-5", text = "The phase adds these three items and their tests, nothing else. `Set`, `HYGIENE`, `SETS`, `Ask`, `resolve`, `answer`, `listing` and `seed` are byte-identical, `tests/conventions.rs` is untouched, and `cargo test`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check` are green." }
]
verification = [
  { id = "VT-1", expects = "The two root functions and the root value exist with the pinned names, and the `.git` predicate reads the entry's own kind rather than following it.", test_file = "src/conventions.rs", keywords = ["fn project_root", "fn user_root", "struct Roots", "symlink_metadata"], patterns = ["^\\s*pub fn (project_root|user_root)"], waived = false },
  { id = "VT-2", expects = "Every branch of EX-4 has a test under its pinned name, so a missing branch fails the gate instead of passing the suite.", test_file = "src/conventions.rs", keywords = ["fn the_project_root_is_the_nearest_repository", "fn the_walk_stops_at_the_nearest_repository", "fn a_git_file_marks_a_repository", "fn a_git_entry_that_is_neither_kind_does_not_stop_the_walk", "fn the_user_root_is_the_config_home", "fn an_empty_config_home_falls_through_to_home", "fn no_config_home_is_an_absent_layer"], waived = false },
  { id = "VA-1", expects = "Run `cargo test --lib conventions::`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check`; keep the actual results in the phase evidence, separate from verify-vt's source-presence mandates." },
  { id = "VA-2", expects = "Read the new code and record that no `std::env` call, no `Command` and no `fs::read` reaches it, and that both roots are values the caller supplies; record the two greps from EN-1 beside the new code so the absence is evidence rather than a claim." }
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-02"
name      = "Read one set file, and put the shipped set through the same reader"
objective = "Replace the compiled-in `Set` of `&'static str` fields with the owned vocabulary the design fixes — `Layer`, `Origin`, `Cause`, `Set`, `Entry`, `Outcome` — and add `parse(bytes, origin) -> Outcome`, a pure reader that takes `summary` and `version` from frontmatter, refuses the four derived keys by name, ignores unknown keys, takes the first `# ` heading as the title verbatim and the text below the frontmatter as the body; make the shipped bytes a `(name, bytes)` table that goes through that same reader; make a set that cannot be loaded its own refusal class at exit 1 rather than a panic; and let `hygiene.md` carry its summary in frontmatter and its own `Conventions:` heading."
entrance_criteria = [
  { id = "EN-1", text = "Design §1 and §3 are read in full, with DEC-028 (what a set is) and DEC-031 rules 3 and 5 (the body is the file's bytes; a failed set is a reason, never a panic). RV-029 F-1, F-2, F-6, F-8, F-15 and F-20 are read with `-f`; every one of them is discharged in this phase's types and reader, so none may be left to a later phase." },
  { id = "EN-2", text = "PHASE-01 is green. `src/cli.rs`'s `Sub::Conventions`, `src/main.rs`'s dispatch arm, `src/error.rs`'s two convention refusals and their boundary rows, `src/learn.rs`'s Conventions section, `src/conventions/hygiene.md` and `tests/conventions.rs`'s shipped-surface assertions are read at their current line numbers before any edit, so the assertions this phase reddens are known rather than discovered." },
  { id = "EN-3", text = "No YAML or TOML dependency is added — DEC-028's frontmatter is two flat keys, hand-parsed. `Cargo.toml` belongs to another thread and stays untouched, as does `README.md`." }
]
exit_criteria = [
  { id = "EX-1", text = "The types are the design's, under the design's names: `Layer { Project, User, Binary }` printing `project`/`user`/`binary`; `Origin { layer: Layer, path: PathBuf }`; `Cause { line: Option<usize>, reason: String }`; `Set { name, title, summary: Option<String>, version: Option<String>, body }` with no lifetime; `Entry { name: Option<String>, origin, outcome }`; `Outcome { Loaded(Set), Failed(Cause) }`. `Entry.name` is `None` only for a filename that is not UTF-8 — the design's 'never becomes an Entry with a name', kept without ever deriving a lossy `String` — and the name is `Some` for every other file." },
  { id = "EX-2", text = "`parse(bytes: &str, origin: Origin) -> Outcome` is pure: no filesystem, no environment, no clock, no release number (RV-029 F-15). Frontmatter exists only when the first line is exactly `---` and a later line is exactly `---`; blank lines inside the fence are skipped and every other line must be `key: value` or the file fails naming that line (RV-029 F-8). `summary` and `version` are the only known keys; `title`, `name`, `id` and `type` are refused by name, each with its own sentence saying where that fact comes from — the heading, the filename, the filename, and `convention` — asserted one by one so the four cannot collapse into a single message (RV-029 F-20); any other key is ignored, so a set written for a later smut still loads. Outside a fence, `---` is prose." },
  { id = "EX-3", text = "The title is the first line beginning `# `, verbatim, falling back to the name; the body is everything after the frontmatter with trailing newlines trimmed and nothing else transformed. A frontmatter-only file and an empty file both fail as a set that says nothing is a mistake, not advice (DEC-028, RV-029 F-6); an unterminated fence fails. `Cause.line` is `Some` for every line-bearing class and the reason sentence names the same line, so the number survives into the refusal and cannot drift from it." },
  { id = "EX-4", text = "The shipped bytes become `pub const SHIPPED: [(&str, &str); 1]` = `[(\"hygiene\", include_str!(\"conventions/hygiene.md\"))]`, and one private helper builds the binary layer as `Vec<Entry>` — `Origin { layer: Binary, path: \"conventions/<name>.md\" }`, the crate's version applied after `parse` — by running each pair through the same reader a file goes through. `HYGIENE`, `SETS`, `title_of` and the `&'static` lifetime disappear, and `SETS`'s 'a set is a file plus an entry here' comment is corrected to describe the table. The phase constructs no panic path: no `unwrap`, `expect` or `panic!` on the embedded bytes, because the embedded set is an `Outcome` like any other (that helper is what PHASE-03/EX-5 reuses for the binary layer)." },
  { id = "EX-5", text = "`Ask` owns the set it resolved — `List`, `Prose(Set)`, `Seed(Set)` — because one layer cannot answer differently from how it parsed, and `resolve(name, format) -> Result<Ask, Error>` keeps DEC-008's order (the format's name is refused before the set's name is looked up; `json` with no name is a usage error) and keeps `UnknownConvention` at exit 2 with the names that exist. `answer(ask) -> String` stays infallible and prints prose as the body followed by exactly one `'\\n'`, because the binary writes what it is given and no shell adds one (RV-029 F-7)." },
  { id = "EX-6", text = "`src/error.rs` gains exactly one variant holding `Origin` and `Cause`, `ArtefactNotLoaded { origin, cause }`, rendered as the file's own path and `did not load: <reason>` with no store vocabulary in it. It joins the class that exits 1 — the crate keeps two classes, `Reject` at 2 and store-and-runtime at 1, so no third arm appears — and it joins both hand-maintained inventories: a `Display` arm, a row in `every_store_refusal()`, and one row in the boundary table with the array's length moved to 27. `UnknownConvention` is unchanged in this phase, including its field and its join." },
  { id = "EX-7", text = "`src/conventions/hygiene.md` gains flat frontmatter carrying `summary: general structure and relations`, and its own first heading becomes `# Conventions: general hygiene`. The prose below the frontmatter is otherwise byte-identical to today's body, and the seed's title is that heading verbatim: no `Conventions: ` synthesis remains anywhere in code (RV-029 F-20's title row; DEC-031's 'the prefix a reader sees is the file's choice')." },
  { id = "EX-8", text = "`src/learn.rs` gains one line in its Conventions section: a printed set is the body, the frontmatter is metadata and is not reproduced. A test pins that sentence, because the loss it names is the silent-loss class this repository ranks first (DEC-031). No other guide text changes in this phase." },
  { id = "EX-9", text = "`tests/conventions.rs`'s shipped-surface assertions move with the change: the prose assertion becomes the body the file holds below its frontmatter plus one newline, and the seed's title and body assertions follow the file. No assertion is dropped without its replacement naming the change that reddens it. The suite still spawns with the inherited environment and asserts nothing layered — that is PHASE-04's." }
]
verification = [
  { id = "VT-1", expects = "The six types and the pure reader exist under the design's names, and the shipped bytes go through the same reader rather than a special case.", test_file = "src/conventions.rs", keywords = ["pub fn parse", "pub struct Set", "pub enum Outcome", "pub enum Layer", "pub struct Origin", "pub struct Cause", "pub struct Entry", "pub const SHIPPED", "fn the_shipped_set_parses", "fn frontmatter_is_not_part_of_the_body"], patterns = ["^\\s*pub fn parse\\("], waived = false },
  { id = "VT-2", expects = "Every frontmatter class, derived key, title and body rule of EX-2 and EX-3 has a test under its pinned name.", test_file = "src/conventions.rs", keywords = ["fn the_four_derived_keys_are_refused_by_name", "fn an_unknown_frontmatter_key_is_ignored", "fn a_frontmatter_line_that_is_not_key_value_names_its_line", "fn an_unterminated_fence_is_malformed", "fn a_blank_line_inside_the_fence_is_skipped", "fn an_empty_body_is_malformed", "fn the_title_is_the_first_heading_verbatim"], waived = false },
  { id = "VT-3", expects = "The new refusal is a whole class in the taxonomy: constructed, displayed, inventoried and boundary-mapped at exit 1.", test_file = "src/error.rs", keywords = ["ArtefactNotLoaded", "did not load", "[(Error, u8); 27]", "every_store_refusal"], waived = false },
  { id = "VT-4", expects = "The shipped surface's assertions moved with the reader rather than being deleted: prose is the body, the seed title is the file's heading.", test_file = "tests/conventions.rs", keywords = ["fn a_named_set_prints_the_body_verbatim", "fn the_seed_title_is_the_heading_verbatim"], waived = false },
  { id = "VT-5", expects = "The guide states the frontmatter loss in its own sentence, and a test pins it.", test_file = "src/learn.rs", keywords = ["the frontmatter is metadata and is not reproduced", "fn the_guide_says_a_printed_set_omits_its_frontmatter"], waived = false },
  { id = "VA-1", expects = "Run `cargo test`, `cargo clippy --all-targets -- -D warnings`, `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check`; record the actual results in the phase evidence." },
  { id = "VA-2", expects = "Read the reader for ambient reach — no `std::env`, no `fs::`, no `Command` outside the binary-layer helper — and record that no line of non-test code in the module unwraps, expects or panics. Confirm each of RV-029 F-1, F-2, F-6, F-8, F-15 and F-20 is discharged by a named line or test." }
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-03"
name      = "Load three layers, and resolve a name by precedence"
objective = "Add `load(roots, kind) -> Result<Vec<Entry>, Error>` and `set_in_force(entries, name)` — the only two places the filesystem and precedence appear: `load` joins the declaration kind once, reads project then user then binary, skips an absent directory and refuses an existing-but-unreadable one at exit 1, takes `.md` files whose names do not begin with a dot, reports a non-UTF-8 filename as a failed row, sorts each layer by name and hands the binary layer the crate's version after `parse`; `set_in_force` takes the first entry for a name and never falls through a failed one."
entrance_criteria = [
  { id = "EN-1", text = "Design §2, §3 and §4 are read again for the load-time facts — the kind joined once, the candidate filter, sorting, the crate's version, precedence, and validity not being a tie-breaker — with DEC-031 rules 1 to 5 and DEC-033's exit line. RV-029 F-5, F-12, F-13, F-14 and F-16 are read with `-f` and discharged here." },
  { id = "EN-2", text = "PHASE-02's types, reader and binary-layer helper are in place and green, and PHASE-01's `Roots` is in place. The phase adds no environment read and no dependency; both roots arrive as arguments (DEC-032)." },
  { id = "EN-3", text = "The fixture strategy is settled: every layer tree is a scratch directory under `std::env::temp_dir()` removed on drop, and the unreadable-layer case must not depend on the identity of the process running the suite — a layer path that exists but cannot be read as a directory is produced portably, with the mode-000 fixture only as a second row where the platform permits it." }
]
exit_criteria = [
  { id = "EX-1", text = "`load(roots: &Roots, kind: &str) -> Result<Vec<Entry>, Error>` joins `<kind>` exactly once, as `<root>/<kind>/`, so no root carries a kind and no caller can join it twice (RV-029 F-5); it concatenates project, then user, then binary in that order; and the declaration kind is a parameter, so nothing in the function is specific to `conventions` (RV-029 F-14, slice objective 7)." },
  { id = "EX-2", text = "A candidate is a regular file — including one reached through a symlink — whose extension is `.md` and whose filename does not begin with a dot. Directories, other extensions and dotfiles are not entries at all: not listed, not failed, because a directory the user controls should not produce noise. An absent directory contributes no entries and no error, which is the state of every project that has not opted in; a directory that exists and cannot be read is an error at exit 1 naming the path and the operating system's reason, carrying no store vocabulary (RV-029 F-12)." },
  { id = "EX-3", text = "A filename that is not UTF-8 becomes an `Entry` with `name: None` and `Outcome::Failed`, with a reason saying the filename is not UTF-8, produced before any read so no lossy `String` is ever built (RV-029 F-2). Every other file is read to bytes, decoded, and handed to `parse` with `Origin { layer, path }`; a read or decode failure is a `Failed` row carrying the operating system's own words and the path." },
  { id = "EX-4", text = "Each layer's entries are sorted by name, the binary layer's names coming from `SHIPPED`, so the listing's order is the loader's and never `read_dir`'s arbitrary order (RV-029 F-16); a `name: None` entry sorts last within its layer, which makes that order total and the listing deterministic. Sorting is by the decoded name only." },
  { id = "EX-5", text = "The crate's version is applied to the binary layer after `parse` and to nothing else (RV-029 F-15): a file set's `version` is what its frontmatter declares, or absent. The injection lives in the one helper PHASE-02/EX-4 introduced, which `load` calls for the binary layer; `load` does not apply it a second time." },
  { id = "EX-6", text = "`set_in_force(entries: &[Entry], name: &str) -> Option<&Entry>` returns the first entry whose name is `Some(name)`, relying on the order `load` produced, and is the only place precedence appears. A failed nearer entry is returned like any other, so validity never promotes a later layer and a broken project set still wins its name (DEC-031 rule 1)." },
  { id = "EX-7", text = "Unit tests pin: project beats user beats binary for one name; a set that exists only in the user layer resolves; an absent layer yields no entries and no error; an existing-but-unreadable layer is an error naming its path; a non-UTF-8 filename is a failed row and never an `Ok` name; each layer is ordered by name with undecodable names last; the crate's version lands on the binary layer and an author's on a file; `<kind>` is joined once for a kind other than `conventions`, which is the genericity pin; a broken project set still wins its name over a working user set." },
  { id = "EX-8", text = "Nothing calls `load` or `set_in_force` from the binary in this phase; `resolve`, `answer`, `listing` and `seed` are unchanged, every existing test stays green, and the phase's only new public items are the two functions. The loader is written before its consumer on purpose: it is the slice's risk centre and it gets its own red/green cycle rather than sharing one with the surface rewrite." }
]
verification = [
  { id = "VT-1", expects = "The loader, the resolver and every load-time branch of EX-7 exist under their pinned names, with the kind joined once and the binary layer reusing the shipped-bytes helper.", test_file = "src/conventions.rs", keywords = ["pub fn load", "pub fn set_in_force", "fn the_project_layer_beats_the_user_layer", "fn an_absent_layer_is_not_an_error", "fn an_unreadable_layer_is_an_error", "fn a_non_utf8_filename_is_a_failed_row", "fn each_layer_is_sorted_by_name", "fn the_binary_layer_carries_the_crates_version", "fn the_kind_is_joined_once", "fn a_broken_set_still_wins_its_name"], patterns = ["^\\s*pub fn (load|set_in_force)\\("], waived = false },
  { id = "VA-1", expects = "Run `cargo test`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check`, and record the results. The suite must be green with the loader unreferenced by the binary, so the phase cannot have half-switched the surface." },
  { id = "VA-2", expects = "Read the loader for the two properties source cannot show: that every filesystem read in the module is inside `load`, and that an absent layer and an unreadable one take different paths. Record the branch that distinguishes them beside the grep for `fs::` in the module." }
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-04"
name      = "Answer from the layers: the listing, the prose and the refusals"
objective = "Make `answer(roots, kind, ask) -> Result<String, Error>` the single entry point over `load`: render the listing as one row per file in precedence order, four fields two spaces apart, the third field a summary, `-`, `shadowed` or `did not load: <reason>` where the failure wins; make the unknown-name refusal list every resolved file with its layer and verdict at exit 2 and a broken winner refuse at exit 1 with its path and reason; have `main` read the environment once, compute the two roots and pass them to `execute`, so `cli::parse` stays pure and no in-process test reads a developer's home; and move the guide and the store format to the truth the layers create."
entrance_criteria = [
  { id = "EN-1", text = "Design §4, §5 and §6 are read in full, with DEC-031 (all five rules), DEC-032, DEC-033, DEC-004 and STD-001. RV-029 F-3, F-9, F-10, F-11, F-12 and F-17 are read with `-f` and discharged here; F-10, F-11, F-12 and F-17 are the four `demonstrate` routes, and this phase is where three of them become rows." },
  { id = "EN-2", text = "PHASE-03's loader is green and unit-tested. The design's two post-pass hedges — §5's printed-prose line and §6's layer-blind provenance paragraph — are attested rather than passed over; this phase implements them and does not treat the clean review state as coverage." },
  { id = "EN-3", text = "The current line numbers of `Sub::Conventions` in `src/cli.rs`, the dispatch arm and `execute` in `src/main.rs`, the two convention refusals in `src/error.rs`, the Conventions section and the exit table in `src/learn.rs`, and the conventions clause in `docs/store-format.md` are confirmed before editing, so no edit rests on a stale premise." },
  { id = "EN-4", text = "The fixture arithmetic is settled: a fake config home, a fake home and a repository marker are all scratch directories under `std::env::temp_dir()`; nothing writes to the developer's `~/.config` or to `interview.local/.smut`; and the spawn helper sets `HOME` and `XDG_CONFIG_HOME` explicitly rather than inheriting them." }
]
exit_criteria = [
  { id = "EX-1", text = "`answer(roots: &Roots, kind: &str, ask: Ask) -> Result<String, Error>` is the only entry point `main` calls. `Ask` becomes the question it can no longer answer alone — `List`, `Prose { name }`, `Seed { name }` — and `resolve(name, format) -> Result<Ask, Reject>` builds it from strings with DEC-008's order intact, reading no filesystem, so `cli::parse` keeps its unit tests and its purity." },
  { id = "EX-2", text = "`listing(entries: &[Entry]) -> String` prints one row per file, layer-major then by name within a layer, four fields separated by two spaces, one row per line: name, layer, third field, and the file's own path — absolute for a file layer, `conventions/<name>.md` for the binary, rendered with `Path::display` and never a derived `String`. The third field is the summary when the file loaded and is in no shadow; `-` when it loaded, is in force and declares no summary (RV-029 F-10); `shadowed` when a nearer layer holds the same name; `did not load: <reason>` when it failed — and the failure wins over `shadowed`, so a broken file behind a working one still prints its reason rather than only its demotion (RV-029 F-11). A filename that is not UTF-8 prints the token `<not UTF-8>` in the name column. The listing exits 0 even when it reports a broken file." },
  { id = "EX-3", text = "`UnknownConvention` keeps exit 2 and renders one clause per resolved file in the listing's order, joined by `; `: `name (layer)` for a loaded or shadowed file, `name (layer, did not load: <reason>)` for a failed one, so a caller can retry from the message alone (RV-029 F-9). Its field holds rendered clauses rather than bare names and its doc comment says which, so the type does not lie about its contents." },
  { id = "EX-4", text = "A name whose winner failed is not unknown: it refuses at exit 1 through PHASE-02/EX-6's variant, naming the path and the reason and claiming no store. A name no entry carries is exit 2, and `--format json` with no name stays a usage error — DEC-033's line between what the caller typed and what the filesystem supplied. A shadowed set stays unaddressable: resolution stops at the winner, and the listing's path is the way to its content (DEC-031 rules 4 and 2)." },
  { id = "EX-5", text = "`main` computes the two roots in one place — `project_root(current_directory())` and `user_root(env::var_os(\"XDG_CONFIG_HOME\").map(PathBuf::from), home_dir())` — and passes `&roots` to `execute(arguments, stdin_is_terminal, stdin, &roots)`. The store's root stays `<cwd>` alone (DEC-004), so a cwd inside a repository reads the repository's sets and writes its own store; that disagreement is intended and tested. The in-process `dispatch_of` test asserting on `conventions::HYGIENE` moves to the spawned suite, and no in-process test depends on `$HOME` (RV-029 F-3)." },
  { id = "EX-6", text = "`src/learn.rs` gains the layer sentence — a set is found in the project, then the user config home, then the binary — and DEC-033's exit-table clause, `or a conventions set could not be loaded`, each pinned by whole sentence rather than by word. `docs/store-format.md`'s conventions clause stops claiming the binary is the only source and says one set ships while a project or a user may supply more, keeping the leaf path, the three roots and the nothing-inside-`.smut/` promise intact under STD-001." },
  { id = "EX-7", text = "`tests/conventions.rs` is rewritten around the layered surface and proves the process-level rows: one name at three layers prints the project body; a set only in the scratch config home resolves; a nested cwd under a repository resolves the repository's set; a `.git` file counts as a repository; the walk stops at the repository, so a fake home's same-named set is never reported as `project` (RV-029 F-17); no repository means cwd with no walk-up and a parent's set unreachable; a broken project set shadows a good user set, refusing at 1 with the project path while the user row still says `shadowed`; a valid project set with a corrupt user file reports `did not load:` and not `shadowed`; an absent layer lists nothing extra and exits 0; an existing-but-unreadable layer exits 1 naming the path; a bare markdown file lists with `-`; the prose is the body plus one newline, byte for byte; an unknown name at exit 2 lists names with layers; the two roots disagree on purpose, `conventions` resolving the repository's set while `get` fails at exit 1 for the local store; and no store is created — asserted by pairing the command with a store command that fails in the same directory, never by a bare absence check (RV-029 F-18)." },
  { id = "EX-8", text = "Every assertion in the rewritten suite names the change that reddens it, and none is carried over that no input could falsify; the spawn helper clears and sets the environment it depends on, and each fixture's cwd, home and config home are the test's own. An absent layer and an unreadable one are separate rows, because they are the pair that a single `is_dir` check would collapse (RV-029 F-12)." }
]
