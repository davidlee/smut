[[phase]]
id        = "PHASE-02"
name      = "Read one set file, and put the shipped set through the same reader"
objective = "Replace the compiled-in `Set` of `&'static str` fields with the owned vocabulary the design fixes — `Layer`, `Origin`, `Cause`, `Set`, `Entry`, `Outcome` — and add `parse(bytes, origin) -> Outcome`, a pure reader that takes `summary` and `version` from frontmatter, refuses the four derived keys by name, ignores unknown keys, takes the first `# ` heading as the title verbatim, derives the name from the file's stem, and takes the text below the frontmatter as the body; make the shipped bytes a `(name, bytes)` table that goes through that same reader; make a set that cannot be loaded its own refusal class at exit 1 rather than a panic; adapt the one `src/main.rs` assertion the retirement of `HYGIENE` would otherwise break; and let `hygiene.md` carry its summary in frontmatter and its own `Conventions:` heading."
entrance_criteria = [
  { id = "EN-1", text = "Design §1 and §3 are read in full, with DEC-028 (what a set is) and DEC-031 rules 3 and 5 (the body is the file's bytes; a failed set is a reason, never a panic). RV-029 F-1, F-2, F-6, F-8, F-15 and F-20 are read with `-f`; every one of them is discharged in this phase's types and reader, so none may be left to a later phase." },
  { id = "EN-2", text = "PHASE-01 is green. `src/cli.rs`'s `Sub::Conventions`, `src/main.rs`'s dispatch arm, `src/error.rs`'s two convention refusals and their boundary rows, `src/learn.rs`'s Conventions section, `src/conventions/hygiene.md` and `tests/conventions.rs`'s shipped-surface assertions are read at their current line numbers before any edit, so the assertions this phase reddens are known rather than discovered." },
  { id = "EN-3", text = "No YAML or TOML dependency is added — DEC-028's frontmatter is two flat keys, hand-parsed. `Cargo.toml` belongs to another thread and stays untouched, as does `README.md`." }
]
exit_criteria = [
  { id = "EX-1", text = "The types are the design's, under the design's names: `Layer { Project, User, Binary }` printing `project`/`user`/`binary`; `Origin { layer: Layer, path: PathBuf }`; `Cause { line: Option<usize>, reason: String }`; `Set { name, title, summary: Option<String>, version: Option<String>, body }` with no lifetime; `Entry { name: Option<String>, origin, outcome }`; `Outcome { Loaded(Set), Failed(Cause) }`. `Entry.name` is `None` only for a filename that is not UTF-8 — the design's 'never becomes an Entry with a name', kept without ever deriving a lossy `String` — and the name is `Some` for every other file. `Layer` implements `std::fmt::Display`, which is how it prints those three words and what makes the formatting reachable from a test before the listing exists; `Set` and `Origin` derive `PartialEq` so the same-reader test compares values rather than hand-listed fields. `Set.name` is the file's stem with `.md` stripped and its case preserved — `Mine.md` reads `Mine`, and the shipped pair's `hygiene` reads `hygiene` — and `parse` derives it from `origin.path`, the one place holding both the origin and the bytes; a non-UTF-8 filename is turned away before `parse` is called (§3), which is why the derivation is safe there and why §6's signature names no name (design question recorded in plan.md), and it is pinned as `fn the_name_is_the_filename_stem`." },
  { id = "EX-2", text = "`parse(bytes: &str, origin: Origin) -> Outcome` is pure: no filesystem, no environment, no clock, no release number (RV-029 F-15). Frontmatter exists only when the first line is exactly `---` and a later line is exactly `---`; blank lines inside the fence are skipped and every other line must be `key: value` or the file fails naming that line (RV-029 F-8). `summary` and `version` are the only known keys; `title`, `name`, `id` and `type` are refused by name, each with its own sentence saying where that fact comes from — the heading, the filename, the filename, and `convention` — asserted one by one so the four cannot collapse into a single message (RV-029 F-20); any other key is ignored, so a set written for a later smut still loads. Outside a fence, `---` is a Markdown horizontal rule and not a fence at all, which a file carrying one below its body proves rather than states, pinned as `fn a_horizontal_rule_opens_no_frontmatter`. Each of the four derived-key refusals is a `Failed` cause that PHASE-02/EX-6's variant renders at exit 1, pinned as `fn the_four_derived_keys_exit_one`: the sentence and the exit class are pinned separately, because §7's row 15 names both and only the sentence was pinned before. A known key with no value at all (`summary:` alone, `version:` alone) declares no value rather than failing: the line is a `key:` with nothing after it, so the field is absent — `summary` then lists as `-` and `version` is omitted from the seed — pinned as `fn a_known_key_with_no_value_is_absent`. The loud failure this keeps is the one that matters: a value continued across lines is not a flat `key: value`, so its indented continuation line fails naming that line, pinned as `fn a_multiline_value_names_its_line`." },
  { id = "EX-3", text = "The title is the first line beginning `# `, verbatim, falling back to the name; the body is everything after the frontmatter with trailing newlines trimmed and nothing else transformed. A frontmatter-only file and an empty file both fail as a set that says nothing is a mistake, not advice (DEC-028, RV-029 F-6); an unterminated fence fails. `Cause.line` is `Some` for every line-bearing class and the reason sentence names the same line, so the number survives into the refusal and cannot drift from it." },
  { id = "EX-4", text = "The shipped bytes become `pub const SHIPPED: [(&str, &str); 1]` = `[(\"hygiene\", include_str!(\"conventions/hygiene.md\"))]`, and one private helper builds the binary layer as `Vec<Entry>` — `Origin { layer: Binary, path: \"conventions/<name>.md\" }`, the crate's version applied after `parse` — by running each pair through the same reader a file goes through. `HYGIENE`, `SETS`, `title_of` and the `&'static` lifetime disappear, and `SETS`'s 'a set is a file plus an entry here' comment is corrected to describe the table. The phase constructs no panic path: no `unwrap`, `expect` or `panic!` on the embedded bytes, because the embedded set is an `Outcome` like any other (that helper is what PHASE-03/EX-5 reuses for the binary layer). A unit test pins the same-reader property rather than asserting it in prose: the same bytes parsed as a file and as the shipped pair produce equal `Entry`s apart from `Origin`, so the name, the outcome and the set are all compared and a mis-wired layer cannot pass on shape alone. `seed` prints `set.version`, so the crate's release number is derived in this one place and not again at the printer (PHASE-05/EX-2 completes the rule)." },
  { id = "EX-5", text = "`Ask` owns the set it resolved — `List`, `Prose(Set)`, `Seed(Set)` — because one layer cannot answer differently from how it parsed, and `resolve(name, format) -> Result<Ask, Error>` keeps DEC-008's order (the format's name is refused before the set's name is looked up; `json` with no name is a usage error), and resolves a name against the one layer that exists: no entry carries the name is `UnknownConvention` at exit 2 with the names that exist, an entry that failed is PHASE-02/EX-6's variant at exit 1. Those two branches are PHASE-04's rule applied to a single layer, which is why the phase can state them without the loader. `answer(ask) -> String` stays infallible and prints prose as the body followed by exactly one `'\\n'`, because the binary writes what it is given and no shell adds one (RV-029 F-7)." },
  { id = "EX-6", text = "`src/error.rs` gains exactly one variant holding `Origin` and `Cause`, `ArtefactNotLoaded { origin, cause }`, rendered as the file's own path and `did not load: <reason>` with no store vocabulary in it. It joins the class that exits 1 — the crate keeps two classes, `Reject` at 2 and store-and-runtime at 1, so no third arm appears — and it joins the three hand-maintained lists that notice a new refusal: a `Display` arm, a row in `every_store_refusal()` whose length is asserted in the same test so a variant added without its reason cannot pass, and one row in the boundary table with the array's length moved to 27. `Origin` and `Cause` are public, because the variant's fields are. `UnknownConvention` is unchanged in this phase, including its field and its join." },
  { id = "EX-7", text = "`src/conventions/hygiene.md` gains flat frontmatter carrying `summary: general structure and relations`, and its own first heading becomes `# Conventions: general hygiene`. The prose below the frontmatter is otherwise byte-identical to today's body, and the seed's title is that heading verbatim: no `Conventions: ` synthesis remains anywhere in code (RV-029 F-20's title row; DEC-031's 'the prefix a reader sees is the file's choice')." },
  { id = "EX-8", text = "`src/learn.rs` gains one line in its Conventions section: a printed set is the body, the frontmatter is metadata and is not reproduced. A test pins that sentence, because the loss it names is the silent-loss class this repository ranks first (DEC-031). No other guide text changes in this phase." },
  { id = "EX-9", text = "`tests/conventions.rs`'s shipped-surface assertions move with the change: the prose assertion becomes the body the file holds below its frontmatter plus one newline, and the seed's title and body assertions follow the file. No assertion is dropped without its replacement naming the change that reddens it. The suite still spawns with the inherited environment and asserts nothing layered — that is PHASE-04's. The listing assertion moves with `summary` becoming an absence-able field: the shipped row still prints name, summary and one newline, and a set that declares no summary prints `-` in that column — which is PHASE-04/EX-2's third-field rule applied to the one layer that exists, not a second shape this phase invents and PHASE-04 replaces." },
  { id = "EX-10", text = "`src/main.rs`'s in-process test `conventions_prints_the_shipped_set_without_a_store` asserts `conventions::HYGIENE.prose`, so retiring `HYGIENE` makes the crate uncompilable in this phase — a compile-forced coupling that cannot be deferred to PHASE-04. This phase rewrites that one assertion to what the reader produces (the body below the frontmatter plus one newline), so it reddens if the reader drops the body or the newline, keeps the test's name, and changes nothing else in `src/main.rs`; the test's move to the spawned suite stays PHASE-04/EX-5's." }
]
verification = [
  { id = "VT-1", expects = "The six types and the pure reader exist under the design's names, and the shipped bytes go through the same reader rather than a special case.", test_file = "src/conventions.rs", keywords = ["pub fn parse", "pub enum Outcome", "pub enum Layer", "pub struct Origin", "pub struct Cause", "pub struct Entry", "pub const SHIPPED", "impl fmt::Display for Layer", "fn the_layers_print_as_project_user_binary", "fn the_shipped_set_parses", "fn the_shipped_set_is_the_same_reader_as_a_file", "fn frontmatter_is_not_part_of_the_body"], patterns = ["^\\s*pub fn parse\\("], waived = false },
  { id = "VT-2", expects = "Every frontmatter class, derived key, title and body rule of EX-2 and EX-3 has a test under its pinned name.", test_file = "src/conventions.rs", keywords = ["fn the_four_derived_keys_are_refused_by_name", "fn an_unknown_frontmatter_key_is_ignored", "fn a_frontmatter_line_that_is_not_key_value_names_its_line", "fn an_unterminated_fence_is_malformed", "fn a_blank_line_inside_the_fence_is_skipped", "fn an_empty_body_is_malformed", "fn the_title_is_the_first_heading_verbatim", "fn the_name_is_the_filename_stem", "fn a_horizontal_rule_opens_no_frontmatter", "fn a_known_key_with_no_value_is_absent", "fn a_multiline_value_names_its_line", "fn the_four_derived_keys_exit_one"], waived = false },
  { id = "VT-3", expects = "The new refusal is a whole class in the taxonomy: constructed, displayed, inventoried and boundary-mapped at exit 1.", test_file = "src/error.rs", keywords = ["ArtefactNotLoaded", "did not load", "[(Error, u8);", "fn the_new_refusal_joins_every_inventory"], waived = false },
  { id = "VT-4", expects = "The shipped surface's assertions moved with the reader rather than being deleted: prose is the body, the seed title is the file's heading.", test_file = "tests/conventions.rs", keywords = ["fn a_named_set_prints_the_body_verbatim", "fn the_seed_title_is_the_heading_verbatim"], waived = false },
  { id = "VT-5", expects = "The guide states the frontmatter loss in its own sentence, and a test pins it.", test_file = "src/learn.rs", keywords = ["fn the_guide_says_a_printed_set_omits_its_frontmatter"], waived = false },
  { id = "VA-1", expects = "Run `cargo test`, `cargo clippy --all-targets -- -D warnings`, `cargo clippy --all-targets --all-features -- -D warnings` and `cargo fmt --check`, then `just check`; record the actual results in the phase evidence." },
  { id = "VA-2", expects = "Read the reader for ambient reach — no `std::env`, no `fs::`, no `Command` outside the binary-layer helper — and record that no line of non-test code in the module unwraps, expects or panics. Confirm each of RV-029 F-1, F-2, F-6, F-8, F-15 and F-20 is discharged by a named line or test, and record that `cargo test --all-targets` is green — which is EX-10's only possible evidence, since a retired `HYGIENE` cannot compile past an unrewritten `src/main.rs` test." }
]
