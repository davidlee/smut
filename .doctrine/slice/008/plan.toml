  { id = "VT-1", expects = "The loader, the resolver and every load-time branch of EX-7 exist under their pinned names, with the kind joined once and the binary layer reusing the shipped-bytes helper.", test_file = "src/conventions.rs", keywords = ["pub fn load", "pub fn set_in_force", "fn the_project_layer_beats_the_user_layer", "fn an_absent_layer_is_not_an_error", "fn an_unreadable_layer_is_an_error", "fn a_non_utf8_filename_is_a_failed_row", "fn each_layer_is_sorted_by_name", "fn the_binary_layer_carries_the_crates_version", "fn the_kind_is_joined_once", "fn a_broken_set_still_wins_its_name", "fn only_dotless_markdown_files_are_entries", "fn a_symlinked_set_is_an_ordinary_entry", "fn a_file_that_is_not_utf8_text_is_a_failed_row", "fn an_undecodable_name_sorts_last", "fn a_second_kind_uses_the_same_loader"], patterns = ["^\\s*pub fn (load|set_in_force)\\("], waived = false },
