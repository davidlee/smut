[[phase]]
id        = "PHASE-04"
name      = "Answer from the layers: the listing, the prose and the refusals"
objective = "Make `answer(roots, kind, ask) -> Result<String, Error>` the single entry point over `load`: render the listing as one row per file in precedence order, four fields two spaces apart, the third field a summary, `-`, `shadowed` or `did not load: <reason>` where the failure wins; make the unknown-name refusal list every resolved file with its layer and verdict at exit 2 and a broken winner refuse at exit 1 with its path and reason; have `main` read the environment once, compute the two roots and thread them through `dispatch` to `execute`, so `cli::parse` stays pure and no in-process test reads a developer's home; and move the guide and the store format to the truth the layers create."
entrance_criteria = [
  { id = "EN-1", text = "Design §4, §5 and §6 are read in full, with DEC-031 (all five rules), DEC-032, DEC-033, DEC-004 and STD-001. RV-029 F-3, F-9, F-10, F-11, F-12 and F-17 are read with `-f` and discharged here; F-10, F-11, F-12 and F-17 are the four `demonstrate` routes, and this phase is where three of them become rows." },
  { id = "EN-2", text = "PHASE-03's loader is green and unit-tested. The design's two post-pass hedges — §5's printed-prose line and §6's layer-blind provenance paragraph — are attested rather than passed over; this phase implements them and does not treat the clean review state as coverage." },
  { id = "EN-3", text = "The current line numbers of `Sub::Conventions` in `src/cli.rs`, the dispatch arm and `execute` in `src/main.rs`, the two convention refusals in `src/error.rs`, the Conventions section and the exit table in `src/learn.rs`, and the conventions clause in `docs/store-format.md` are confirmed before editing, so no edit rests on a stale premise." },
  { id = "EN-4", text = "The fixture arithmetic is settled: a fake config home, a fake home and a repository marker are all scratch directories under `std::env::temp_dir()`; nothing writes to the developer's `~/.config` or to `interview.local/.smut`; the spawn helper sets `HOME` and `XDG_CONFIG_HOME` explicitly rather than inheriting them and never unsets them, because `std::env::home_dir()` falls back to the passwd entry when `$HOME` is absent and an `env_remove` fixture would read the developer's real home; every no-repository fixture first asserts that no ancestor of its scratch tree holds a `.git`, so a `$TMPDIR` inside a checkout reddens it for its own reason rather than the test's; and the scratch helpers stay local to `tests/conventions.rs` — `tests/fixture.rs`, `tests/cli_contract.rs` and `tests/roundtrip.rs` are untouched, and none of them runs `conventions`." }
]
exit_criteria = [
  { id = "EX-1", text = "`answer(roots: &Roots, kind: &str, ask: Ask) -> Result<String, Error>` is the only entry point `main` calls. `Ask` becomes the question it can no longer answer alone — `List`, `Prose { name }`, `Seed { name }` — and `resolve(name, format) -> Result<Ask, Reject>` builds it from strings with DEC-008's order intact, reading no filesystem, so `cli::parse` keeps its unit tests and its purity. `src/cli.rs`'s two description comments stop describing the old shape, because clap prints them: `Sub::Conventions` no longer says the sets are *embedded*, and `Invocation::Conventions` no longer says the ask is resolved before it is carried. A `src/cli.rs` unit test, `fn the_conventions_help_does_not_claim_the_set_is_embedded`, asserts the rendered help, so a false sentence cannot come back silently; no behaviour in `src/cli.rs` changes." },
  { id = "EX-2", text = "`listing(entries: &[Entry]) -> String` prints one row per file, layer-major then by name within a layer, four fields separated by two spaces, one row per line: name, layer, third field, and the file's own path — absolute for a file layer, `conventions/<name>.md` for the binary, rendered with `Path::display` and never a derived `String`. The third field is the summary when the file loaded and is in no shadow; `-` when it loaded, is in force and declares no summary (RV-029 F-10); `shadowed` when a nearer layer holds the same name; `did not load: <reason>` when it failed — and the failure wins over `shadowed`, so a broken file behind a working one still prints its reason rather than only its demotion (RV-029 F-11). A filename that is not UTF-8 prints the token `<not UTF-8>` in the name column. Those four states have a fixed precedence — failure, then shadow, then summary, then dash — so no two of them can claim one row, and the listing exits 0 even when it reports a broken file. The binary layer is not exempt from shadowing: when a nearer layer holds the same name, the shipped row prints `shadowed` too, because the third field's rule is the normatively worded text while §5's own worked example has its binary row printing a summary in exactly that state — the rule wins over the example's slip, and the contradiction is recorded as a design question in plan.md. The fourth field is the layer root joined with the file's own name and rendered by `Path::display`, so it is absolute exactly when the root it came from is: a relative `XDG_CONFIG_HOME` yields a relative row and nothing here rewrites a path to look absolute." },
  { id = "EX-3", text = "`UnknownConvention` keeps exit 2 and renders one clause per resolved file in the listing's order, joined by `; `: `name (layer)` for a loaded or shadowed file, `name (layer, did not load: <reason>)` for a failed one, so a caller can retry from the message alone (RV-029 F-9). Its field holds rendered clauses rather than bare names and its doc comment says which, so the type does not lie about its contents. An entry with no name contributes no clause: the refusal is a list of names, and the listing is where the undecodable file appears." },
  { id = "EX-4", text = "A name whose winner failed is not unknown: it refuses at exit 1 through PHASE-02/EX-6's variant, naming the path and the reason and claiming no store. A name no entry carries is exit 2, and `--format json` with no name stays a usage error — DEC-033's line between what the caller typed and what the filesystem supplied. A shadowed set stays unaddressable: resolution stops at the winner, and the listing's path is the way to its content (DEC-031 rules 4 and 2)." },
  { id = "EX-5", text = "`main` computes the two roots once in `roots() -> Roots` — `Roots::under(project_root(current_directory()), user_root(env::var_os(\"XDG_CONFIG_HOME\").map(PathBuf::from), home_dir()))`, where home comes from `std::env::home_dir()` when that call is clippy-clean on the pinned toolchain and from `$HOME` with one comment saying why if it is not — so the `.config/smut` segment is joined by PHASE-01/EX-3's function and nowhere else, and `load` still joins only `<kind>`. Those roots are threaded through every layer between the entry point and the answer: `dispatch(arguments, stdin_is_terminal, stdin, &roots)` and `execute(arguments, stdin_is_terminal, stdin, &roots)`, with `conventions` as the kind. `dispatch` is named because it is the function every in-process test calls: were it to compute the roots itself, each unit test would read the developer's `$HOME` and `$XDG_CONFIG_HOME`, which is the defect this slice removes, reintroduced one function higher (RV-029 F-3). The store's root stays `<cwd>` alone (DEC-004), so a cwd inside a repository reads the repository's sets and writes its own store; that disagreement is intended and tested. The in-process `dispatch_of` test asserting on the shipped set moves to the spawned suite, and no in-process test depends on `$HOME`." },
  { id = "EX-6", text = "`src/learn.rs` gains the layer sentence — a set is found in the project, then the user config home, then the binary — pinned by `fn the_guide_states_where_a_set_is_found`, and DEC-033's exit-table clause, `or a conventions set could not be loaded`, pinned by `fn the_guide_exit_table_names_an_unloadable_set`. Each is a whole-sentence assertion inside its test against the reassembled paragraph, not a raw substring of the file, because the guide is a hand-wrapped `const` and a line break must not be able to pass for a missing sentence. `docs/store-format.md`'s conventions clause stops claiming the binary is the only source and says one set ships while a project or a user may supply more — in words that fit on one line, so the gate can see them — keeping the leaf path, the three roots and the nothing-inside-`.smut/` promise intact under STD-001." },
  { id = "EX-7", text = "`tests/conventions.rs` is rewritten around the layered surface and proves the process-level rows design §7 names, each under the name that reddens it: one name at three layers prints the project body; a set only in the scratch config home resolves (`fn a_set_that_exists_only_in_the_config_home_resolves`); the walk-up happens — cwd `repo/sub/dir/`, the set at `repo/.config/smut/conventions/` resolving (`fn the_walk_up_finds_the_repositorys_set`); a `.git` file counts as a repository and its set resolves (`fn a_worktree_is_a_repository`); the walk stops at the repository, so a fake home's same-named set is never reported as `project` (`fn the_walk_stops_at_the_repository`, RV-029 F-17); no repository means cwd with no walk-up and a parent's set unreachable (`fn no_repository_means_the_cwd_and_no_walk_up`); a broken project set shadows a good user set, refusing at 1 with the project path while the user row still says `shadowed`; a valid project set with a corrupt user file reports `did not load:` and not `shadowed`; an absent layer lists nothing extra and exits 0; an existing-but-unreadable layer exits 1 naming the path; a bare markdown file lists with `-` (`fn a_bare_markdown_file_lists_with_a_dash`); the prose is the body plus one newline, byte for byte; an unknown name at exit 2 lists names with layers; the two roots disagree on purpose, `conventions` resolving the repository's set while `get` fails at exit 1 for the local store; and no store is created — asserted by both halves design §7 names, `!scratch.store().exists()` **and** the paired `get` failing with its absent-store message, because the message is what discriminates a created-and-valid store from a created-and-corrupt one (RV-029 F-18; `fn the_command_still_creates_no_store`). Design §7's preserved behaviour survives this rewrite in the same file, under a name apiece so the gate can see each one: an unknown name at exit 2 (`fn an_unknown_name_still_exits_two`), `--format json` with no name as a usage error (`fn json_without_a_name_is_still_a_usage_error`), an unknown format refused before the operand (`fn an_unknown_format_is_still_refused_before_the_operand`), and the seed as one line (`fn the_seed_is_one_compact_line`, which PHASE-05 extends). A preserved behaviour may be renamed but never dropped or weakened: the unknown-name message necessarily changes in this phase, which is why its test cannot keep the old name and a pre-existing name would make the gate vacuous." },
  { id = "EX-8", text = "Every assertion in the rewritten suite names the change that reddens it, and none is carried over that no input could falsify; the spawn helper clears and sets the environment it depends on, and each fixture's cwd, home and config home are the test's own. An absent layer and an unreadable one are separate rows, because they are the pair that a single `is_dir` check would collapse (RV-029 F-12)." }
]
verification = [
  { id = "VT-1", expects = "The answer, the listing and the refusal rendering exist under their signed shapes, and the four third-field states — summary, dash, shadowed, did-not-load — plus the failure beating shadowed and the binary row being shadowed are unit-pinned.", test_file = "src/conventions.rs", keywords = ["pub fn answer(roots", "fn listing(entries", "fn an_in_force_set_without_a_summary_lists_with_a_dash", "fn a_failed_row_beats_shadowed", "fn the_listing_is_layer_major_then_by_name", "fn the_refusal_lists_every_resolved_file_with_its_layer", "fn the_binary_row_is_shadowed_by_a_nearer_file", "fn the_path_column_is_absolute_for_a_file_and_a_leaf_for_the_binary"], patterns = ["^\\s*pub fn answer\\("], waived = false },
  { id = "VT-2", expects = "The layered surface is proved through the spawned binary: precedence, the user layer, the walk-up and its terminus, the worktree, no repository, shadowing both ways round, absent versus unreadable, the dash row, the listing's exit 0, the broken winner's exit 1, no store created (both halves) and design §7's four preserved behaviours (RV-029 F-10, F-11, F-12, F-17).", test_file = "tests/conventions.rs", keywords = ["fn the_project_set_beats_the_user_set_beats_the_binary", "fn a_set_that_exists_only_in_the_config_home_resolves", "fn the_walk_up_finds_the_repositorys_set", "fn a_worktree_is_a_repository", "fn the_walk_stops_at_the_repository", "fn no_repository_means_the_cwd_and_no_walk_up", "fn a_broken_project_set_shadows_a_good_user_set", "fn a_failed_row_behind_a_working_one_keeps_its_reason", "fn an_absent_layer_is_not_an_error", "fn an_unreadable_layer_exits_one", "fn a_bare_markdown_file_lists_with_a_dash", "fn the_listing_reports_a_broken_file_and_succeeds", "fn the_two_roots_disagree_on_purpose", "fn the_command_still_creates_no_store", "fn an_unknown_name_still_exits_two", "fn json_without_a_name_is_still_a_usage_error", "fn an_unknown_format_is_still_refused_before_the_operand", "fn the_seed_is_one_compact_line"], waived = false },
  { id = "VT-3", expects = "The binary is the only reader of the environment, in one `roots()` function, and it threads its roots through `dispatch` to the loader.", test_file = "src/main.rs", keywords = ["fn roots", "Roots", "XDG_CONFIG_HOME", "&roots"], waived = false },
  { id = "VT-4", expects = "The guide states where a set is found and that a set that could not be loaded is exit 1, each pinned by a whole-sentence test rather than by a keyword that a line break could break.", test_file = "src/learn.rs", keywords = ["fn the_guide_states_where_a_set_is_found", "fn the_guide_exit_table_names_an_unloadable_set"], waived = false },
  { id = "VT-5", expects = "The store format's one clause stops claiming the binary is the only source, without touching the leaf path or the nothing-inside-.smut promise.", test_file = "docs/store-format.md", keywords = ["may supply more"], waived = false },
  { id = "VT-6", expects = "The CLI's own description of `conventions` stops claiming the set is embedded, so the help cannot lie about where the bytes come from.", test_file = "src/cli.rs", keywords = ["fn the_conventions_help_does_not_claim_the_set_is_embedded"], waived = false },
  { id = "VA-1", expects = "Run `cargo test`, `cargo test --test conventions`, `cargo clippy --all-targets -- -D warnings` and `cargo fmt --check`, then `just check`; record the results, and record the exit code and message of each new refusal path from a real run rather than from a test assertion alone." },
  { id = "VA-2", expects = "Walk design §7 row by row against the suite, recording for each row the test that would go red — and naming the rows this phase does not yet cover, which are the seed rows PHASE-05 owns. Coverage is verified against the artefact, never inferred from a green run. Record also, in the same walk, that `std::env::` appears in `src/main.rs` only inside `roots()` — the grep that proves the environment read did not land in `dispatch`." }
]
