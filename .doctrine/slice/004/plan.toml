# Implementation plan for SL-004 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-004"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
[[phase]]
id        = "PHASE-01"
name      = "Establish the loaded-identity invariant"
objective = "Add eager recursive stored-identity validation using reference_id and the current ENTITY_ID, with unambiguous file/path corruption errors; preserve the existing key and format until PHASE-02."
entrance_criteria = [
  { id = "EN-1", text = "The locked design sections 1-5, section 6's linear-work and path-allocation constraints, DEC-021 and STD-001 are read; this phase introduces no new public error variant; the existing Store::load root checks and reference_id rule match their current source." },
  { id = "EN-2", text = "Baseline checks are green or any pre-existing failure is isolated and reported; preserve the operator's staged and unstaged README changes and keep them out of unrelated commits." },
  { id = "EN-3", text = "Tests can construct malformed stores in scratch directories using ENTITY_ID, without touching the operator's live store or changing the format version." }
]
exit_criteria = [
  { id = "EX-1", text = "A private validate_identity_tree helper in src/store/mod.rs walks parsed objects/arrays using reference_id after root checks and before snapshot insertion; it does not stop at a valid reference-shaped object, it still descends into the values of an ordinary id, and it neither re-reads the file nor clones entity subtrees; scan_refs remains non-fallible." },
  { id = "EX-2", text = "Malformed nested identity is StoreError::Corrupt, exit 1, naming the entity basename and the JSON-quoted bracket path to the identity member from a $ root marker (for example $[\"payload\"][\"tags\"][2][\"smut_id\"]), with the reason reading identity at <path> must be a nonempty string; request malformation remains exit 2." },
  { id = "EX-3", text = "Both get and traversal refuse malformed stored identity even outside the followed field; existing root-check precedence, no-repair behavior and reference-target permissiveness remain." },
  { id = "EX-4", text = "The corruption rule, path notation and worked diagnostic this phase introduces are recorded in the phase evidence as pending PHASE-02 material, and docs/store-format.md is left untouched while it still declares format version 1, so no version in the format document states a rule its released reader did not enforce; focused and repository checks are green." },
  { id = "EX-5", text = "No tree of this phase is a release candidate or a supported reader of any version-1 store: it is not tagged or published, it is run only against scratch stores, and the stricter loader enters service only with PHASE-02's version bump. The phase evidence records both the rule the tree enforces and the absence of any release or live-store use." }
]
verification = [
  { id = "VT-1", expects = "Store corruption tests cover invalid nested identity under objects/arrays, a malformed identity reached inside an ordinary id-valued object, JSON-escaped paths, lexical/positional first failure, unchanged entity/index bytes and preserved root-check precedence; the injected malformed identity is written with the phase's literal key spelling rather than the constant, so its semantic target is visible in the diff and cannot flip silently when the key moves.", test_file = "tests/store_corruption.rs", keywords = ["nested_identity", "identity_path", "ENTITY_ID", "StoreError::Corrupt"], waived = false },
  { id = "VT-2", expects = "CLI tests prove get and follow both fail with empty stdout and exit 1 for malformed persisted identity; an analogous request is exit 2.", test_file = "tests/cli_contract.rs", keywords = ["malformed_stored_identity", "follow", "get"], waived = false },
  { id = "VT-3", expects = "The private load-boundary validator calls the shared identity predicate and is covered by the corruption tests; no independent identity rule or traversal Result plumbing is introduced.", test_file = "src/store/mod.rs", keywords = ["validate_identity_tree", "reference_id"], waived = false },
  { id = "VA-1", expects = "Run cargo test --test store_corruption --test cli_contract and just check; retain actual test results separately from verify-vt's source-presence mandates." },
  { id = "VA-2", expects = "Review the phase's recorded diagnostic text and path notation against the actual emitted errors under STD-001; the index/manifest versions and ENTITY_ID value have not yet moved, and scan_refs retains its validated-input interface." },
  { id = "VA-3", expects = "The inline mod tests in src/store/mod.rs drive validate_identity_tree over a parsed malformed value, so the shape mandate is backed by an executed test and not a signature; the walk stays linear over the already-parsed entity with no re-read or re-parse, and the diagnostic path allocates only the traversal path and the final error." }
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-02"
name      = "Move structural identity and the store format together"
objective = "Change ENTITY_ID to smut_id and both store versions to 2, adapt all structural inputs/outputs, fixtures and current normative/human documents, and prove ordinary id remains data without changing graph content."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01/EX-1 through EX-5 hold and the loader regression suite is green; read design sections 1-6, ADR-001, DEC-020, DEC-022, DEC-023, DEC-024, DEC-026, DEC-028, STD-001 and STD-002 (the version-discipline invariant this phase discharges by bumping both constants)." },
  { id = "EN-2", text = "Before fixture edits, record an immutable Git revision containing the original interview array and read that original into scratch space; record its entity count and confirm no pre-existing smut_id key would make the inverse mapping ambiguous." },
  { id = "EN-3", text = "README.md's surrounding prose is out of this slice's write scope and stays the operator's 0.2 rewrite (CHR-001); the phase neither sweeps nor stages it and leaves their working-tree changes untouched. Its single exact-fenced console block is in scope and part of the gate, because tests/readme_example.rs executes it: before running the gate the phase confirms that block carries smut_id, whether CHR-001 landed it first or the phase edits only that block." },
  { id = "EN-4", text = "Before either version constant moves, the operator's live store (interview.local/.smut, whose id set measured identical to the committed fixture) has an agreed re-declare path recorded in the phase evidence, and the operator has acknowledged that it stops loading at this phase." },
  { id = "EN-5", text = "SL-005's refusal phase (IMP-010/ISS-004 under DEC-027) has either landed before this phase starts or this work is rebased onto it: SL-005 adds a Reject variant, its Display arm and tests to src/error.rs, the same file EX-9 edits, so the two cannot land blind to each other." }
]
exit_criteria = [
  { id = "EX-1", text = "ENTITY_ID retains its name and has literal wire value smut_id; entity/reference recognition, root generation, projection, serialization, changes[].smut_id and the conventions JSON seed use it, and no production literal that constructs the wire envelope spells the key outside ENTITY_ID itself - the change-receipt subject and the conventions seed are raw literals today and are routed through the constant, while the guide's prose is the deliberate exception because it states the spelling rather than emitting it. Internal value/type names and response containers stay unchanged, and no identity module or alias is added." },
  { id = "EX-2", text = "Ordinary id values survive at roots and at depth, including mixed id/smut_id objects; identity predicates/projections use smut_id, while id behaves as an ordinary queried field under existing patch rules, including the top-level \"DROP\" sentinel applied to an ordinary id." },
  { id = "EX-3", text = "Both format-version constants are 2, every version literal in a store-building test is 2, and every old-version refusal fixture names 1 explicitly - including tests/traversal.rs's rebuilt index and the unknown-version case, which stops using 2 as its unknown value; old indexes fail cleanly by version and old committed manifests fail before staged puts/removals replay. Existing recovery order, layout and durability protocol remain." },
  { id = "EX-4", text = "The committed fixture differs only in structural identity keys: inverse comparison recovers the original parsed data with numeric representation distinctions, values and array order preserved; demonstrate rejection of an altered copy, and re-derive every assertion that reads the committed fixture - including the hardcoded cluster ids and count-sensitive expectations in tests/fixture.rs - against the adapted array." },
  { id = "EX-5", text = "The normative brief, docs/store-format.md, learn, tests/fixtures/interview/PROVENANCE.md and affected test expectations consistently describe the new identity/version rules: the format document ends the phase with one identity spelling and one version pair, its version lines, index and manifest examples, canonical-bytes sentences and both worked diagnostics all moved; the guide states in one clause that older stores are refused and that there is no migration, without pinning a release or format figure, warns that a payload field named smut_id is still interpreted structurally so such a payload cannot be stored verbatim, changes no heading, reorders nothing, adds no section and gives each new rule exactly one home section; and the format document states that the store layout reserves nothing for conventions, which live under .config/smut/conventions/ in the project, user or binary layer and never inside .smut/ (DEC-026, DEC-028). The brief's unfinished 1.0 requirements and historical fixture prose remain intact. README.md's prose is the operator's 0.2 rewrite (CHR-001) and is neither edited nor gated here; its single executed block is, so it carries smut_id by the gate run (EN-3)." },
  { id = "EX-6", text = "Residual id uses in the code-impact set are classified by meaning, not banned; existing examples and regressions plus new behavior cases pass just check, and no unrelated test is removed or weakened." },
  { id = "EX-7", text = "The old-manifest refusal fixture begins with an otherwise-readable version-2 store and is paired with an equivalent readable-manifest fixture that successfully replays its puts/removals. Assert the failure names the manifest/version gate, not an unrelated index error; actual new index and manifest documents both carry version 2." },
  { id = "EX-8", text = "A stored entity whose nested ordinary id carries null, empty string, number, array or object loads and is served at exit 0 by both get and traversal, while the same values under smut_id are corruption at exit 1 with the bracketed path; a where on ordinary id selects only entities carrying id as data, so a caller still sending the old spelling gets an empty result at exit 0, and the guide states that a field no entity carries fails every operator exactly as a missing field on one entity does (DEC-027)." },
  { id = "EX-9", text = "Every identity-naming diagnostic names smut_id: the Reject::InvalidId message, the StoreError::IdDisagreement message, describe()'s absent-identity text and the scan_refs assertion. docs/store-format.md quotes the updated strings verbatim, and the index refusal keeps the wording smut: the store index has format_version 1, and this build reads only 2." },
  { id = "EX-10", text = "Rendered output for an entity carrying both smut_id and an ordinary id is pinned: the suppression set is the identity constant, so the ordinary id now renders as an attribute under --show-fields and smut_id does not; the phase records the before/after render bytes and any rendered example in the guide agrees with the new output." }
]
verification = [
  { id = "VT-1", expects = "Pin the independent literal wire contract and structural canonical ordering, including smut_id beside lexically earlier ordinary keys.", test_file = "src/entity.rs", keywords = ["ENTITY_ID", "smut_id", "wire_contract"], waived = false },
  { id = "VT-2", expects = "Public round trips prove ordinary id data, root generation versus nesting, mixed identity/data predicates and projections, the renamed change receipt with an entity-shaped previous and --compact, a where on ordinary id returning only id-as-data while the old spelling returns an empty result at exit 0, DROP applied to an ordinary id, and the unchanged frontier, depths, edges and dangling containers.", test_file = "tests/cli_contract.rs", keywords = ["ordinary_id", "smut_id", "changes", "select"], waived = false },
  { id = "VT-3", expects = "Version-1 index refusal names found/expected versions and exits 1; literal-key paired cases prove a nested ordinary id of null, empty string, number, array or object loads and is served at exit 0 while the same values under smut_id are corruption at exit 1 with the bracketed path; the unknown-version case no longer uses 2 as its unknown value.", test_file = "tests/store_corruption.rs", keywords = ["format_version", "smut_id", "UnknownFormatVersion"], waived = false },
  { id = "VT-4", expects = "An old committed manifest cannot replay staged puts/removals; valid new-format recovery still runs through the established interruption suite.", test_file = "tests/durability_crash.rs", keywords = ["old_manifest_not_replayed", "MANIFEST_FORMAT_VERSION"], waived = false },
  { id = "VT-5", expects = "The conventions JSON seed uses structural smut_id while retaining its fixed public id and upsert behavior.", test_file = "tests/conventions.rs", keywords = ["smut_id", "conventions-hygiene"], waived = false },
  { id = "VA-1", expects = "Compare the inverse-renamed fixture with its recorded Git original using serde_json structural equality, preserving 1 versus 1.0 and array order. Observe an altered target/value or reordered-array copy rejected; keep the baseline revision, exact command and results in slice evidence without committing a second fixture." },
  { id = "VA-2", expects = "Run just check, including default/fault-injection tests and the guide examples its fixture suite executes; review the full diff and classify residual structural id uses across source, tests, current docs, the normative brief and tests/fixtures/interview/PROVENANCE.md, starting from the repo-wide occurrence count rather than the slice's earlier figure. Check that the wire spelling appears in production code only at ENTITY_ID. Confirm README.md's surrounding prose carries no edit, sweep or staging by this slice — it is the operator's 0.2 rewrite (CHR-001) — while its single executed block does carry smut_id, which is what keeps the gate green; review the format document's conventions-layout statement against DEC-026 and DEC-028." },
  { id = "VA-3", expects = "Review docs/store-format.md under STD-001 in the same version-bump change: both versioned documents, canonical bytes, nested-identity corruption and diagnostic examples agree with code. Review the brief as normative and learn as version-matched." },
  { id = "VT-6", expects = "Paired old/readable-manifest cases discriminate version refusal from successful replay on an otherwise-readable store, so a no-op recovery fixture cannot pass both.", test_file = "tests/durability_crash.rs", keywords = ["old_manifest_not_replayed", "readable_manifest_replays"], waived = false },
  # VT-7 and VT-8 append the pre-implementation review's behavioural homes for
  # the guide's prose pins and the renderer. They follow VT-6 because ids are
  # immutable and append-only; the out-of-order position is not a stray.
  { id = "VT-7", expects = "The guide's prose pins assert that smut_id is structural, an ordinary id is data, a payload field named smut_id cannot be stored verbatim, identity predicates and projections use smut_id, older stores are refused with no migration offered, and a query on the old spelling returns nothing wherever no entity carries id as data, rather than an error.", test_file = "src/learn.rs", keywords = ["smut_id", "ordinary id", "migration", "nonempty string"], waived = false },
  { id = "VT-8", expects = "An entity carrying both smut_id and an ordinary id renders the ordinary id as an attribute under --show-fields while smut_id stays suppressed.", test_file = "tests/render.rs", keywords = ["ordinary_id", "show_fields", "smut_id"], waived = false }
]
specs = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Assemble integrated evidence and the reconciliation handoff"
objective = "Prepare the six targeted decision amendments for the audit/reconcile seam and independently recheck the integrated format-2 lifecycle, fixture preservation, documentation and regression evidence before audit."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02/EX-1 through EX-6 and EX-8 through EX-10 hold; the version-2 implementation and normative/human documents are green, and the original fixture baseline/equivalence evidence is available." },
  { id = "EN-2", text = "Read design sections 4-6, DEC-025 and both facet/prose halves of DEC-005, DEC-007, DEC-010, DEC-016, DEC-002 and DEC-012 using doctrine show. RV-023 contains no routed instrument findings to transcribe." },
  { id = "EN-3", text = "PHASE-02/EX-7 paired recovery discrimination and actual version-2 index/manifest evidence are available." }
]
exit_criteria = [
  { id = "EX-1", text = "A precise per-record amendment proposal maps old and new facet/prose passages for all six decisions, with dated ADR-001/SL-004 notes and unchanged rationale identified. DEC-005 explicitly frees ordinary id, cites DEC-021 and corrects its quoted reference_id signature to the code's Reject error type; DEC-007/010/016 and DEC-002/012 examples use the new key. Keep the accepted records untouched until formal reconciliation, as design section 4 requires." },
  { id = "EX-2", text = "Fresh scratch-store evidence covers a version-2 declare/query/render/delete lifecycle with structural smut_id and ordinary id, old-index refusal, old-manifest no-replay and the malformed nested-identity get/follow refusal with file/path." },
  { id = "EX-3", text = "Fixture equivalence is independently repeatable from the recorded original revision, residual id classifications identify the six decisions' pending reconciliation targets as well as code/docs, and the complete repository gate passes on the implementation tree." },
  { id = "EX-4", text = "Notes retain the actual commands/results, original fixture revision, document review and unresolved audit work. No migration, minting/rename verb, short flags, Mermaid, new dependency or any README.md edit beyond PHASE-02's authorised executed block is introduced: the surrounding prose is the operator's 0.2 rewrite (CHR-001) and lands outside this slice." }
]
verification = [
  { id = "VA-1", expects = "Read all six current decisions via doctrine show and compare each proposed facet/prose amendment against it. Verify the precise identity-rule reversal, projection/recipe/format consequences, unchanged response containers and retained unrelated decisions; hand the mapping to audit for its reconciliation brief." },
  { id = "VA-2", expects = "Run fresh CLI lifecycle and refusal probes in scratch directories, independently repeat fixture equivalence from the recorded Git original, and record concrete output/exit classes without touching a live store." },
  { id = "VA-3", expects = "Run just check and doctrine slice verify-vt 4; a source-presence mandate passing is not evidence that its behavioral tests ran. Inspect the final diff, documentation ownership and residual classifications." },
  { id = "VA-4", expects = "Review the normative brief, the guide and docs/store-format.md against the final binary and STD-001; confirm code/doc version agreement and unfinished 1.0 scope is retained. README.md's surrounding prose is the operator's 0.2 rewrite (CHR-001) and is outside this review, while its single executed block carries smut_id and is what keeps the gate this phase runs green. Formal audit follows; reconcile then lands and verifies the accepted decision amendments before closure. Phase completion is not slice closure." }
]
