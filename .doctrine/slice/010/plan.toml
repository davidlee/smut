# Implementation plan for SL-010 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-010"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Four phases, in the order the design's own risk sits in: the compiler can be
# proved alone (a pure function with a table for a contract) and is taught in two
# sessions — the token and merge rules first, the flag and refusal vocabulary
# second; the verb can only be proved end to end, and the guide can only be proved
# once there is a command to type. PHASE-04 sits between PHASE-01 and PHASE-02 in
# the array because phase ids are append-only: the id sequence is non-monotonic
# and that is expected, and its criteria keep the ids they were written with.
# Each phase carries the routed obligations of RV-031 findings it settles; the
# finding ids are cited inline in the criteria text below.

[[phase]]
id        = "PHASE-01"
name      = "The compiler's core — words to a specification object"
objective = "`src/dsl.rs` compiles one argv token line into the specification object design §2 defines, exhaustive over §1's tokens and §2's merge rules and silent about the store: `Line`, `Flags`, `compile`, `value` and the operator table. Every line of words the guide will print equals the JSON it denotes, asserted as `Spec` equality. The twelve flags, the comma-list rule and the refusal vocabulary are PHASE-04's, which follows; this phase carries the two refusals `compile` cannot return without."
entrance_criteria = [
  { id = "EN-1", text = "design.md read whole at revision 35; §1's token table and classification flowchart and §2's `Line`/`Flags`/`compile`/`value` with its three merge rules are this phase's specification — the tokens, the character constraint, the classification order, the value rule, the merge rules. The twelve flags, the list rule and §3's message rows are PHASE-04's." },
  { id = "EN-2", text = "src/spec.rs read: `parse(&Value)` is the only ingress, the `parse_*` helpers are private, and the compiler therefore builds a JSON object and never a `Spec`. A widening of that surface is out of scope (DEC-038)." },
  { id = "EN-3", text = "src/predicate.rs's `contradiction` and its seven descriptions read, and src/error.rs's `ContradictoryFieldConditions` `Display` arm read: this phase supplies a description, not a variant, for the two cases it inherits (RV-031 F-2, F-4)." },
]
exit_criteria     = [
  { id = "EX-1", text = "`src/dsl.rs` exists with the `//!` header naming DEC-034…DEC-041, and `src/lib.rs` exports it. `Line`, `Flags`, `compile` and `value` carry the doc comments design §2 prints, including the JSON-string-literal exclusion and its double-unquoting reason." },
  { id = "EX-2", text = "Token classification, in the design's stated order: a token whose first character is `{` is refused with the JSON-operand sentence (RV-031 F-1); else a token carrying no operator is a root; an empty field — `=open` — is refused with `a condition is field, operator and value`, while an empty value on `=` is the empty string; exactly one operator splits field from value; more than one is refused naming the token and both operators. An empty line compiles to `{}`, every entity subject to the default limit, because there is no defect to refuse. The JSON-operand and ambiguous-token variants are declared here, with their `Display` arms, because `compile` cannot return without them; PHASE-04 EX-8 owns the six-variant catalogue, the remaining four and every message test." },
  { id = "EX-3", text = "Value typing: a JSON boolean, number or null becomes that literal; everything else stays its own text, including `007`, `+1`, `0x10`, `1_000`, `v1.2` and any token containing quote characters; `1.0` and `1e3` are numbers. `status=` is the empty string, accepted." },
  { id = "EX-4", text = "Merge into a `BTreeMap`-ordered `where`: one condition per operator per field. An exact repeat collapses into the condition already there; two differing `=` are refused as `ContradictoryFieldConditions` with a description naming the operator and no operand literal; a second `!=` or `~` is refused in the caller's own tokens, because the emitted object cannot carry it (RV-031 F-2). `status=open status!=resolved` compiles to `{\"status\":{\"$eq\":\"open\",\"$ne\":\"resolved\"}}` and `spec::parse` accepts it; answering it at exit 0 is PHASE-02 EX-4's (RV-031 F-3)." },
  { id = "EX-5", text = "`--has` and `--missing` merge into the same `where` as token conditions, and on one field they are refused rather than overwritten, with `$exists is given both true and false` (RV-031 F-4)." },
  { id = "EX-11", text = "The repo's gate is green: `cargo test`, the linter and the formatter, with no warnings." },
]
verification      = [
  { id = "VT-1", expects = "the equivalence spine: each guide recipe's token line compared against the `EXAMPLE_*_Q` constant it shares with the guide, so the table's literals are the printed ones, and compiled from words equal to the `Spec` its JSON denotes; value typing rows for `true`, `false`, `3`, `-2`, `null`, `007`, `v1.2`, `1.0` and a quoted-looking token; and an empty line compiling to `{}`", test_file = "tests/dsl.rs", keywords = ["a_line_of_words_equals_the_specification_it_denotes", "a_value_is_a_json_literal_only_when_it_is_one", "a_quoted_looking_token_keeps_its_quotes", "an_empty_line_compiles_to_the_empty_specification"], waived = false },
  { id = "VT-2", expects = "the merge rules: identical repeats collapse, two differing `=` are a contradiction not an `$in`, a second `!=`/`~` is refused in the caller's tokens, `null` and `--missing` are different requests, and the satisfiable pair's object is accepted by `spec::parse` — its exit code is PHASE-02 VT-3's", test_file = "tests/dsl.rs", keywords = ["two_equals_on_one_field_is_a_contradiction_not_an_in_list", "null_and_missing_are_different_requests"], waived = false },
  { id = "VA-1", expects = "`src/dsl.rs` is a pure function over its argument line: no `Store`, no filesystem, no environment, no `std::env` — checked by reading the module, since the type signature alone does not prove it", waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-04"
name      = "The flag and refusal vocabulary — twelve flags, one list rule, six variants"
objective = "`src/dsl.rs` gains the rest of the surface design §1 and §3 define — the twelve flags and their keys, the one comma-list rule serving seven consumers, the strictness rules and the shorthand conflicts — and `src/error.rs` gains the six `Reject` variants with a whole-rendered-line test apiece. Each numeric flag's text goes through the same `value()` a token gets, so `--depth 2` emits the number `2` and clap parses nothing; every refusal is a sentence this front-end owns or the specification's own, unmodified."
entrance_criteria = [
  { id = "EN-1", text = "design.md revision 35 §1's flag table and character constraint, §2's flag section and §3's three refusal tables are this phase's specification; §2's `Flags` struct is its input and §3's fifteen rows are its message census." },
  { id = "EN-2", text = "PHASE-01 complete: token classification, `value()` and the merge rules exist and `cargo test --test dsl` is green, so this phase adds vocabulary to a working compiler rather than starting one." },
  { id = "EN-3", text = "src/error.rs's `Reject` enum and its `Display` arms read, and `ContradictoryFieldConditions` read in full: the two-`=` and `$exists` cases reuse it with a description the detector supplies (RV-031 F-11), and the remaining situations get variants of their own." },
]
exit_criteria     = [
  { id = "EX-6", text = "One comma-list rule serves every list on the surface — `=`, `--select`, `--follow`, `--backlinks`, `--has`, `--missing`, `--order` — and it is pinned at the token that carries it, not at the list: an empty member is refused naming that token; `any` is accepted only as a whole value and refused inside a list; a comma list on `!=` is refused with its own sentence, and one on `~` in the same shape — `cannot read \"title~a,b\": a comma list means one of them, which ~ cannot express; write two conditions or use smut query` (A-D1); and an empty flag value (`--follow=`, `--select=`, `--from=`) is one empty member, refused naming the flag (RV-031 F-5)." },
  { id = "EX-7", text = "The twelve flags each set their key: `--follow` and `--backlinks` carry `any` as `\"*\"`; `--depth` and `--budget` with no direction are refused naming the flag that was typed; `--order title` defaults its direction to `asc`; `--select a,b` is an array; `--edges` is `true`; `--limit all` is refused naming `get`; `--ids` beside `--select` is refused naming both flags; `--from=ID` appends to `from` after the bare roots (RV-031 F-5, F-7)." },
  { id = "EX-8", text = "`src/error.rs` gains the six variants design §6 enumerates — a malformed or ambiguous token, a JSON operand, a missing direction, a direction outside `asc`/`desc`, an unreachable limit, a conflicting selection — each with a `Display` arm and one whole-rendered-line message test, and the ambiguous-token variant carries the reason so design §3's two more-than-one-operator rows stay distinguishable: a token carrying two `=` reports the field-name row (`cannot read \"a=b=c\": a field name holding = is outside q's grammar; use smut query`), and a token whose operators differ in kind reports the both-operators row (`cannot read \"status~a=b\": it carries both ~ and =; use smut query …`) (A-D2). The two-`=` and `$exists` cases reuse `ContradictoryFieldConditions` (RV-031 F-11); nothing is a substring assertion." },
  { id = "EX-9", text = "The numeric flags arrive as text and are converted by the same `value()` rule a token gets, so `--depth 2` emits the number `2` and `--depth abc` emits the string `\"abc\"`; `--depth abc` and `--depth=-1` therefore both reach the specification's own sentence, `depth must be a nonnegative integer`, through `spec::parse`, and clap parses nothing. `--limit all` is refused by this front-end before that call, naming `get`, and never by `spec::parse` (RV-031 F-7)." },
  { id = "EX-10", text = "Refusal selection is deterministic: tokens are read in source order and flags in a fixed order, so a line with two defects always reports the same one, and the same argument line compiles to the same bytes twice in a row with `where` keys in `BTreeMap` order. A line whose only defects are the specification's is decided by `spec::parse`'s lexical key order, and the two orders never race because the whole object is compiled before `parse` is called." },
  { id = "EX-11", text = "The repo's gate is green: `cargo test`, the linter and the formatter, with no warnings." },
]
verification      = [
  { id = "VT-3", expects = "every refusal: one whole-rendered-line test per variant, the design §3 rows carried by name — a token carrying two operators, `=open`, `status=a,,b`, `status!=a,b`, two `=`, a `{` token, `--limit all`, `--ids` beside `--select`, `--depth` with no direction, a second `!=`/`~`, `--has` with `--missing`, a direction outside `asc`/`desc`, `title~a,b` and the field-name row `a=b=c` — plus determinism of the selected defect and of the compiled bytes, and each row's test naming the change that reddens it", test_file = "tests/dsl.rs", keywords = ["every_refusal_names_what_was_typed_and_never_a_field_it_invented", "the_same_two_defects_refuse_the_same_one_every_time", "each_refusal_test_names_the_change_that_reddens_it"], waived = false },
  { id = "VT-4", expects = "the flag vocabulary: `--depth 2 --follow any` compiles to `{\"depth\":2,\"follow\":\"*\"}` — a number, not its text — `--depth abc` compiles to the string, `--order title` defaults to `asc`, `--select a,b` is an array, `--edges` is `true`, `--from=ID` appends after the bare roots, and `--follow=` is refused naming the flag", test_file = "tests/dsl.rs", keywords = ["a_flag_sets_the_key_it_names", "a_list_flag_is_a_list_and_an_empty_one_is_refused"], waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-02"
name      = "The verb — one pipeline, one envelope, one refusal vocabulary"
objective = "`smut q` is an eighth `Sub` variant whose bare positional carries no clap attribute, and whose arm compiles the line, parses the object and hands the `Spec` to the `Request::Query` the machine verb builds — before any store exists (DEC-004 step 1). Its stdout is byte-identical to `smut query` for the traversing and `--ids` recipes, its exit codes are the specification's, and nothing about `smut render` moves."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 complete: `dsl::compile` exists with its twelve flags and its refusal vocabulary witnessed, and `cargo test --test dsl` is green." },
  { id = "EN-2", text = "src/cli.rs read at the `Sub` enum, the `parse` entry point and the `Request::Query` arm, so the new variant lands beside its neighbours rather than in a new layer; `src/main.rs`'s dispatch read to confirm no arm is needed (DEC-004)." },
  { id = "EN-3", text = "The clap shape read against design §4's table: the bare positional, the seven observations, and the four silent alternatives (`trailing_var_arg`, `allow_hyphen_values`, `last`, `value_terminator`) whose refusal DEC-037 records — read from evidence, because EX-1 requires the comment that names them." },
]
exit_criteria     = [
  { id = "EX-1", text = "`Sub::Q` carries `tokens: Vec<String>` with no `#[arg]` attribute at all, so clap derives `TOKENS` from the field name and the usage line reads `Usage: smut q [OPTIONS] [TOKENS]...`, plus the twelve flags. A comment above the field names the four attributes DEC-037 refutes — `trailing_var_arg`, `allow_hyphen_values`, `last`, `value_terminator` — and why each silent failure is unreachable. (Design §4's struct block still prints `#[arg(value_name = \"TOKEN\")]`; the prose is the decision and the block owes the deletion — see plan.md's corrections owed.)" },
  { id = "EX-2", text = "The arm builds a `Line`, calls `dsl::compile`, calls `spec::parse`, and returns `Invocation::Request(Request::Query(..))`. No `Store` is opened, locked or recovered before the specification validates (DEC-004)." },
  { id = "EX-3", text = "Tokens and flags interleave in any order and keep source order; `--` reaches a hyphen-leading id; `--from=ID` appends after the bare roots; a token directly after a value-taking flag is that flag's value (`q --follow session status=open` is `follow: \"session\"`, not a root named `session`); and `~`, `!` and `,` reach the compiler verbatim, so `q title~graph status!=open status=open,resolved` keeps all three (RV-031 F-8)." },
  { id = "EX-4", text = "Exit codes: every refusal exits 2; `status=open status!=resolved` exits 0 with the envelope its `query` twin produces; `status=open status!=open` exits 2 from `predicate::parse`, the same line a JSON caller gets (RV-031 F-3)." },
  { id = "EX-5", text = "Numeric flags reach the specification's own messages end to end: `--depth abc`, `--depth=-1`, `--limit 0` and `--budget 0` each exit 2 with the specification's sentence (RV-031 F-7)." },
  { id = "EX-6", text = "clap's refusals are unchanged and named rather than counted: an unknown flag, a hyphen-leading token without `--`, and a repeated flag are clap's own render, and an unknown subcommand still prints this binary's one sentence with no near names (RV-031 F-9)." },
  { id = "EX-7", text = "Byte identity: `smut q <line>` and `smut query <json>` produce identical stdout for the traversing and `--ids` recipes; the filtering pair is asserted to agree on the selected set, and no test claims more (RV-031 F-6)." },
  { id = "EX-8", text = "In a directory with no store `smut q` exits 1, and the test pairs it with a `declare` in the same directory so the assertion discriminates (DEC-004)." },
  { id = "EX-9", text = "`smut render` is untouched: its operand shape and display flags do not move and its suite is green (RV-031 F-10). The diff evidence for it and for every other path design §6 lists as unchanged is VA-1's single check, not a per-file one." },
  { id = "EX-10", text = "`tests/compatibility.rs` is untouched and green; the 0.1 and 0.2 pins prove the machine surface did not move (DEC-011), and its absence from the diff is VA-1's check." },
  { id = "EX-11", text = "The repo's gate is green: `cargo test`, the linter and the formatter, with no warnings." },
]
verification      = [
  { id = "VT-1", expects = "the two-call recipe reads the same both ways, and `q` creates no store while a `declare` beside it does", test_file = "tests/cli_contract.rs", keywords = ["the_two_call_recipe_reads_the_same_both_ways", "q_creates_no_store_and_a_declare_beside_it_does"], waived = false },
  { id = "VT-2", expects = "tokens keep their order around flags, `--` reaches a hyphen id, a token after a value-taking flag is its value, `~`/`!`/`,` reach the compiler verbatim, ids and `--select` refuse each other, and depth without a direction is refused while the specification accepts it", test_file = "tests/cli_contract.rs", keywords = ["tokens_keep_their_order_around_flags", "a_token_after_a_value_flag_is_that_flags_value", "operators_and_commas_reach_the_compiler_verbatim", "ids_and_select_cannot_both_be_asked_for", "depth_without_a_direction_is_refused_while_the_specification_accepts_it"], waived = false },
  { id = "VT-3", expects = "the exit-code pair design §7's refusal table pins: `status=open status!=resolved` exits 0 with the envelope its query twin produces, and `status=open status!=open` exits 2 from `predicate::parse` with the same line a JSON caller gets — plus `--depth abc`, `--depth=-1`, `--limit 0` and `--budget 0` exiting 2 with the specification's own sentences", test_file = "tests/cli_contract.rs", keywords = ["a_same_value_contradiction_speaks_the_specifications_sentence", "the_specifications_own_messages_reach_the_human"], waived = false },
  { id = "VA-1", expects = "run one `git diff --stat <slice base> -- src/spec.rs src/predicate.rs src/main.rs src/render_markdown.rs src/select.rs src/walk.rs src/order.rs docs/store-format.md tests/compatibility.rs` and confirm it prints nothing, `<slice base>` being the commit the slice started from rather than the working tree or the branch tip; confirm no phase staged `README.md` (CHR-001); and read that no `Store` is constructed on the `q` path before `spec::parse` returns", waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-03"
name      = "The guide — both spellings, both executed"
objective = "`smut learn` teaches the short form before the specification chapter (DEC-010), prints the two-call recipe in both spellings with the JSON one line below, states the two warts and the field silence where they bite, lists `q` in its own `Commands` block, keeps `query` described as the complete surface, and `tests/fixture.rs` runs the DSL recipes as token lists so a printed line that stops working fails the suite."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 complete: `smut q` runs end to end and its contract suite is green, so a printed DSL line is a command someone can type." },
  { id = "EN-2", text = "src/learn.rs read whole — the `GUIDE` string, the three `EXAMPLE_*` constants and the sentence tests — and tests/fixture.rs read at `Declared::query` and the `IDS` substitution, because DEC-016 pins the recipe in three places and all three move together." },
  { id = "EN-3", text = "DEC-016's pinned wording read, and the amendment it owes recorded in notes.md rather than paid here: the guide keeps both spellings executed until reconcile." },
]
exit_criteria     = [
  { id = "EX-1", text = "A short-form section sits before the `Querying` heading (`src/learn.rs:109`) — not inside the `Querying`…`Traversal` span — and its prose carries no two-space `name:` line in that span, so `the_guide_teaches_exactly_the_ten_keys` (`src/learn.rs:599-616`) stays untouched and green: the one rule in a sentence, the five token shapes as a table, the twelve flags, the three character consequences (`any`, `--has`/`--missing`, no `:` infix), and the two boundary sentences naming what the short form cannot say and that `smut query` can. The `Commands` block (`src/learn.rs:41-52`) gains `smut q <TOKEN>...` and the no-store sentence (`:57`) names `q`. The hot-path recipes' lengths are re-measured against IDE-006's table rather than copied from it." },
  { id = "EX-2", text = "`EXAMPLE_TRAVERSE_Q`, `EXAMPLE_FOLLOW_Q` and `EXAMPLE_FILTER_Q` sit beside the JSON constants; the two-call recipe is printed in both spellings with the JSON one line below; the filter twin is `--ids`, and the sentence says roots are this surface's spelling of the `$in` filter and that the two agree on the selected set, not on order (RV-031 F-6)." },
  { id = "EX-3", text = "The two warts are stated where they bite: a value that is a JSON scalar is that scalar, with `--ids`, `--from=ID` and `smut query` named beside it; `~` is substring on a string and member on an array, with no signal in the answer. The field-silence sentence is present." },
  { id = "EX-4", text = "`tests/fixture.rs` gains a token-list runner beside the `&Value` path and the `IDS`-as-token-list substitution, and both spellings of the recipe are executed by it. The runner asserts the constants are the lines the other suites compile: it checks `smut learn` prints `EXAMPLE_TRAVERSE_Q`, `EXAMPLE_FOLLOW_Q` and `EXAMPLE_FILTER_Q` verbatim and splits each into the token list it hands `smut q`; `tests/dsl.rs` (PHASE-01 VT-1) and `tests/cli_contract.rs` each compare their own literal token line against the same constant imported from `smut::learn`. A constant edited in one place and not the other therefore fails a suite, not the guide (DEC-016). It also asserts each id it substitutes into `EXAMPLE_FILTER_Q` is one grammar-safe token — no whitespace, `,`, `=`, `~` or `{`, and no leading `-` — and an id that ever fails that assertion is routed through `--from=ID` rather than printed bare." },
  { id = "EX-5", text = "The sentence tests move with the prose and are loosened nowhere: the identity projection asserted for the JSON constants (`src/learn.rs:713-721` — the `where` over `smut_id` and the `select` of `smut_id`) is extended to each `EXAMPLE_*_Q` in its own spelling, where `--ids` and bare roots state the same claim rather than a JSON-shaped one; no assertion is deleted, and a rewording that changes meaning still fails." },
  { id = "EX-6", text = "`query` is described as the complete surface and never as legacy or deprecated, and the specification chapter stays in full." },
  { id = "EX-7", text = "No spelling the guide prints needs a quote for anything the grammar invents: the recipes are typed bare and no example quotes an operator, a wildcard or a flag (RV-031 F-8). The verbatim survival of `~`, `!` and `,` is PHASE-02 EX-3's, where the binary can prove it." },
  { id = "EX-8", text = "The repo's gate is green: `cargo test`, the linter and the formatter, with no warnings." },
]
verification      = [
  { id = "VT-1", expects = "both spellings of the two-call recipe are executed by the fixture harness, the DSL one through the token-list runner and the `IDS` substitution, and the guide is asserted to print each `EXAMPLE_*_Q` verbatim and to split it into the token list the runner types", test_file = "tests/fixture.rs", keywords = ["the_two_call_recipe_runs_in_both_spellings", "the_guide_prints_the_token_lines_this_suite_executes"], waived = false },
  { id = "VT-2", expects = "the short-form section is in the shipped prose and sits before the specification chapter — a sentence test asserts `index(\"The short form\") < index(\"Querying\")` in `GUIDE` — and the identity projection test reads each DSL constant in its own spelling", test_file = "src/learn.rs", keywords = ["the_short_form_is_taught_before_the_specification", "the_guide_states_that_identity_predicates_and_projections_use_smut_id"], waived = false },
  { id = "VA-1", expects = "diff src/learn.rs's sentence tests: no assertion deleted, no wording loosened, and each moved sentence still asserts the whole claim it did before", waived = false },
  { id = "VA-2", expects = "read the guide as a reader: `query` is described as the complete surface — never legacy, deprecated or a fallback — and the ten keys are documented in full, so a reader finishes knowing every key (RV-031 F-6, DEC-040)", waived = false },
  { id = "VH-1", expects = "the operator types the five recurring queries of IDE-006's table from the guide without a quote — the scope's closure gate, checkable only by a human at a terminal", waived = false },
]
specs             = []
requirements      = []

