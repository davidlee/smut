# Implementation plan for SL-002 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-002"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Sequencing follows the scope's declared work order (finding-smut-19): the
# walker first because it is the risk, then truncation, then the independent
# predicate interpreter, then data, then the user-facing surfaces, then the
# release gates. Each phase ends with a green tree; every traversal phase lands
# with the envelope shape DEC-012 fixes, because accepting a traversal key
# without emitting its provenance is a silent lie.
#
# Every phase that breaks an existing assertion re-cuts it in that commit
# (DEC-019) and names it in a criterion. A criterion that an already-green test
# could satisfy — a keyword set that exists before the phase, a VT whose subject
# is prose — is a defect: `plan.md` records the rule.

[[phase]]
id        = "PHASE-01"
name      = "The walker, its labels and the provenance it carries"
objective = "Make follow, backlinks and depth real: a breadth-first walk over full entities that consumes `entity::scan_refs`, and the conditional `traversal` member (depths, edges, frontier, dangling) that exists because the walk knew it. `budget` stays a refused future key until PHASE-02, so the walk is called with an unbounded budget and every phase ships a coherent request surface; the README's executed example is re-recorded here, because accepting `follow` falsifies it in this commit."
entrance_criteria = [
  { id = "EN-1", text = "The design is locked and `design.md` §4–§8 describe the walk this phase builds." },
  { id = "EN-2", text = "The research baseline is current: `doctrine verify research-current --slice 2` reports current." },
  { id = "EN-3", text = "0.1's suite is green on the entering tree, so any regression is attributable." },
]
exit_criteria = [
  { id = "EX-1", text = "`follow` and `backlinks` accept `\"*\"` or an array of top-level field names; `[\"*\"]` is refused naming the string form; a supplied `follow: []` is a traversal (member present) where an absent key is not; a named field no entity carries discovers nothing and is not an error; duplicate labels in one `Fields::Named` behave as a set for edge selection and never reorder the first occurrence (§5, §10.3)." },
  { id = "EX-2", text = "`depth` is an unsigned integer, default 1; `depth: 0` is roots-only and valid; a depth that is negative, fractional or beyond `u64` refuses the whole request before any store access (§5)." },
  { id = "EX-3", text = "The walk is breadth-first over full entities: each entity expands at most once, a self-reference is discovered once, cycles terminate, roots are deduplicated keeping the first occurrence, and `walk` returns `Walk` with order, depths, frontier, dangling and exhausted (§4, §7.1). Until PHASE-02 accepts `budget`, the walk is called with an unbounded budget, so this phase cannot truncate and `exhausted` is false throughout." },
  { id = "EX-4", text = "For each expanded entity, outgoing is processed entirely before incoming; named traversal fields apply in query order (the scan's lexical order is grouped by the requested list, never trusted); incoming sources are visited in ID order with a stable field order; and incoming can never report a dangling target (§7.1, §7.4 rules 1, 2, 5)." },
  { id = "EX-5", text = "`traversal` appears exactly when `follow` or `backlinks` was supplied — including an empty array — carrying depths (returned id to minimum discovery depth, roots 0), edges and frontier (discovery order, not cut by the limit); it is absent for `get`, for `query {}`, for a query using only from/where/select/order/limit, and for a query supplying only `depth` or `budget`, so a non-traversing envelope keeps exactly 0.1's five keys (DEC-012, DEC-019)." },
  { id = "EX-6", text = "`edges` is the induced subgraph of the returned entities, derived after `limit` from full entities by scanning each returned id in result order: `(source, field, target)` deduped, first occurrence kept, oriented as stored; a returned node never expanded still contributes, an edge in a field the traversal did not name appears when both endpoints return, `select` hiding a reference field cannot erase connectivity, and dangling targets are not edges (DEC-014, §7.2, §8.2)." },
  { id = "EX-7", text = "`dangling` carries the walk's requested-field triples of source, field and target, deduped, in encounter order, not cut to returned sources, and a reference in an unrequested field is not reported; `missing` stays in `from` order, unique, never consuming `limit`; a root present but failing `where` is not missing, a supplied root absent from the store is, and a dangling target that is also a supplied missing root appears in both lists (§7.2, §8.2, §10.3)." },
  { id = "EX-8", text = "The walker and the envelope's induced-edge derivation both consume `entity::reference_id` and `entity::scan_refs`; no second interpretation of a reference exists in either (§10.1 invariant 1, §12 row 1)." },
  { id = "EX-9", text = "`Selection` grows an optional walk; `envelope` and the Markdown notice stay pure functions of it, `Selection.ids` remains the only order a renderer may walk, a `Walk` never widens the result past `limit`, and `get` never traverses; `Walk`, `Fields` and `Dangling` derive what `Selection` derives (`Clone`, `Debug`, `PartialEq`), `Walk` holds no `&Entities`, and `src/lib.rs` exports `walk` (§10.1 invariants 4, 11)." },
  { id = "EX-10", text = "The tree ends green: `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and `cargo test` pass, with the 0.1 compatibility pin still green beside the tests EX-12 re-cuts." },
  { id = "EX-11", text = "The README's one `console` block is re-recorded against the binary in this commit — its final step is the 0.2 traversal query and shows the envelope it prints — and `tests/readme_example.rs` is re-cut beside it (DEC-019: `the_worked_example_ends_with_the_0_2_refusal` becomes the assertion that the example's traversal step runs and matches, not that it is refused). The README prose this commit falsifies is re-cut too — the introduction's 0.1/0.2 boundary line and the `where`/traversal sharp edge — to name the keys actually refused now; each later phase that makes another key real re-cuts the same sentence in its own commit." },
  { id = "EX-12", text = "Every existing assertion this phase falsifies is re-cut, not deleted (DEC-019), with its reason recorded in the test module: `src/spec.rs`'s five-key loop drops the three keys now accepted and keeps `where` and `budget` refused by name; `tests/compatibility.rs`'s `the_briefs_end_to_end_example_still_runs_where_0_1_can` is renamed and re-commented, because traversal now exists and the doc comment claiming it does not is false." },
  { id = "EX-13", text = "`select::run`'s signature is settled here rather than discovered at PHASE-03: it takes one input value carrying the traversal bounds beside the existing roots, fields, keys and limit, instead of growing positional parameters, so clippy's `too_many_arguments` threshold is not the constraint and PHASE-03 adds `where` to that same value. Both public constructors stay the only ways in — `select` from a parsed `Spec`, `get` with `Limit::unlimited` — and `get` still cannot request the default cap (DEC-001 rule 4)." },
  { id = "EX-14", text = "The Markdown notice reaches a dangling-only result: its trigger is `truncated`, a non-empty `missing` or a non-empty `dangling` list, lines appear in that order, and each dangling triple is printed once as `> dangling: `source`.`field` -> `target`` (§8.3). PHASE-02 adds the `traversal_budget` line to this notice; it does not re-open the trigger." },
]
verification = [
  { id = "VT-1", expects = "walker unit tests cover both directions, label filtering, cycles, self-references, dedupe, discovery order, the depth boundary as frontier rather than truncation, the nested/embedded reference agreement of §12 row 1, and the unbounded budget this phase passes", test_file = "src/walk.rs", keywords = ["#[test]", "self-reference", "depth boundary"], waived = false },
  { id = "VT-2", expects = "determinism tests assert named-field query order against a lexical-order scan, wildcard lexical order, array order, outgoing before incoming, incoming source ID order with a stable field order, duplicate labels collapsing to one edge, and an identical envelope from a rebuilt store with shuffled index entries and filenames", test_file = "tests/traversal.rs", keywords = ["shuffled", "query order", "incoming"], waived = false },
  { id = "VT-3", expects = "envelope tests assert the presence condition for `traversal` including `follow: []` and `from: []` (present, with empty depths, edges and frontier), that `depths` is keyed by returned ids only while `frontier` names discovered-but-unexpanded ids per DEC-013, and that a dangling target which is also a supplied missing root appears in both lists", test_file = "tests/traversal.rs", keywords = ["follow", "from", "frontier"], waived = false },
  { id = "VT-4", expects = "induced-edge tests assert an edge in an unrequested field, an edge between two returned nodes neither of which was expanded, that a `select` hiding a reference field leaves edges and depths intact, that an entity reachable twice contributes one edge, that edges follow the result order of the returned ids and not the walk's discovery order, and that with `limit` below discovery no omitted id reaches `depths` or `edges` while the frontier keeps it", test_file = "tests/traversal.rs", keywords = ["result order", "discovery order"], waived = false },
  { id = "VT-5", expects = "grammar tests assert the wildcard accepted as a whole value, an array element `\"*\"` refused naming the string form, a named field no entity carries accepted, `depth: 0` accepted, and a negative or fractional depth refused before store access", test_file = "tests/cli_contract.rs", keywords = ["follow", "backlinks", "wildcard"], waived = false },
  { id = "VT-6", expects = "the 0.1 pin is asserted unchanged and an additivity pin sits beside a 0.2 traversal query, comparing the whole parsed envelope with its key set", test_file = "tests/compatibility.rs", keywords = ["additivity", "traversal"], waived = false },
  { id = "VT-7", expects = "grammar unit tests cover the three accepted keys' forms and defaults, the wildcard's one spelling, a depth beyond `u64` refused, and duplicate labels collapsing without reordering the first occurrence", test_file = "src/spec.rs", keywords = ["beyond u64", "duplicate"], waived = false },
  { id = "VT-8", expects = "the render test asserts the notice's trigger is truncation or a non-empty missing or dangling list, in that order, with one line per dangling triple in the literal form `> dangling: `source`.`field` -> `target``, including a dangling-only result (nothing truncated, nothing missing) where the notice is still present", test_file = "tests/render.rs", keywords = ["dangling", "notice"], waived = false },
  { id = "VT-9", expects = "envelope tests in the second file §13.1 names assert the scope split (depths and edges result-scoped, frontier and dangling walk-scoped), that `get` carries no `traversal` member and never truncates, and the reason order when both reasons occur", test_file = "tests/selection.rs", keywords = ["traversal", "frontier"], waived = false },
  { id = "VA-1", expects = "no module other than `src/entity.rs` interprets a reference: grep for ad-hoc id probing in `src/walk.rs` and in the envelope's induced-edge derivation in `src/select.rs` returns nothing, and both call `scan_refs`" },
]

[[phase]]
id        = "PHASE-02"
name      = "Budget, truncation, the reason order and the notice"
objective = "Let a caller bound the walk without being lied to about why it stopped: `budget` counts entity expansions, is checked before expanding, and sets `traversal_budget` only when a permitted expansion was declined (DEC-015). `where` is now the only future key left, and it stays refused by name until PHASE-03 accepts it; the Markdown notice gains the `traversal_budget` line beside the dangling lines PHASE-01 placed."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01's exits hold: traversal keys are accepted and the `traversal` member is emitted with its three views." },
]
exit_criteria = [
  { id = "EX-1", text = "`budget` is a positive unsigned integer, default 10000; 0, negative, fractional and beyond-`u64` values refuse the whole request; without `follow` or `backlinks` it is accepted and inert, and a budget-only query carries no `traversal` member (§5)." },
  { id = "EX-2", text = "The budget counts entity expansions, not discoveries or edge visits, and the check precedes the expansion, so a walk that empties its queue with exactly `budget` expansions is complete (§7.3)." },
  { id = "EX-3", text = "`traversal_budget` appears only when a node the depth bound would have allowed expanding was declined; reasons are unique and ordered `traversal_budget` then `result_limit` (§8.3, DEC-015)." },
  { id = "EX-4", text = "A declined expansion puts that node and the rest of the queue into frontier in discovery order; `depth: 0` and a budget leaving only depth-boundary nodes are complete and set `truncated: false` (§7.3, §10.3)." },
  { id = "EX-5", text = "`FUTURE_KEYS` holds only `where` after this phase: `budget` becomes the fourth real key, and `where` is still refused by name with the release that accepts it, so `src/spec.rs`'s future-key test and the refusal pins keep asserting a named release for the one key left (§5, DEC-019)." },
  { id = "EX-6", text = "The Markdown leading notice gains the `traversal_budget` line beside PHASE-01's dangling lines, in the order §8.3 fixes, so no stored body can absorb either; depths, edges and frontier are never printed (§8.3)." },
  { id = "EX-7", text = "The tree ends green: fmt, clippy `-D warnings`, `cargo test`, compatibility pin; the README's key-refusal sentence is re-cut for `budget` in this commit (DEC-019)." },
]
verification = [
  { id = "VT-1", expects = "boundary tests: a budget exactly equal to the expandable set is complete, one fewer truncates, only depth-boundary nodes remaining is complete, and the frontier holds the declined node plus the drained queue", test_file = "tests/traversal.rs", keywords = ["traversal_budget", "exhausted", "frontier"], waived = false },
  { id = "VT-2", expects = "reason-order and uniqueness tests place `traversal_budget` before `result_limit` when both occur and assert no repeated reason", test_file = "tests/traversal.rs", keywords = ["traversal_budget", "unique"], waived = false },
  { id = "VT-3", expects = "`budget: 0`, negative, fractional and beyond-`u64` values are refused with exit 2 before store access, and an unknown key is refused by name without naming a release", test_file = "tests/cli_contract.rs", keywords = ["budget", "unknown"], waived = false },
  { id = "VT-4", expects = "the render test asserts the leading notice names `traversal_budget` with its exact reason spelling and keeps the dangling lines intact", test_file = "tests/render.rs", keywords = ["traversal_budget", "dangling"], waived = false },
  { id = "VA-1", expects = "`FUTURE_KEYS` lists only `where`, and no refusal for a query specification key names a future release — the `--format mermaid` refusal keeps its 1.0 promise, which this phase must not widen the sweep to delete" },
]

[[phase]]
id        = "PHASE-03"
name      = "Predicates over roots"
objective = "Add the brief's closed predicate language as a pure interpreter over one entity's top-level fields, filtering roots only and before traversal (§6, DEC-016), with every refusal the grammar promises. This is also the phase in which the last future key becomes real, so `FUTURE_KEYS` and its refusal retire here, where nothing is left to name."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02's exits hold: the walk and its truncation semantics are in place, so `where` can be positioned at roots without disturbing discovery." },
]
exit_criteria = [
  { id = "EX-1", text = "The five operators hold exactly as §6.3 states: `$eq` and `$ne` require presence; `$in` compares against the operand array's values; `$exists` decides presence and treats present null as present; `$contains` means substring for a string field and structural membership for an array field, and matches nothing else." },
  { id = "EX-2", text = "Missing fields fail every operator except `$exists`; there is no coercion, regex, JSONPath, nested-field syntax or executable predicate; `id` is an ordinary top-level field and is filterable (§6.3, §10.3)." },
  { id = "EX-3", text = "Disambiguation is exact: no dollar key means `$eq`; only dollar keys means an operator object with its operators ANDed; a mix is refused naming the field; a literal object carrying dollar keys is comparable only through explicit `$eq`; a field whose own name begins with a dollar sign is unaddressable; and two or more sibling keys in one `where` object — a field condition and a boolean clause alike — hold conjunctively, with the six must-pass examples of §6.3 asserted as given (§6.2, §6.3)." },
  { id = "EX-4", text = "`$and`, `$or` and `$not` compose with their empty-array identities (true and false), an empty `where` is true, an unknown dollar-prefixed operator is refused naming the key, and the clause names are not field operators (§6.2)." },
  { id = "EX-5", text = "`where` filters roots only and runs before traversal: `select::run` resolves roots, records `missing`, and only then filters the present roots with the interpreter, before `order` and `limit` — so a supplied root that fails `where` is omitted and not missing, a discovered entity that fails `where` is still returned, and `where` never sees a discovered entity. `src/predicate.rs` never orders, truncates or builds a `Selection` (§4, §7.1, §10.1 invariant 2)." },
  { id = "EX-6", text = "Every malformed predicate rejects the whole request with exit 2 before the store is opened, locked or created (§5)." },
  { id = "EX-7", text = "The tree ends green: fmt, clippy `-D warnings`, `cargo test`, compatibility pin; `src/lib.rs` exports `predicate`; the `where`-refusal pins in `tests/compatibility.rs`, `tests/cli_contract.rs` and `tests/selection.rs` are re-cut into where-accepted additivity pins, each carrying its reason, and never silently dropped (DEC-019)." },
  { id = "EX-8", text = "The last future key becomes real, so `FUTURE_KEYS`, `Reject::FutureSpecificationKey` and its display arm and exit-code row are deleted, and every key 0.2 does not know is refused plainly as unknown, naming no release; `src/spec.rs`'s future-key test and the two `src/error.rs` assertions that construct the variant go with it, while the three integration pins are re-cut into the accepted-key assertions that survive. The README's key-refusal sentence is re-cut to the nine-key surface (§5, DEC-019)." },
]
verification = [
  { id = "VT-1", expects = "predicate unit tests cover the AST, the parser's disambiguation cases and the five operators' hold conditions, including structural equality (object key order irrelevant, the integer 1 distinct from the float 1.0)", test_file = "src/predicate.rs", keywords = ["#[test]", "$contains", "$ne"], waived = false },
  { id = "VT-2", expects = "integration tests cover missing versus present-null for every operator, empty `$and` and `$or`, sibling keys holding conjunctively (including a field condition beside a clause) with the six §6.3 must-pass examples, mixed-object refusal, the `$eq` escape for a literal object with dollar keys, `$in` operand type refusal and `$exists` operand type refusal", test_file = "tests/predicates.rs", keywords = ["$or", "$eq", "$in"], waived = false },
  { id = "VT-3", expects = "roots-only tests assert that a discovered entity failing `where` is returned, a filtered root is neither returned nor missing, filtering happens before traversal and before the limit, and `where` on `id` filters", test_file = "tests/predicates.rs", keywords = ["roots-only", "where", "discovered"], waived = false },
  { id = "VT-4", expects = "the where-refusal pin is re-cut into a where-accepted additivity pin carrying its reason in the test module, with the 0.1 `query {}` pin beside it unchanged; the re-cut test carries the token `where_accepted`, because `where` and `additivity` are both already present in this file from PHASE-01 and a mandate satisfied by their presence certifies nothing (DEF-3)", test_file = "tests/compatibility.rs", keywords = ["additivity", "where_accepted"], waived = false },
  { id = "VA-1", expects = "no predicate code path reaches storage or the clock: `src/predicate.rs` imports neither `crate::store` nor a filesystem module" },
]

[[phase]]
id        = "PHASE-04"
name      = "The acceptance fixture, and the privacy gate it must clear"
objective = "Promote the first-use store to a committed, normalised entity array plus provenance (DEC-018), after the operator's read-through, so acceptance tests and the guide's example run against real data in a clean checkout. The array is the only home of the fixture: one declaring helper, extended by later phases rather than copied."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03's exits hold; the acceptance queries the fixture must answer (backlinks on `part-of` at depth 2, then `where`) are executable against any store." },
  { id = "EN-2", text = "The operator's privacy read-through is arranged; the phase cannot close without its recorded outcome." },
]
exit_criteria = [
  { id = "EX-1", text = "`tests/fixtures/interview/entities.json` is one normalised array of the first-use store's entities, declared into a scratch store by the helper in `tests/fixture.rs`. The committed array is the only copy of the data: a later suite that needs it reads that file with its own scratch store rather than committing a second fixture or a second copy of the entities. Nothing in the suite reads `interview.local` and no `.smut` internals are committed (DEC-018)." },
  { id = "EX-2", text = "A provenance note beside the array records the source snapshot, what the read-through removed or resolved, and who resolved it — the design does not assume what that read finds (§11). If the verdict refuses publication, this phase does not close and PHASE-06 and PHASE-07 do not open until the operator's decision is recorded; if the read-through falsifies a claim those phases rely on, that is raised as a design revision before the dependent phase, not adapted in place (§11)." },
  { id = "EX-3", text = "`tests/fixture.rs` asserts against the entities, never against the vocabulary prose, the properties the acceptance cases need: a non-empty array, at least one entity with no incoming reference, a superseded finding retired in place, a settled finding, a mutually-referencing cluster, the five clusters §13.3 scenario 3 walks, and no entity carrying `status: retracted` (§13.1 Fixture row)." },
  { id = "EX-4", text = "The committed array's counts are recorded in this phase's runtime sheet and its provenance note, not taken from §2, so the sheet and the data agree." },
  { id = "EX-5", text = "The tree ends green: fmt, clippy `-D warnings`, `cargo test` with the fixture suite included." },
]
verification = [
  { id = "VT-1", expects = "the fixture suite declares the committed array into a scratch store, asserts the properties of EX-3 (including the five clusters and the absence of a retracted entity), and answers the two-call acceptance query (open questions under session) by id", test_file = "tests/fixture.rs", keywords = ["entities.json", "part-of", "clusters"], waived = false },
  { id = "VH-1", expects = "the operator's privacy verdict is recorded before the fixture commit: anything private removed, or the fixture not committed (DEC-018)" },
  { id = "VA-1", expects = "`git status` shows no `.smut` internals added, and the provenance note names the read-through's outcome" },
]

[[phase]]
id        = "PHASE-05"
name      = "The conventions command"
objective = "Ship `smut conventions` as printed advice with a pipeable seed: one set, no store, no validation, no heuristic selection, and a fixed-id versioned declaration whose supplied fields a re-install replaces (DEC-017). The seed's version is the crate's, so this phase does not pin a release number that PHASE-07 owns."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04's exits hold, and the CLI routing and the `learn` text-command precedent are in place to follow." },
]
exit_criteria = [
  { id = "EX-1", text = "`smut conventions` with no argument lists exactly one set, one line each; a named set prints as prose; an unknown name — including the deferred `epistemic-records` (§13.3 scenario 5) — exits 2 naming the sets; `--format text` is accepted and identical to no flag; `--format json` with no name exits 2 because a listing is not a declaration; any other format is a usage error (§9.1)." },
  { id = "EX-2", text = "`--format json` emits one entity with the fixed id `conventions-hygiene`, type convention, `env!(\"CARGO_PKG_VERSION\")` as its version, title and body built from the embedded prose in `src/conventions/hygiene.md`, so no second copy can drift (§9.3, §14.1)." },
  { id = "EX-3", text = "The seed round-trips through `declare` as an upsert: re-install replaces every field the seed supplies — body included — keeps a field the user added, and the reply's `previous` carries the replaced body for the updated entry, `--compact` omitting it (§9.3, §13.1)." },
  { id = "EX-4", text = "The command opens no store, takes no lock, never validates, never re-installs and never selects a set heuristically; it is pure text like `learn` (§9.1, §10.1 invariant 9)." },
  { id = "EX-5", text = "The shipped set is the eight hygiene items of §9.2 — including rule 7's retracted-versus-superseded distinction with `vocab` as the evidence — the printed prose states that the seeded body is advice a re-install replaces, and it points at `smut learn` for the two-call recipe without repeating it (§9.4, DEC-016)." },
  { id = "EX-6", text = "The tree ends green: fmt, clippy `-D warnings`, `cargo test`, compatibility pin; `src/lib.rs` exports `conventions`." },
]
verification = [
  { id = "VT-1", expects = "conventions tests cover listing, prose, unknown name (including `epistemic-records` refused by name), `--format text`, the json round-trip through `declare`, the fixed id and the crate's version, and that no store is created or read", test_file = "tests/conventions.rs", keywords = ["conventions-hygiene", "epistemic-records", "json"], waived = false },
  { id = "VT-2", expects = "the re-install test asserts a user-added field survives while an amended seeded body is replaced, and that the reply's `previous` carries the replaced body, absent under `--compact`", test_file = "tests/conventions.rs", keywords = ["previous", "compact"], waived = false },
  { id = "VA-1", expects = "`src/conventions.rs` opens no snapshot and takes no lock; the set prose is the embedded `src/conventions/hygiene.md` rather than an inline literal, so the §14.2 selector `src/conventions/**` matches the content it ships" },
]

[[phase]]
id        = "PHASE-06"
name      = "The guide: the idioms, and the example the tests run"
objective = "Make `learn` the normative home of the 0.2 surface and the two-call composition with its completeness guard (DEC-016), with direction stated, the guard's no-propagation limit stated, and the shipped example being the one `tests/fixture.rs` executes."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05's exits hold and the fixture from PHASE-04 is committed, so the guide's example can be asserted rather than described." },
]
exit_criteria = [
  { id = "EX-1", text = "`learn` teaches the 0.2 keys with defaults and the roots-only rule, the predicate summary including missing versus null, traversal labels as top-level fields in both directions, depth and budget, the `traversal` provenance member and the truncation reasons, a minimal label vocabulary with the bounded-render advice, the fact that a `$`-prefixed field name cannot be filtered in 0.2, and one pointer line to `smut conventions` (§6.2, §9.4)." },
  { id = "EX-2", text = "The recipe is normative with its direction: containment is child to container, so which questions hang off this session is backlinks on `part-of` at depth 2, and the guide says why the follow variant answers a different question (§9.4, DEC-016)." },
  { id = "EX-3", text = "The completeness guard is stated as part of the recipe, clause by clause: inspect `truncated` and `truncation_reasons` on the first response before extracting ids; retry once with a bound the store can meet; if it truncates again or the caller will not spend that scan, stop and answer partially naming the reason and the refused bound; repetition alone never establishes completeness, and a truncated first response makes a `truncated: false` second envelope no evidence (§9.4, DEC-016)." },
  { id = "EX-4", text = "0.1's notice that where and traversal arrive in 0.2 is gone, and the guide states what `budget` does not bound: the per-hop store scan for backlinks and the whole-store root scan for an absent `from` or a `where` (§7.3, §12). `src/learn.rs`'s `the_guide_names_the_release_the_rest_arrives_in` is re-cut into a 0.2-coverage pin (the keys are taught, the notice is absent), not deleted — its two assertions are exactly what this phase reverses (DEC-019)." },
  { id = "EX-5", text = "The guide's example is the example the fixture test runs, so a hand-written example cannot drift from the store's direction (§13.1 Guide row)." },
  { id = "EX-6", text = "The tree ends green: fmt, clippy `-D warnings`, `cargo test`, compatibility pin." },
  { id = "EX-7", text = "The guide states that the guard is client-side: smut adds no prior-response input to the second call and performs no propagation, because the envelope describes one request — so the specification key set stays the nine of §5 (VA-1 asserts it) (§9.4, §10.1 invariant 13)." },
]
