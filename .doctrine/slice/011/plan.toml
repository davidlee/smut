# Implementation plan for SL-011 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-011"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# Four phases, ordered so each phase's claims are true when it lands: the shared
# structs and `-j` first (so `-j` exists before any sentence points at it), the
# sentences second (so `r` inherits the final vocabulary and its parity tests pin
# it once), the verb third, the guide last (its strongest test is a command that
# must already work). RV-036 routed no finding to demonstrate/probe/control; every
# finding was settled in the design's prose, so no criterion below cites one as an
# obligation. Phase ids are immutable; edits append.

[[phase]]
id        = "PHASE-01"
name      = "Two shared argument structs, and -j on q"
objective = "`Sub::Q`'s twelve flags become `SelectionArgs` and `Sub::Render`'s five display flags become `DisplayArgs`, each one `#[derive(clap::Args)]` struct flattened into its verb, with `DisplayArgs::options` and `SelectionArgs::specification` carrying the behaviour now inline in the two arms (DEC-043). First as a refactor under a green, unedited suite; then `-j/--json` on `q` red/green: `q -j <json>` answers what `query <json>` answers, and `-j` beside any token or selection flag is `Reject::JsonBesideSelection` (DEC-044). No new verb yet."
entrance_criteria = [
  { id = "EN-1", text = "design.md § The command line read whole: the two structs, the two methods, the order of validation and the probe table are this phase's specification; § Refusals' new-refusal row is its one message." },
  { id = "EN-2", text = "src/cli.rs read at `Sub::Q`, `Sub::Render`, `parse`, `operand`, `check_format` and `heading_level_of`; src/dsl.rs read at `Flags` and `Line`; src/error.rs read at `Reject` and its `Display` arms and message tests." },
  { id = "EN-3", text = "The full gate (`just check`) is green on the slice base, and the commit is recorded in notes.md as the slice base for PHASE-03/VA-1's diff. Work in the tree that is not this slice's (at plan time: an uncommitted 0.3.0 version bump in Cargo.toml/Cargo.lock) is neither committed nor reverted by this slice; if it reddens the gate, stop and ask." },
]
exit_criteria     = [
  { id = "EX-1", text = "Refactor, behaviour-preserving, landed as its own commit before any new behaviour: `SelectionArgs` (the bare attribute-free `tokens: Vec<String>` with DEC-037's comment moved onto it, and q's twelve flags exactly as today) and `DisplayArgs` (`-f -t -l -i -s` exactly as today, `-l` keeping `allow_hyphen_values`) are flattened into `Sub::Q` and `Sub::Render`. `DisplayArgs::options(self) -> Result<Options, Reject>` is today's `check_format` + `heading_level_of` + defaults, lifted unchanged; the `Render` arm calls it before `operand`, so a bad display flag still never waits on stdin (DEC-008). Every existing test passes unedited, `smut q --help` still prints `Usage: smut q [OPTIONS] [TOKENS]...`, and `smut render --help` still shows `[JSON]`. `smut --help`, `smut q --help` and `smut render --help` are captured before the refactor and byte-identical after it: a doc comment on a flattened `clap::Args` struct can surface in the parent command's help, so the structs' own comments are checked against that capture rather than assumed inert." },
  { id = "EX-2", text = "`dsl::Flags` derives `PartialEq`; `src/dsl.rs` gains no clap dependency. The one `SelectionArgs` → `Flags` conversion lives in `src/cli.rs`." },
  { id = "EX-3", text = "`SelectionArgs` gains `#[arg(long, short = 'j')] json: Option<String>`. `SelectionArgs::specification(self, stdin_is_terminal, stdin) -> Result<Spec, Error>` refuses `-j` beside a nonempty token list or any non-default `Flags` (so `--select=` and `--ids` both count) before reading any operand; otherwise `-j`'s value goes through the existing `operand` (`-` reads stdin; trailing input and duplicate keys refused as today), and no `-j` compiles the line; `spec::parse` is called once, after the match. The `Q` arm is that call plus `Request::Query`." },
  { id = "EX-4", text = "`Reject::JsonBesideSelection` renders exactly `-j takes the whole specification; drop the tokens and selection flags beside it`, exits 2, and joins the exit-code table and the whole-line message test in src/error.rs." },
  { id = "EX-5", text = "End to end on one store: `q -j <json>` and `query <json>` have byte-identical stdout, stderr and exit code; `q -j -` with the spec on stdin equals `query -`; `q a -j '{}'`, `q --ids -j '{}'` and `q --depth 2 -j '{}'` each exit 2 with the new sentence and create no store; a `-j` value that is not one JSON object is refused with `query`'s own message for the same operand." },
  { id = "EX-6", text = "The probe's loud cases hold in the real crate (design § The command line, evidence table): `q a --follow x b` keeps tokens `[a, b]`; `q -- -weird` and `q a -- --follow` deliver the hyphen-leading tokens. Their existing tests stay green or, where absent, are added at the parse level in src/cli.rs." },
  { id = "EX-7", text = "`tests/compatibility.rs` is untouched and green. The repo's gate is green: `just check` (build, both clippy configurations at -D warnings, `cargo fmt --check`, both test configurations)." },
]
verification      = [
  { id = "VT-1", expects = "q -j answers byte-identically to query for an operand and for stdin, and a -j beside a token or a selection flag is refused by name at exit 2 without creating a store", test_file = "tests/cli_contract.rs", keywords = ["q_dash_j_answers_what_query_answers", "json_beside_a_selection_is_refused_by_name"], waived = false },
  { id = "VT-2", expects = "the new variant's whole rendered line and its exit code, in the module's existing message and exit-code tests", test_file = "src/error.rs", keywords = ["JsonBesideSelection", "-j takes the whole specification; drop the tokens and selection flags beside it"], waived = false },
  { id = "VA-1", expects = "read the refactor commit's diff alone: it moves fields and lifts the two helpers into `DisplayArgs::options` without changing a flag name, letter, attribute, doc comment or validation order, and edits no test; and that the three help captures named in EX-1 are byte-identical", waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-02"
name      = "The escape pointers say -j"
objective = "The five refusal sentences that name `smut query` as their escape, and two that name `q` as their subject, become verb-blind and point at `-j` (DEC-045), exactly as design § Refusals tabulates — so the compiler stays verb-blind and `r`, when it lands, inherits sentences that are true of it. Each new sentence is re-read against every input that reaches it."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 complete: `-j` exists on `q`, so a sentence pointing at it names something a caller can type." },
  { id = "EN-2", text = "design.md § Refusals' 'escape pointer' table read; the five sites re-located in the current tree by content (today `src/dsl.rs` ~319, ~327, ~505, ~581 and the `JsonOperand` arm in `src/error.rs` ~385), not by line number." },
  { id = "EN-3", text = "`mem.pattern.smut.refusal-pins-hold-shape-not-truth` retrieved and read: a pin holds the sentence's shape, not its truth, so the truth check is a reading (VA-1)." },
]
exit_criteria     = [
  { id = "EX-1", text = "The four `src/dsl.rs` sentences read as design § Refusals' 'after' column, word for word: `the short form cannot tell the field from the value; use -j`, `use -j for the same predicate as JSON`, `write two conditions or use -j`, `the short form carries one {spelling} per field; use -j`. `src/dsl.rs`'s module doc mentions that `q` and `r` share the compiler." },
  { id = "EX-2", text = "`Reject::JsonOperand` renders `a word beginning with { is not read as a token: a JSON specification goes after -j, and an id after --from=`, and its doc comment (src/error.rs ~103) no longer says only `smut query` takes a JSON specification. It stays raised inside `dsl::compile` on the first character alone." },
  { id = "EX-3", text = "Every pin of the old sentences moves with them, whole-line, in `tests/dsl.rs` and in `src/error.rs`'s message tests (including the ambiguous-token `reason` test, ~1087/1093); no pin becomes a substring assertion. `grep -n 'use smut query' src/dsl.rs src/error.rs tests/dsl.rs` prints nothing." },
  { id = "EX-4", text = "The guide (`src/learn.rs`) is not edited in this phase; its escape prose still names `smut query`, which remains true, and is PHASE-04's." },
  { id = "EX-5", text = "`tests/compatibility.rs` untouched and green; `just check` green." },
]
verification      = [
  { id = "VT-1", expects = "the four compiler refusals pinned whole with their new sentences, each test naming the change that reddens it", test_file = "tests/dsl.rs", keywords = ["the short form cannot tell the field from the value; use -j", "use -j for the same predicate as JSON", "write two conditions or use -j", "the short form carries one"], waived = false },
  { id = "VT-2", expects = "JsonOperand's whole rendered line, reached by a JSON-looking word and by a {-led id", test_file = "tests/dsl.rs", keywords = ["a JSON specification goes after -j, and an id after --from="], waived = false },
  { id = "VA-1", expects = "for each of the five sentences, enumerate the inputs that reach it (both verbs; for JsonOperand a JSON word and a {-led free-form id such as {weird}) and confirm the sentence's subject and escape are true of every one; record the reading in notes.md", waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-03"
name      = "The verb r — the same line, printed as Markdown"
objective = "`Sub::R` flattens `SelectionArgs` and `DisplayArgs`; its arm calls `display.options()`, then `selection.specification(..)`, and returns the `Request::Render` the machine verb builds — before any store (DEC-004, DEC-042). Byte identity with `render` across spellings and display flags, refusal parity with `q`, the two stated divergences from `render`, and the help surface are each proved end to end."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 and PHASE-02 complete and green: both structs exist and the refusal vocabulary is final, so `r`'s parity tests pin it once." },
  { id = "EN-2", text = "design.md § The surface (rules, deliberate differences), § Verification (equivalence, refusals, stated divergences, surfaces that must not move) read whole; tests/cli_contract.rs read at its `Scratch`/`run`/`smut` helpers, `has_store`, and the render tests (~453-505)." },
]
exit_criteria     = [
  { id = "EX-1", text = "`Sub::R` exists with doc text 'Render a line of words as Markdown' (or equivalent), usage `smut r [OPTIONS] [TOKENS]...`. The arm validates display flags first, then the selection, and constructs no `Store` before `spec::parse` returns. `src/main.rs` needs no new dispatch arm (it dispatches `Request::Render`)." },
  { id = "EX-2", text = "Byte identity (stdout, stderr, exit code) on one store, the CLI-level half of design § Verification's spine: `r <line>` vs `render <the JSON the line denotes>`; `r -j <json>` vs `render <json>`; `r -j -` vs `render -` with the same stdin; `r <line> -s -i -l 3 -t name` vs `render <json> -s -i -l 3 -t name`; `r` (no words, with a specification piped on stdin, which `r` must not read) vs `render '{}'`. The recipe-level half is PHASE-04/EX-5." },
  { id = "EX-3", text = "Refusals: `JsonBesideSelection` on `r` for a token and for a selection flag beside `-j`, at exit 2; `r -j '{}' -s` is accepted. Parity table, each row asserting `r`'s stderr and exit equal `q`'s for the same line: `--ids --select a`, `--depth 2` with no direction, `--limit all`, `--from=`, `--order title:user`, `status~a=b`. Display-flag refusals (`--format mermaid`, an unknown format, `-l 7`) equal `render`'s. `r -l --ids` and `r -l -j 3` are refused as an invalid heading level. Every refusal test pairs its `!has_store()` with a `declare` in the same scratch directory, so the assertion discriminates (IMP-015)." },
  { id = "EX-4", text = "`JsonOperand` reaches `r` for a JSON-looking word and for `{weird}`, and `r --from={weird}` renders the entity `{weird}`." },
  { id = "EX-5", text = "The stated divergences, each asserted on both sides: `r` with no words answers like `render '{}'` while `render` with no operand on a terminal is `MissingInput`; `r '[1]'` renders the entity `[1]` while `render '[1]'` is refused." },
  { id = "EX-6", text = "Help: `smut --help` lists `r` — asserted by a line-anchored match on the verb list, because `contains(\"r\")` passes vacuously — in both `src/main.rs`'s `help_prints_the_grammar_on_stdout_and_succeeds` and `src/cli.rs`'s `help_is_answered_as_text_that_advertises_the_grammar`. `every_short_flag_reaches_exactly_the_state_its_long_form_reaches` keeps every existing pair and gains `r`'s five; `conventions_takes_the_same_format_letter_as_render` still holds. `smut q --help`'s pinned usage line is unchanged." },
  { id = "EX-7", text = "Surfaces that must not move: `tests/compatibility.rs` and the existing render contract tests pass unedited; `just check` green." },
]
verification      = [
  { id = "VT-1", expects = "the CLI-level equivalence rows: r line, r -j, r -j -, display flags across verbs, and the empty line, each byte-identical to its render twin", test_file = "tests/cli_contract.rs", keywords = ["r_renders_what_render_renders", "r_dash_j_renders_what_render_renders", "display_flags_agree_across_render_and_r", "an_empty_r_line_renders_the_empty_specification"], waived = false },
  { id = "VT-2", expects = "refusal parity through r, JsonBesideSelection on r, the loud heading-level cases, JsonOperand through r, and no store created by any refused line", test_file = "tests/cli_contract.rs", keywords = ["every_q_refusal_reaches_r_unchanged", "json_beside_a_selection_is_refused_on_r", "r_refuses_without_creating_a_store"], waived = false },
  { id = "VT-3", expects = "the two stated divergences between r and render, each asserted on both sides", test_file = "tests/cli_contract.rs", keywords = ["r_and_render_differ_only_where_the_design_says"], waived = false },
  { id = "VT-4", expects = "r's five short flags each reach the state their long forms reach", test_file = "src/cli.rs", keywords = ["every_short_flag_reaches_exactly_the_state_its_long_form_reaches", "&[\"r\","], waived = false },
  { id = "VA-1", expects = "run `git diff --stat <slice base> -- src/spec.rs src/predicate.rs src/select.rs src/render_markdown.rs src/input.rs docs/store-format.md tests/compatibility.rs` (slice base recorded in notes.md by PHASE-01/EN-3) and confirm it prints nothing; read that no Store is constructed on the r path before spec::parse returns", waived = false },
]
specs             = []
requirements      = []

[[phase]]
id        = "PHASE-04"
name      = "The guide and the README teach r and -j"
objective = "`smut learn` teaches `r` and `-j` (DEC-010, DEC-040) as design § The guide and the README lists; the Workflows render recipe becomes the quote-free `smut r q-query --select title,body` held in `EXAMPLE_RENDER_R` beside its JSON twin `EXAMPLE_RENDER`, both executed by `tests/fixture.rs`; the README's commands table and operand paragraph gain `r` and `-j`."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 complete: `smut r` runs end to end, so every line the guide prints is a command a reader can type." },
  { id = "EN-2", text = "src/learn.rs read whole — `GUIDE`, the `EXAMPLE_*` constants and every sentence pin (the commands block ~41-52, the store sentence ~59 and its pin ~1019, the short-form heading constant ~766, the escapes ~143/~149 and their pin ~933, the complete-surface clause ~149-150 and its pins ~898/~1028, the render recipe ~337, the examples pin ~702); tests/fixture.rs read at `Declared::query`/`Declared::q`, `example`, `filter_over_words`; README.md read at its commands table and operand paragraph; tests/readme_example.rs read for what it executes." },
]
exit_criteria     = [
  { id = "EX-1", text = "Commands block: a line `smut r <TOKEN>... [display flags]` (render as words), and the `q` and `r` rows show `[-j|--json JSON]`. The store sentence reads that the others, q and r included, need a store, and its pin moves with it. `the_guide_lists_the_short_form_among_the_commands` gains `r`." },
  { id = "EX-2", text = "The operand paragraph adds that `-j` takes the same JSON, `-` included, on `q` and `r`, and that `q` or `r` with no words answers every entity, capped at 100, rather than waiting or refusing." },
  { id = "EX-3", text = "Short-form section: the heading becomes `The short form: smut q and smut r` (`SHORT_FORM_HEADING` updated, both uses green); the value-typing escapes name `-j` in place of `smut query` and the pin at ~933 moves with them; the sentence before the complete-surface clause reads `… are all for -j, or smut query:` while `smut query takes the full specification and is the complete surface` stays verbatim and its two pins untouched; `query`/`render` are named as the unchanged machine verbs; where a sentence now covers both verbs it says 'the short form' rather than 'q'. Flag-name proximity (`--ids` vs `--show-ids`, `--select` vs `--show-fields`) is stated once (slice R3)." },
  { id = "EX-4", text = "Rendering says `r` takes q's line; the Workflows recipe prints `smut r q-query --select title,body`. `EXAMPLE_RENDER` (`{\"from\":\"q-query\",\"select\":[\"title\",\"body\"]}`) and `EXAMPLE_RENDER_R` (the line) are constants, the guide prints both, and `the_guide_prints_the_examples_the_fixture_executes` enumerates them." },
  { id = "EX-5", text = "tests/fixture.rs gains `Declared::r(&str)` and `Declared::render(&Value)` (returning stdout; a refusal is a test failure) beside `Declared::q`, and the recipe-level half of the spine on the fixture store: `EXAMPLE_RENDER_R` vs `EXAMPLE_RENDER`, `EXAMPLE_TRAVERSE_Q` vs `EXAMPLE_TRAVERSE` and `EXAMPLE_FOLLOW_Q` vs `EXAMPLE_FOLLOW` byte-identical as Markdown; the hot paths `title~graph`, `type=question status=open --select smut_id,title` and `--has body --order title:desc` byte-identical to harness-written JSON twins; the filter recipe (`EXAMPLE_FILTER_Q` with ids as roots vs `EXAMPLE_FILTER` with `$in`) asserted to render the same set of entities, not the same bytes — roots answer in the order written, `$in` in `smut_id` order (RV-031 F-6; correction owed to design § Verification, see plan.md)." },
  { id = "EX-6", text = "README: the commands table gains `smut r [TOKEN]...` (the same line of words, printed as Markdown) and the `q` row notes `-j`; the operand paragraph mirrors the guide's. The JSON `render` examples stay; converting one to `r` only if tests/readme_example.rs runs it without new machinery. The README harness passes." },
  { id = "EX-7", text = "`tests/compatibility.rs` untouched and green; `just check` green." },
]
verification      = [
  { id = "VT-1", expects = "the guide prints the render recipe in both spellings and names r and -j in its commands block, operand paragraph and short-form heading", test_file = "src/learn.rs", keywords = ["EXAMPLE_RENDER", "EXAMPLE_RENDER_R", "The short form: smut q and smut r", "smut r <TOKEN>..."], waived = false },
  { id = "VT-2", expects = "the fixture executes the render recipe both ways and the recipe-level equivalence rows, with the filter pair compared as a set", test_file = "tests/fixture.rs", keywords = ["fn r(", "fn render(", "EXAMPLE_RENDER_R", "the_render_recipe_reads_the_same_both_ways"], waived = false },
  { id = "VA-1", expects = "read `smut learn` and README.md end to end as a reader who knows only the guide: every q/r/-j spelling the CLI accepts is taught, none it refuses is shown, and no sentence calls q the only human front-end", waived = false },
]
