  { id = "VT-2", expects = "refusal parity through r, JsonBesideSelection on r, the loud heading-level cases, JsonOperand through r, no store created by any refused line, and the non-goal that query and render still refuse -j as usage errors", test_file = "tests/cli_contract.rs", keywords = ["every_q_refusal_reaches_r_unchanged", "json_beside_a_selection_is_refused_on_r", "r_refuses_without_creating_a_store", "unexpected argument '-j' found"], waived = false },
  { id = "VT-3", expects = "the pipe-reachable half of the two stated divergences: r with no words (a specification piped and ignored) against render '{}', and r '[1]' against render '[1]'; the terminal half cannot live here, because the harness always pipes stdin, and is VT-5 in src/cli.rs", test_file = "tests/cli_contract.rs", keywords = ["r_and_render_differ_only_where_the_design_says"], waived = false },
  { id = "VT-4", expects = "r's five short flags each reach the state their long forms reach", test_file = "src/cli.rs", keywords = ["every_short_flag_reaches_exactly_the_state_its_long_form_reaches", "&[\"r\","], waived = false },
  { id = "VT-5", expects = "the terminal half of the stated divergences, in-process beside a_missing_operand_on_a_terminal_is_refused: render with no operand on a terminal is MissingInput, and r with no operand on a terminal is the empty specification, reached as `parse_with(&[\"r\"], …, true)`; tests/cli_contract.rs cannot reach either, because run always pipes the child stdin", test_file = "src/cli.rs", keywords = ["a_missing_operand_on_a_terminal_is_refused", "parse_with(&[\"r\"])"], waived = false },
