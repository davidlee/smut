schema = "doctrine.knowledge"
version = 1

id = 33
slug = "exit-two-is-for-what-the-caller-typed"
title = "Exit 2 is for what the caller typed and exit 1 for what the filesystem supplied — and a listing that reports a broken set still succeeds"
record_kind = "decision"
status = "accepted"
created = "2026-11-02"
updated = "2026-11-02"
tags = ["cli", "conventions"]

[facet]                         # every field typed; seeded empty (captured later)
context = "The exit table is a documented contract printed by smut learn and pinned by tests: 0 success including reported missing ids; 1 no store or the store could not be read or written; 2 invalid input or usage. A layered loader introduces a failure the command never had — a set file that exists and cannot be loaded — which fits neither existing row, and which an independent critical pass noted must also cover bytes that cannot be decoded, not only frontmatter that cannot be parsed."
choice = "The line runs between caller and filesystem. Exit 2 stays for what the caller supplied: an unknown set name, an unknown format, json without a name. Exit 1 covers what the environment supplied and the caller cannot fix by typing differently: an unreadable layer directory, a file that cannot be opened or decoded, unparseable frontmatter, a derived frontmatter key — the diagnostic naming layer, path and line where known. The learn sentence for 1 is widened accordingly. A listing that reports a broken set exits 0, and asking for that set by name exits 1 with its reason."
alternatives = ["returning exit 2 for a broken set because the caller named the set that is broken", "returning exit 1 from the listing when any layer holds a broken set", "reusing StoreError so that the diagnostic says the store could not be read", "printing the failure to stderr and exiting 0 when a set is asked for by name", "letting a non-UTF-8 file panic rather than become a reasoned row"]
rationale = "An unknown name is retryable by reading the diagnostic and naming another; a broken file is not, and blaming the caller for someone else's file teaches the wrong lesson. The zero row already means success including reported problems, so a listing whose content is a problem is still a successful report — and exiting non-zero from the listing would stop a caller listing their way to the diagnosis. Read and decode failure are the same class as parse failure: the filesystem supplied something unusable, and a panic would reopen the failure mode SL-004 closed for the store loader."
consequences = ["Error gains a third variant rather than pretending a set lives in a store", "the exit 1 class covers read and decode failure as well as parse failure so a non-UTF-8 set is never a panic", "the learn exit table gains a clause for a conventions set that could not be loaded", "three behaviours must have tests that can go red: listing a broken set at 0", " refusing it by name at 1 with path and line", " and an unresolved name still at 2", "the step-1 filesystem read creates", " locks and recovers nothing", " so DEC-004's ordering holds"]
decided_by = "operator and agent"
decided_on = "2026-11-02"

