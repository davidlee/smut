[facet]                         # every field typed; seeded empty (captured later)
context = "SL-001 answer to inq-6: how projection and the selection result are separated so the core carries full entities plus a field set while get/query emit a flat non-inlined envelope. Renderers must keep connectivity that select hides."
choice = "A borrowing Selection (ids, store, field set, missing, truncation) with project and envelope as pure functions in the core; entity serialisation at the final boundary through one shared Entity wrapper whose subject is the entity node (an object with a nonempty string `id`) wherever it appears — an entity node names `id` first with lexical remaining keys, every other object is lexical, arrays in order; pretty files and compact stdout."
alternatives = ["fully key-sorted entities", " upstream custom Serialize with re-parse", " one textual form for files and stdout", " renderers holding the store for free access"]
rationale = "Value erases upstream ordering, so the wrapper must act at the byte boundary; a borrowing selection keeps one lifetime and one code path for get and query; the store reference must not become permission to widen results past limit."
consequences = ["Two byte forms are specified separately (pretty files", " compact stdout); the select set never determines key order; renderers consume structured Selection with serialisation not between selection and rendering."]
decided_by = "operator (serialisation clarification) and agent"
decided_on = "2026-11-01"

