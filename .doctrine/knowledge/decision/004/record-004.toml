[facet]                         # every field typed; seeded empty (captured later)
context = "SL-001 answer to inq-7: what the store lock covers and in what order lock, recovery, validation and read/write run. The brief requires a single exclusive lock, initialisation coordinated under it, recovery before serving, and never creating a store for reads or empty declarations."
choice = "One exclusive flock on a permanent lock inode for every command touching store state; parse before any filesystem access; pre-compute against an empty snapshot so an unwritable or invalid request never creates a store; recover strictly before validation; validate unexplained entries as explicit inconsistency; serialise output under the lock, write after unlocking."
alternatives = ["shared read locks with upgrade", " trusting the mkdir winner to fsync the parent", " treating an index-less .smut as empty", " cleaning arbitrary *.tmp during recovery"]
rationale = "Recovery before validation is what keeps a crashed store recoverable instead of refused; the permanent lock inode is why the index inode cannot be the lock; validating unexplained files prevents an entity silently leaving the graph; preparing output under the lock guarantees the response describes the snapshot actually processed."
consequences = ["A stdout failure after commit cannot undo the commit (documented); every process using a possibly new .smut syncs the parent entry itself; initialisation states have their own interruption tests even though index creation has one path; nothing is promised to a process that does not take the lock."]
decided_by = "operator (five amendments, two wording corrections) and agent"
decided_on = "2026-11-01"

