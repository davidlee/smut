choice = "During reconciliation amend affected passages in the six decisions in place, with a dated amendment citing ADR-001 and SL-004. DEC-005 explicitly changes the structural identity rule to smut_id and permits ordinary id as inline metadata, retaining hoisting, labels, preorder and error classes and citing DEC-021 for loader validation. DEC-007 updates identity-first ordering and mandatory identity projection, including select:[]. DEC-010 updates identity-related documentation obligations and the format version. DEC-016 updates the two-call recipe's identity-field spelling. DEC-002 and DEC-012 update identity keys in examples while preserving patch and traversal semantics."
alternatives = ["Create replacement decisions superseding the six old records"]
rationale = "Targeted in-place amendments retain stable references and substantial reasoning that remains valid. Dated amendment notes and Git history explain the change without duplicating the decisions."
