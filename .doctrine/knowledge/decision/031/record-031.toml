schema = "doctrine.knowledge"
version = 1

id = 31
slug = "sets-in-force-are-chosen-by-layer-and-named-by-origin"
title = "The conventions set in force is chosen by layer and named by its origin — and its body stays the file's own bytes"
record_kind = "decision"
status = "accepted"
created = "2026-11-02"
updated = "2026-11-02"
tags = ["config", "conventions", "surface"]

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-026 promised origin printing plus a set header naming its own file. DEC-028 made a set's bytes load-bearing: the seed's body is the file's text. The two promises collide, and an independent critical pass found that DEC-028's malformed-file sentence reads wider than either promise: it says a malformed file never breaks the other layers, which is not true of name resolution under precedence-by-layer."
choice = "Keep the bytes and move the origin. Precedence is by layer and never by validity; a set is identified for display and resolution by its origin and every listing row names layer and path; printed prose is the body — the file without its frontmatter — so the command is a printer, not a round-trip; a shadowed set stays visible, marked shadowed and unaddressable; a failed set is a row carrying its path and one-line reason and refuses by name, and unreadable or non-UTF-8 bytes are that same failure; a row prints the file's own path while the seed's source is layer-relative; a seed title is the heading verbatim."
alternatives = ["injecting a header line naming the file into printed prose per DEC-026's original wording", "printing the origin to stderr alongside unchanged prose", "making validity a tie-breaker so a broken project set falls back to the user set", "refusing the whole command when any layer holds a broken set", "qualifying set names by layer so a shadowed set can be addressed", "keeping the synthesised Conventions-prefixed seed title"]
rationale = "A fallback whose trigger is a parse failure in a nearer file makes the advice a caller gets depend on something they cannot see. Keeping the body identical to the file preserves the property that a seeded store record and its source diff clean, which is what makes the file the durable copy rather than an aspiration. The origin still reaches the reader, in the one command whose job is to say what exists. Layer qualification of names would have to change the seed's fixed id, so it is a separate decision rather than a consequence."
consequences = ["the listing changes shape from one row per set to one row per file with layer and path", "smut conventions NAME prints the body without frontmatter so a set file's metadata never appears as prose", "regenerating a set file from the printed prose loses its frontmatter — accepted", " the command prints", "a shadowed set is visible in the listing but unaddressable; its content needs the path the listing prints", "a set that cannot be read or decoded is a row with a reason and never a panic", "the seed's title is the author's heading verbatim so the shipped file carries the Conventions prefix itself", "a file set with no frontmatter version omits the field rather than claiming the crate's", "the .config-in-a-repository confusion loses its second cure and depends on the reader running the listing", "a broken project set shadows a working user set and must be tested as doing so", "DEC-028's malformed-file sentence needs an in-place revision at reconcile"]
decided_by = "operator and agent"
decided_on = "2026-11-02"

