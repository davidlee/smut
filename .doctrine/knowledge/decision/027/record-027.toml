version = 1

id = 27
slug = "a-predicate-that-cannot-hold-is-refused-by-name-within-one-fields-conditions"
title = "A predicate that cannot hold is refused by name, within one field's conditions"
record_kind = "decision"
status = "accepted"
created = "2026-11-02"
updated = "2026-11-02"
tags = ["cli", "contract", "predicates"]

[facet]                         # every field typed; seeded empty (captured later)
context = 'The 0.2.0 rc trial ranked a silent empty answer as its first friction: a legal ANDed predicate such as {"status":{"$eq":"open","$ne":"open"}} returns [] with exit 0, while every other malformed input gets a named refusal. The three-store usability exercise added a second silent-empty shape (a where naming a field no entity carries) and a third case that wanted a warning on a successful declare. The open question was whether smut should gain a diagnostic channel at all, and the answer was to reuse the refusal path.'
choice = "Refuse at parse time, before any store access, when one field condition list is provably unsatisfiable, naming the field and the contradiction. Two rules decide whether a given field is checked. First, position, carried as a demand flag: the root is demanded, `And` passes demand to every child, `Not` flips it, `Or` determines its children only when the `Or` is itself demanded false, and a Field is judged iff it arrives demanded. A contradiction is therefore refused wherever demand reaches the field — at the root, under `$and`, and through `$not`s that flip it — and never inside an `$or` that must hold, nor under an odd number of `$not`s, where a false inner predicate makes `$not` true and the query still has an answer. A must-hold `$or` stops the walk, so its contents are not analysed there and a one-element `$or` around a contradiction is accepted; an `$or` that must not hold hands its children `false`, so a `$not` beneath it restores demand. Second, decidability: the check decides only when the conditions bound the field to one value (`$eq v`, so every other condition is evaluable on `v`) or to a finite set (`$in S`, so some member of S must satisfy the rest), plus the two presence facts (`$exists:false` beside any other condition, and `$in` of nothing). Outside those bounds a condition is undecidable: `$contains` against a value the request does not bound is left silent. No new envelope member, no success-path stderr, DEC-019 untouched. Two neighbours are decided the other way: a where naming a field no entity carries is taught and never refused, because refusing would punish filtering as a way to probe a store and the check is only sound when the roots are store-wide; a declaration carrying kind but no type is neither refused nor warned, its cure being delivery through the conventions surface, and if it is ever revived it is an advisory inside changes[] and never stderr."
alternatives = ["the enumerated six-form subset exactly as first written", " the enumerated subset plus the $ne-and-$in dual only", " a notes member carrying diagnostics on the envelope", " a warning on stderr for a successful command", " refusing the absent-field case as well", " leaving the silence and relying on teaching alone", " extending the check across $and clauses so cross-clause contradictions are caught too"]
rationale = "The decidable set is sound: every refused shape is false for every store, so no correct query changes result and no false positive is possible — but only once position is part of the rule, because a condition that cannot hold under an odd number of `$not`s makes the predicate true of everything, and one inside an `$or` that must hold leaves the query answerable. Demand propagation, not parity and not a fixed set of positions, is the precise form of that: what matters is whether the predicate could hold at all if this field did not, and only `Or` and an odd `Not` break that. Boundedness is the right decidability criterion because a bounded value turns a predicate question into evaluation: the same `Condition::holds` the query itself uses decides the refusal, so refusal and evaluation cannot disagree. Earlier statements of this rule were wrong in four ways: an enumeration of six forms of which two needed a duplicate key and so could not be written; a rule that excluded `$contains` beside `$in`, which is decidable because `$in` bounds the field to a finite set; a rule blind to position that would have refused satisfiable queries; and a parity shorthand that is false wherever an `$or` interrupts the negations. It is also 0.2-local: no 0.1 query can express a predicate, so no 0.1 caller is affected. Silence is the top-ranked invisible failure in the usability work, and this is the cheapest sound mechanism that removes one instance of it. from: [] remains the documented spelling for an intentional empty result."
consequences = ["A partial detector obliges the guide to scope the guarantee", " and the scoping sentence must name the remaining silences: `$contains` with neither `$eq` nor `$in` beside it", " and any contradiction outside required position", " or absence of a refusal becomes false assurance", " runtime-composed predicates move from exit 0 to exit 2", " cross-clause contradictions through $and stay silent by design", " the absent-field and kind-without-type cases are closed as teaching and delivery rather than diagnostics", " a new refusal variant and its message join the pinned refusal surface"]
decided_by = "operator and agent"
decided_on = "2026-11-02"

