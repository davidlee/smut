choice = "Accept from/select/order/limit with the brief's types; query {} returns all entities subject to the default limit; recognised future keys rejected by name with the release that will accept them; arbitrary unknown keys reported plainly as unknown; representative 0.1 invocations kept as compatibility tests."
alternatives = ["accepting future keys as no-ops", " naming a release for unrecognised keys", " claiming rejection alone guarantees unchanged behaviour"]
rationale = "Rejection keeps the syntax additive without guessing at semantics for keys nobody planned; compatibility is a tested property, not a consequence of refusing input."
