slug = "the-argv-grammar-stays-inside-claps-derive-a-bare-vecstring-and-no-positional-attributes"
title = "The argv grammar stays inside clap's derive: a bare `Vec<String>` and no positional attributes"
record_kind = "decision"
status = "accepted"
created = "2026-11-02"
updated = "2026-11-02"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "`q` interleaves arbitrary positional tokens with flags, and clap v4 derive was unproven for that shape. DEC-008's alternatives reject hand-rolled parsing, so a failure would have been a decision change rather than a workaround."
choice = "The tokens are a bare `Vec<String>` positional with no `#[arg]` attributes at all — no `trailing_var_arg`, `allow_hyphen_values`, `last`, `value_terminator` or `num_args`. A spike on the pinned clap 4.6.7 carried all twelve grammar cases, including flags interleaved after a positional has started."
alternatives = ["`trailing_var_arg` — silently turns every flag after the first token into a token", "`allow_hyphen_values` — the same, plus leaks a literal `--` into the tokens, plus makes `-weird-id` a legal token", "`last` or `value_terminator` — breaks `--` or demands a literal one", "reading `std::env::args` by hand — a DEC-008 amendment, and unnecessary"]
rationale = "The danger in this corner is not failure but silence: three of the five candidates misparse with exit 0 and a plausible struct, so a reader of the parsed result cannot tell. The bare positional is also the minimal spelling, so the safe choice is the one with nothing to explain."
consequences = ["a token directly after a value-taking flag is that flag's value, so examples place values where they read as values", "`smut q` alone parses as an empty request, so the no-query refusal belongs to this layer", "clap names `-w` rather than the token in the hyphen-token error; echoing the real token needs an argv pre-scan", "repeated boolean flags error rather than being idempotent", "any future attribute on the positional must be argued against this record"]
decided_by = "agent, answering the design run's inquiries; subject to the run's sufficiency acceptance"
decided_on = "2026-11-02"

