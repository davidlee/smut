context = "SL-001 answer to inq-10: what is documented, and where each piece lives."
choice = "README with worked example, command table and sharp edges quoting the DEC-003 guarantee; docs/store-format.md versioned as format_version 2 covering layout, serialisation (structural identity `smut_id`, an ordinary `id` as data), journal states and fsync obligations, recovery, reserved names, the nested-identity corruption refusal and the commit-before-acknowledgement ambiguity; learn limited to the shipped surface."
alternatives = ["paraphrasing the durability guarantee", " documenting unadopted behaviour", " a migration path in 0.1"]
rationale = "The guarantee has to be quotable verbatim to stay honest; a format doc that drifts from the protocol is worse than none."
consequences = ["An unknown or older format_version is exit 1 with no migration path or compatibility reader and no repair path (DEC-022); the README states Linux as the acceptance platform and flock as advisory."]
