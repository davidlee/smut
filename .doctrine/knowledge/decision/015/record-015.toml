[facet]                         # every field typed; seeded empty (captured later)
context = "The brief says stop expansion at budget and that a depth boundary is not truncation; the unit and the reporting condition have to be explicit or the reason lies."
choice = "Budget counts entity expansions (one scan per entity, both directions). Check before expanding; on exhaustion the rest of the queue is frontier. `traversal_budget` only when an expansion the depth bound allowed was actually declined."
alternatives = ["Budget counts discovered entities", "Budget counts edge visits", "Hitting the budget exactly still truncates"]
rationale = "Expansion is the expensive unit; reporting only a real omission mirrors result_limit and keeps a complete walk from claiming truncation."
consequences = ["`depth: 0` is never budget truncation", "Both reasons can fire, budget then limit", "Budget bounds neither the root scan nor the per-expansion backlink scan"]
