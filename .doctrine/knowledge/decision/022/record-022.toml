[facet]                         # every field typed; seeded empty (captured later)
context = "SL-004 inq-3: is the existing format-version refusal sufficiently clean and loud for the identity format break?"
choice = "Keep the existing version-refusal diagnostic shape and storage failure class: exit 1 naming the format version found and the version this build reads. Apply the corresponding version check to committed journal manifests before replay. Document the break in docs/store-format.md under STD-001. Add no release-specific migration advice, migration tooling, compatibility reader or repair path."
alternatives = ["Expand the diagnostic with the identity rename and advice to re-declare existing data"]
rationale = "The operator accepts the existing found-versus-expected version diagnostic and has essentially no legacy consumers whose compatibility they wish to preserve. Their report of 14 downloads of 0.1, with an expectation that 13 were bots, is operator context rather than independently verified adoption data. The stated requirement is to fail clean and loud, not to preserve compatibility."
consequences = ["Old stores are refused rather than interpreted under the new identity spelling.", "Old committed journal manifests are refused by version before replay.", "Keep diagnostic guidance release-independent and document the format break in the format record."]
decided_by = "operator and agent"
decided_on = "2026-11-02"

