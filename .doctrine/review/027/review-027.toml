[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "The five-operator set is duplicated in two literals whose only coupling is a comment"
detail = """
Expected: one source of truth for the closed operator set, or a test that proves the two sites agree for every name the module claims. PHASE-02/EX-1 asserts that the cross-referencing comments mean "a sixth operator cannot be added to one and not the other"; comments cannot enforce that.

Observed: the set is enumerated twice and independently — src/predicate.rs:94, ""$eq" | "$ne" | "$in" | "$exists" | "$contains"", inside the operator if operator.starts_with('$') arm opened at :87; and src/predicate.rs:193-204, parse_condition's five match arms, whose catch-all at :205 raises UnknownPredicateOperator. The only coupling is prose at :88-92 and :189-191. No test reads both: parse_refuses_an_unknown_operator_at_either_level (:543) pins only $foo, $and, $or and $not, and nothing asserts that a name parse_condition accepts is refused as misplaced rather than unknown at the predicate level.

Drift symptom: adding $regex to parse_condition alone makes {"where":{"$regex":"x"}} render "smut: unknown predicate operator: $regex" — a false sentence about a defined operator, the class RV-026 F-2 and F-9 removed at this same seam.

Found by the pre-close code review; both sites confirmed at raise. The reviewer's proposed remedy (a const plus a test) leaves the addition half of the drift class open, which is why the disposition routes to a backlog item rather than an in-audit repair."""
disposition = "follow-up"
response = """
Confirmed: two independent literals, coupled only by a comment, with no test reading both.

Not fixed in this audit, and the reason is not size. The reviewer's remedy (a const consulted by the predicate-level arm plus a test) closes the removal half of the drift class and leaves the addition half open, because parse_condition's arms each carry different operand handling and cannot be driven from a string list. A true single source of truth needs an operator enum with one parser consulted by both sites — a design change to a module SL-005 just settled, on a latent risk with no sixth operator in existence. PHASE-02/EX-1 fixed the two-arm shape deliberately; redesigning it from the audit would be the scope creep the autonomy envelope forbids.

Captured as IMP-016, which states the enum shape and why a const does not close the class. Severity stays minor: the drift symptom is real but needs a future edit to trigger it."""

