[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "tests/predicates.rs's module doc still says two cases run the binary, and the delta made it three"
detail = """
Expected: the file's module doc enumerates the cases that spawn the binary and the process-level property each fixes, because it is the only place that explains why some cases run `smut` rather than `spec::parse`.

Observed: tests/predicates.rs:15-17 still reads "The final two cases run the binary, because the two properties they fix — 'the whole request is validated before the store is opened' (EX-6) and 'a valid `where` returns the filtered objects' — are process-level promises." After 9727c1c there are three binary cases: a_malformed_predicate_rejects_the_whole_request_before_any_store_is_opened (:550), a_misplaced_operator_is_refused_naming_its_position_and_never_a_field (:643, added by this delta and unmentioned), and a_where_query_through_the_cli_returns_the_filtered_objects (:727). "The final two" now names :643 and :727, so both the positional claim and the property list disagree with the file.

Cost: PHASE-02/EX-5 exists because "a false sentence is not left standing in a selector file"; the phase left one standing directly above its own new test, and a reader who trusts the doc will not know a refusal case spawns the binary.

Found by the pre-close code review; confirmed at raise against the current file."""
disposition = "fix-now"
response = """
Confirmed at the exact lines. "The final two cases run the binary" is false since 9727c1c added a third binary case, and the property list beside it omits the refusal property the new case fixes.

Disposed fix-now rather than follow-up: it is one sentence in a file this slice edited, PHASE-02/EX-5 defined the rule that a false sentence is not left standing in a selector file, and the repair is smaller than the ledger entry describing it. The audit repairs it directly (a doc-comment-only edit on tests/predicates.rs), which reconcile does not own — reconcile writes design/spec prose, not code."""

