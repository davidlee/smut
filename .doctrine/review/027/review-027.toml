Expected: the design is the contract the implementation is audited against, so its description of the shipped rule should be true of the shipped rule.

Observed: CHR-003 enumerates six sentences that are false of the code at 9727c1c: (1) section 1's diagram label "each Field is judged only when reached through And" — the root Field is judged with no And; (2) section 2's shape and section 6's predicate.rs row say the walk is "called once at the end of parse", which is the recursive-return defect RV-026 F-1 raised — the shipped shape is a private parse_predicate plus a public parse; (3) section 5's binary-level row omits the smut: prefix on the pinned line while the message-level pin beside it is the bare sentence; (4) section 6 says "including the four pins" where section 5 defines three; (5) section 7's "$or contents are not analysed" over-claims — a negated $or hands its children false and restores demand; (6) section 3's "$exists: false beside any other condition" names one operator and no empty list, while DEC-030 asks each sentence to name both. Plus the section-1 "required-position" vs section 2-6 "demanded" terminology split.

The implementation is correct in every one of these cases — the plan implements the right behaviour and the VT/VA evidence is green. The defect is that the design, which is the conformance baseline, describes a different rule from the one shipped. Parked on CHR-003 because the design run is locked (dr-01a19a1e, rev 43) and editing materialised prose would desync its fingerprints.

Surfaced at the audit; the six items are CHR-003's own enumeration, each re-checked against the code at 9727c1c rather than accepted from the backlog body."""
