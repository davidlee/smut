[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "The no-store assertion cannot observe the ordering it claims, because query never creates a store"
detail = """
Expected: tests/predicates.rs:693-696, whose failure message reads "the request is validated before the store is opened, so no store exists", can fail if validation moves after the store step — that is the DEC-004/EX-6 evidence design section 5 and both phase sheets claim it supplies.

Observed: it cannot. The test's only command is smut(&scratch, &["query", specification]) (:671), Query::creates_store() is false (src/cli.rs:121-123), and Store::run therefore returns StoreError::Absent without touching the filesystem whenever the store is absent (src/store/mod.rs:277-284). Under every ordering of spec::parse against store.run, .smut is never created, so !scratch.has_store() passes unconditionally. The same holds for the four contradiction rows added at :635-638 and the pre-existing row at :583-586.

What does carry the ordering: refused.code == 2 (:673-677). A request validated after the store step, against an absent store, exits 1 with "no store at …"; exit 2 rather than 1 is the discriminating assertion.

Cost: the slice's own evidence narrative records EX-6 as stronger than the test can give, and a maintainer who reorders validation against store access while Query::creates_store() stays false sees green.

Found by the pre-close code review; the three source claims were re-read at raise. The defect is in design section 5's attribution of evidential power, not in the assertion itself (which is true, merely non-discriminating)."""
disposition = "design-wrong"
response = """
Confirmed against source: Query::creates_store() is false (src/cli.rs:121-123) and Store::run returns Absent without touching the filesystem when the store is absent (src/store/mod.rs:277-284), so the no-store assertion cannot fail for a query under any ordering.

The assertion itself is not the defect — it is true, and it is the house idiom. The defect is design section 5's binary-level row, which attributes the DEC-004 ordering promise to "the scratch directory holds no store after the refusal"; for a query that promise is carried by exit 2 rather than exit 1. That is a false claim about the evidence in the audit baseline, so the reconcile write surface is design prose, not code.

Reconcile: design section 5's contradiction-row table, the "the scratch directory holds no store after the refusal" row — state that exit 2 (not the absent directory) is the discriminating assertion for a query, because a query never creates a store. The wider idiom across the suite is IMP-015."""

