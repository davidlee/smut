[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "Three assertions in the prose test cannot fail"
detail = '''
`tests/conventions.rs:244-260`. `!contains("summary:")`, `!contains("version:")` and `!starts_with("---")` all sit *after* `assert_eq!(printed.stdout, format!("{}\n", body()))` at `:237-241`, and `body()` is derived from the same `EMBEDDED` bytes, so it contains none of those strings and no leading `---`. Once the equality passes, all three are tautologies: no mutation of the reader reddens them without also reddening the equality two lines above. The comment at `:242-243` ("a reader that reproduced the fence reddens on all three") is therefore untrue. This is the repository's own recorded lesson, and the sibling test in the same file orders its exact row last (`:215-224`) for precisely this reason.

Smallest acceptable correction: move the exact equality to the end of the test so the three negatives carry evidence, or delete the three.'''
disposition = "fix-now"
response = "Upheld, and it is the sharper of the two minors: three assertions that no input could falsify are exactly what the plan's own discipline forbids, and the sibling test in the same file already got this right by ordering its exact row last. Reordering, not deleting — the exact equality moves to the end of the test so the three negatives carry evidence again. The untrue comment goes with the reorder."

