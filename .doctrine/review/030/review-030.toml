[[finding]]
id = "F-1"
status = "answered"
severity = "minor"
title = "The inventory length pin claims a guarantee it does not give"
detail = """
`src/error.rs:763-768`. The message says "the count is pinned so a variant added without its row cannot pass". That is false: `StoreError` holds 14 variants (`:160-257`, including `NoFreshBasename` at `:248`), the vec holds 13 (`:508-556`), and a variant added with no row leaves `len() == 13` and the test green. The pin fires only when a row is added without moving the count — the inverse of the claim. The same diff's own comment (`:506-507`) admits the list is short of the enum. The `Display` arm at `:450` is compiler-enforced by match exhaustiveness; the vec is not.

Smallest acceptable correction: reword the message to what the pin actually enforces ("a row added without the count moving cannot pass"). Adding the `NoFreshBasename` row and pinning 14 is the better fix but repairs a pre-existing omission, so it is deferred to the backlog rather than absorbed here.

Raised from the independent review run `4afab753` over `4015f6a..77444e8`."""
disposition = "fix-now"
response = "Upheld. The message overclaims: the vec pin compares a count to a literal, so a variant added without a row leaves the count unchanged and the test green. Correcting the message to what the pin enforces — a row added without the count moving cannot pass — in a corrective commit against PHASE-02's owned `src/error.rs`. The `NoFreshBasename` row and the 14 count would make the inventory real, but that omission predates this phase and sits outside its six-file charter, so it goes to the backlog as `follow-up` rather than being absorbed here. The `Display` arm remains compiler-enforced by match exhaustiveness, which is the part the message should not have claimed for the vec."

