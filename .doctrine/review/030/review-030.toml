title = "The diagnostic says a `key: value` line is not one"
detail = """
`src/conventions.rs:302-313`. `foo bar: baz` has a colon, so `split_once` succeeds; the key then fails the whitespace test and is refused through `not_key_value(number)`, whose sentence reads "frontmatter line N is not `key: value`". The refusal is right and the sentence is false — it misdescribes the input to the person debugging it.

Smallest acceptable correction: fold the wording, e.g. "is not a flat `key: value` line: the key holds a space", or give the whitespace-in-key class its own sentence."""
disposition = "fix-now"
response = "Upheld. The refusal class is right and the sentence lies about the input, which is the one thing a diagnostic may not do. Folding the wording to name the actual defect — the key holds a space — rather than claiming the line has no colon."

