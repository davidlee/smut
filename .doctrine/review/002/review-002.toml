facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """Pass over design.md at revision 37 (materialisation watermark current, twelve sections, zero changes since baseline) — the settled content, after RV-001's three findings were integrated and verified. Re-checked the interactions the fixes displaced: §5's "only declare creates a store" against §7.2 and §8.3 (agree); §4.3's uniform index staging against §11's crash-suite expectations (one shape, consistent); §2's feature gate against §12's Cargo.toml row and §11.1's injection rule (agree); and step 6's recompute rationale, which still holds for every command that reaches it. No new findings. The declared attack surfaces in the brief remain available to the user if they want a formal hostile pass; a later raise would clear this marker and it would be concluded again."""

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Adversarial review of all twelve materialised SL-001 design sections at revision 37 against the root implementation brief, SL-001 scope, DEC-001 through DEC-011, and RV-001 dispositions. Rechecked RV-001 fixes as resolved. Probed declaration normalization/equality, ID allocation, API boundaries, initialization/concurrency, journal durability and recovery ordering, selection/order/projection, Markdown diagnostics, CLI and test gates. Raised one blocker and two major design gaps; left open for responder. No implementation, crash or power-loss execution was performed. Linux fsync semantics checked against the Linux manual."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-001"

[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "Commit protocol omits the durability barrier for staged recovery material"
detail = "Expected: before publishing a durable commit decision, every staged entity/index file and manifest, and their directory entries, must be durable. Observed: design §4.3 (lines 273-310) and DEC-003 specify writing staged bytes then renaming prepare to commit and fsyncing .smut, but never require fsync of staged files, manifest, or journal.prepare itself. The parent-directory fsync does not establish durability of the child's contents. A conforming implementation can persist journal.commit then lose its manifest or a staged file on power failure; §4.4 must refuse it as corrupt and cannot roll forward. This is a missing ordering obligation in the design, not an observed implementation failure. Repair: explicitly require successful write_all and file fsync for each staged file and manifest, then journal-directory fsync, before prepare-to-commit; retain existing parent fsync before apply. Specify pre-commit treatment on any barrier failure and fault-injection assertions for the order. Linux fsync reference: https://man7.org/linux/man-pages/man2/fsync.2.html ."
disposition = "design-wrong"
route = "review"
response = """
Verified against §4.3, §4.4, DEC-003 and the brief's sync obligation. The observation holds: the design enumerated its fsync points and omitted the staged material, while recovery replays staged bytes and refuses a commit whose staged set is incomplete — so a durable commit name over non-durable staging is either a refusal of a batch that was committed or a republication of torn bytes. Repair, design revision 42: §4.3 now requires, before the prepare-to-commit rename, a completed write and per-file fsync of every staged entity file and the manifest, then an fsync of the prepare directory itself so its entries are durable, and only then the rename with the existing parent fsync. Any barrier failure before the rename is pre-commit: exit 1, discard prepare, store untouched — the asymmetry with the roll-forward-only post-commit case is stated as the point. DEC-003 gains the barrier in its choice, rationale and consequences; §4.4 states that a durable commit therefore always has complete replay material, so an incomplete staged set is corruption rather than a tolerated crash outcome; §4.6's claim names the replay material; §11.1 makes the barrier order an asserted fault-injection obligation and §10 says what that proves.
"""

