[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "Appending diagnostics after verbatim Markdown can hide incompleteness"
detail = "Expected: the brief and §7.1 require visibly disclosed missing roots and truncation. Observed: §7.1 and DEC-009 emit arbitrary body/string-field Markdown verbatim and put diagnostics after it with only a blank line. A valid body ending with an unclosed HTML comment ('<!--') absorbs all following diagnostics in a rendered Markdown document; an unclosed fenced code block also changes their interpretation. This does not require script execution. For example, select a stored body '<!--' with limit 1 while a second row exists: the raw output contains a truncation notice but the rendered document hides it. Repair: place the completeness notice before any untrusted verbatim content, or define a rendering boundary that demonstrably prevents content swallowing the notice while preserving body bytes. Add rendering cases for unclosed comments/fences and raw string attributes. This is a design-level counterexample, not a runtime test result."
disposition = "design-wrong"
route = "review"
response = """
Verified against §7.1, DEC-009 and the brief's disclosure requirement. The counterexample holds and is reachable with ordinary stored data: a body ending in an unclosed HTML comment or an unclosed fence absorbs everything after it, so a notice appended after the content is disclosed in the bytes and hidden on the page. Repair, design revision 42, places the completeness notice first, before any entity content, so no stored byte can precede and absorb it, and states the boundary explicitly: smut guarantees that its own notice cannot be absorbed, and does not claim that stored bodies cannot absorb other entities, because escaping body bytes would break verbatim fidelity. DEC-009 carries the ordering, the reason and the rejected alternative of appending; §8.3 gains the resolved edge case; §11.1 gains the render cases the finding names — an unclosed comment and an unclosed fence with a truncated selection; and the rule is stated as inherited by the 1.0 Mermaid renderer.
"""

