[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "normalize cannot enforce existing-ID collision avoidance through its declared API"
detail = "Expected: §3.4 and §8.1 invariant 6 require the core to reject generated candidates already in the loaded snapshot. Observed: DEC-001's core signature is normalize(input: &Value, ids: &mut dyn IdSource), with no snapshot or existing-ID set; only apply receives Entities. The same record explicitly assigns pre-scanning and candidate rejection to the core, while §2 keeps the shell out of declaration semantics. With existing id x and an injected candidate sequence [x,y], normalize has no declared information with which to skip x; apply can accidentally upsert x or must reject/re-normalize through an unspecified protocol. Recomputing under the lock does not supply the absent argument. Repair: add an explicit occupied-ID input to normalize (from the authoritative locked snapshot), or define and document a snapshot-aware IdSource allocation contract and ownership of the reserved set. Pin an integration case forcing collision with an existing id and another case where concurrent initialization makes the empty-snapshot precheck stale. Verified API/contract mismatch; no implementation exists to exercise."
disposition = "design-wrong"
route = "review"
response = """
Verified against DEC-001 rule 3 and its surface block, §3.4, §8.1 invariant 6 and §5 steps 2 and 6. The observation holds and the contract contradicted itself: rule 3 requires generated ids to avoid existing entity ids while normalize received no snapshot with which to know them. Repair, design revision 42, takes the finding's first option: normalize now takes the entity map it must not collide with and reads occupant ids from its keys — the empty map at pre-compute, the loaded snapshot at recompute — so invariant 6 is enforced inside the function that must obey it. The second option, a snapshot-aware id source, is recorded as a rejected alternative in DEC-001 with its reason: it pushes an obligation the core must not be able to break into a caller convention that fails silently, and leaves the contract untestable without a fake standing in for the snapshot. §3.4, §5 and §8.1 are reworded to match. The two cases the finding asks for are recorded in §11.1 as test obligations: a forced collision between a generated candidate and a stored id, and a concurrent initialisation that makes the empty-snapshot precheck stale.
"""

