[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design §2 claims two = on one field are always unsatisfiable; a list beside a single value is satisfiable"
detail = """
Expected: design §2's two-`=` rule agrees with what the merge can express. Observed: the code refuses `status=a,b status=c` in the caller's words — `cannot read "status=a,b status=c": q carries one = per field; use smut query` (exit 2) — which is the truthful voice, because `c` may be a member of `{a,b}`; while §2 says "Two `=` with different values are unsatisfiable for every store and unspellable here, so they are refused in DEC-027/DEC-030's family".

The fourth design correction covered list-vs-list (`status=a,b status=c,d`); list-vs-single is the case §2's sentence still over-claims. Nothing in the code is wrong: `Where::insert`'s guard (src/dsl.rs:531-536, `EQUALS if previous.key == condition.key && condition.key != IN`) is exactly what keeps the contradiction voice off satisfiable cases. The design owes the wording, not the behaviour."""
disposition = "design-wrong"
response = """
Confirmed as a design-prose defect only. The code's behaviour is right in both directions — the contradiction voice for two differing single values, the caller's own tokens for every satisfiable repeat — and `Where::insert`'s `key != IN` guard is what keeps them apart.

Reconcile owes §2 bullet 1 the qualifier: two `=` are unsatisfiable when both sides are single values; a comma list beside a single value (or beside another list) is satisfiable and is refused because the emitted condition object carries one `$eq` per field, not because no entity could satisfy it. §2 bullet 2 already names "two comma lists"; the list-vs-single case belongs with it, and the fifth correction's count is unaffected — this is a wording repair inside §2, not a sixth correction."""

