[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "A token whose value carries the operator is refused as a field name holding it"
detail = """
Expected: a refusal true of the line the caller typed. `url=https://example.com/?a=b` is inexpressible on this surface, so exit 2 is right — the sentence should say the token carries two operators, not diagnose which half does.

Observed: `smut q 'url=a=b'` -> `smut: cannot read "url=a=b": a field name holding = is outside q's grammar; use smut query` (exit 2). The field is `url`; the value holds the `=`. Same at `smut q 'title~a~b'` -> "a field name holding ~". Reproduced against target/debug/smut.

Cause: dsl::ambiguous maps "every operator found is the same spelling" onto the field-name reason (src/dsl.rs:299-306), generalising design §3's row, which was written for `a=b=c` alone. The guide narrows the same way — "a field name holding =, ~ or ," (src/learn.rs:141-143) — so a reader with an `=` in a URL is told their field name is at fault, and the class of inexpressible lines is really "a token carrying two operators, whichever half holds the second".

Pinned deliberately: a_token_with_two_operators_is_refused_with_both_named (tests/dsl.rs:377-396) and the §3 census row `a=b=c` (tests/dsl.rs:603-606). The repair therefore moves the sentence in design §3, in the module and in both pins together.

Class: DEC-030 — a refusal names what the caller typed. RV-031 F-2 is the same failure at another altitude: a sentence true of the case it was written for, generalised to cases where it is false."""
disposition = "design-wrong"
response = """
Confirmed, and the design owns it: §3's field-name row was authored for `a=b=c` and the code generalises it to every repeated-operator token, so the sentence asserts a cause it has not established. Expected vs observed is exactly as raised.

Reconcile pays three sites in one wording, in this order: design §3's row first (it is the authoring surface), then the two mirrors — `dsl::ambiguous`'s same-spelling reason (src/dsl.rs:299-306) and the whole-line pins at tests/dsl.rs:377-396 and :603-606 — and the guide sentence at src/learn.rs:141-143, whose list of unsayable things ("a field name holding =, ~ or ,") needs the value case beside it.

Constraint on the replacement, so reconcile is not authoring a second guess: it must be true whether the second operator sits in the field or in the value, so it may not name either half as the culprit; it stays one line, quotes the token, and points at `smut query` (DEC-030). Suggested shape, not decided text: `cannot read "a=b=c": it carries two =, so q cannot tell the field from the value; use smut query`."""

