[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "The slice's eight decisions are recorded `proposed` while the release ships under them and 0.1's were `accepted`"
detail = """
Expected: a settled decision the design indexes, the plan implements and the code exercises is recorded at the status that means settled. 0.1's decisions were written straight into that state at design-run time.

Observed: DEC-012, DEC-013, DEC-014, DEC-015, DEC-016, DEC-017, DEC-018 and DEC-019 all carry status = "proposed". DEC-001, DEC-005, DEC-010 and DEC-011 carry status = "accepted", and DEC-011 was created accepted in bcd1389 (the SL-001 design run commit) and never changed since.

Evidence:
- `doctrine show DEC-011`: "01-spec-surface-four-keys… · decision · accepted"; `git show bcd1389:.doctrine/knowledge/decision/011/record-011.toml` has status = "accepted" at creation.
- DEC-012…DEC-019: every `.doctrine/knowledge/decision/NNN/record-NNN.toml` line 8 reads status = "proposed"; no commit ever changed one.
- design.md §15 presents the eight as the slice's settled decisions ("Settles …") and §3 says "this design records a decision rather than inventing a requirement"; design.md is locked (run dr-01a196a8, rev 62).
- The tree implements all eight: DEC-012/013/014 in src/select.rs's envelope and Walk scoping, DEC-015 in the budget check, DEC-016 in src/learn.rs's recipe, DEC-017 in src/conventions.rs and the hygiene prose, DEC-018 in tests/fixtures/interview/**, DEC-019 in the re-cut tests.

Consequence: reconciled truth and canon disagree. A future agent reading `doctrine show DEC-013` is told the provenance shape is "proposed" while it is what 0.2 ships, and the slice's own governance record does not carry the decision set its release rests on. No behaviour is at fault; the record of acceptance is missing for the whole eight.

Not a structural defect in the design and not a code defect: the status of eight knowledge records. The act is the reconcile stage's (sole writer of reconciled truth); this audit neither infers the operator's acceptance nor edits knowledge records."""
disposition = "design-wrong"
response = """
Accepted. The design is not at fault and neither is the code: eight decision records carry a status that says they are not settled while design.md §15 indexes them as settled, the plan builds to them and the tree implements them. That is a governance record defect, i.e. the reconcile write surface, not something this audit should fix by inference.

Reconcile entry: record DEC-012…DEC-019 as accepted, the status 0.1's decisions were created in (DEC-011 at bcd1389). The basis is already in the record and needs no new prose — each of the eight carries context, choice, alternatives, rationale, consequences, decided_by: operator and agent, and decided_on: 2026-11-01; the design locked at rev 62 with §15 presenting them; and the release ships under them. The verb is `doctrine knowledge status <ID> <STATE>` (checked against the CLI's help, not guessed); the act is the reconcile stage's, and the operator's assent to the eight as 0.2's settled decisions is what the brief should record, because the records say "operator and agent" and a status flip asserts that assent.

No behaviour, criterion, bound or test depends on the status, so this rides reconcile and gates nothing."""

