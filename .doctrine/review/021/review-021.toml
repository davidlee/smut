[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "The falsified 'mutually-referencing clusters' claim lives in four tiers, not the one the reconcile list names"
detail = """
Expected: the "gone to reconcile" list in the handover names design.md §2 as the only home of the claim that the acceptance store holds "mutually-referencing clusters", and says reconcile should fix it there.

Observed: the same falsified claim appears in three more places, one of them the scope:
1. design.md §2 — named in the handover.
2. design.md §13.1, the Fixture row — "a mutually-referencing cluster" among the properties the fixture proves.
3. slice-002.md objective 10 — "already containing the awkward cases (a superseded finding retired in place, settled and open findings, mutually-referencing clusters) and 22 entities with no incoming reference".
4. plan.toml PHASE-04 EX-3 — "a mutually-referencing cluster" as an exit criterion.

Evidence: reading tests/fixtures/interview/entities.json (66 entities) — the only mutually-referencing pair is finding-smut-17 ↔ prop-conventions-library (asserted by tests/fixture.rs::finding_smut_17_and_the_conventions_proposal_reference_each_other). The five `type: cluster` entities each carry exactly one outgoing `part-of` to `session` and no cluster names another cluster or session's peer, so no cluster is in a mutual reference with anything. Cluster incoming sets: cluster-friction 20 sources, cluster-mind 9, cluster-schema 10, cluster-setup 9, cluster-thesis 12 — none of them a cluster.

Consequence: a reconcile that follows the handover fixes design.md §2, §13.1 and leaves slice-002.md objective 10 asserting the falsified property — the tier a reader consults for "what this slice promised". The plan criterion is off-surface (plan.toml criteria are immutable-append), and its clause was discharged by the neighbouring pair, which the PHASE-04 sheet records without saying so. Recorded here so reconcile does not half-fix it."""
disposition = "design-wrong"
response = """
Accepted, and the finding widens the reconcile item rather than disputing it. The operator's G0 ruling ("drift: deal with it at reconcile") named design.md §2; the same falsified property sits in design.md §13.1's Fixture row and in slice-002.md objective 10, and the plan's PHASE-04 EX-3 asks for "a mutually-referencing cluster" too.

Reconcile entries (per-slice, direct edit):
- design.md §2 — replace "mutually-referencing clusters" with the property the array actually holds: one mutually-referencing pair (finding-smut-17 ↔ prop-conventions-library) plus five clusters that are one-directional (each cluster → session).
- design.md §13.1 Fixture row — the same replacement, in the list of properties the fixture suite proves.
- slice-002.md objective 10 — the same replacement inside "the awkward cases" clause, keeping "and 22 entities with no incoming reference", which is true (verified: 66 entities, 22 with no incoming reference).

plan.toml PHASE-04 EX-3 is off-surface (criteria are immutable-append) and needs no edit: its obligation — that the acceptance store exercise mutual referencing — is met by the pair, which is the only mutual reference the array holds; the PHASE-04 sheet records the clause as proved by that pair. Naming it here so reconcile does not read the criterion as a live obligation.

The five clusters' incoming sets are 20/9/10/9/12 and none is a cluster, which is the measurement behind the claim."""

