status = "verified"
severity = "minor"
title = "The run record's release-surface and restoration claims are contradicted by the remote and by the rewritten commit"
detail = """
Expected: handover.md states "**Nothing pushed, tagged or published.** `0.2.0` exists only in this tree", and notes.md's PHASE-06 decisions row states the reviewer's commit was restored "byte-identical to its original (`991a831`)".

