1. `git ls-remote origin refs/heads/main` = dfc2887a47d153726b5ddefd9a2018e5b34b08ae ("review(sl-002): RV-019 code review of PHASE-04/05 — two minors, five nits, nothing blocking"). Its parent is 46c6699 — PHASE-06's `code_end_oid` — so the public branch carries the whole slice through PHASE-06 plus that review commit. `git show dfc2887:Cargo.toml` is version = "0.1.1", and `git ls-remote --tags origin` returns nothing, so "not tagged, not published" holds and "0.2.0 exists only in this tree" holds — but "nothing pushed" does not.
2. dfc2887 and 991a831 share parent 46c6699 and subject but are not byte-identical: `git diff dfc2887 991a831` is src/learn.rs only, 2 insertions / 4 deletions, a doc comment above the_guide_teaches_the_0_2_keys_and_the_release_notice_is_gone. The local wording named a test that never existed ("the_release_notice_is_gone"); 6885f66 fixed it and HEAD's comment is now accurate with both `!guide().contains(…)` pins present.

Consequence, operational: local main forked from the public tip, so landing is not a fast-forward — it needs a force-push (or a merge that resurrects the superseded comment). Content loss is nil: no file is deleted between dfc2887 and HEAD, .doctrine/review/019 locally is the same ledger 7 findings further along (+104/−7, the 7 removed lines are `status = "open"` fields the verbs have since moved), and the remote's only unique content is the superseded comment. The operator has ruled: wait, and force-push the finished slice at close.

