[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "The store-format document ships 0.1-scoped prose as the 0.2 release's durability authority, and the design fence forbids touching it"
detail = '''
Expected: a document the README links as the authority for what 0.2 promises about its store describes the release it ships in, or states plainly that its claims are unchanged from 0.1.

Observed: docs/store-format.md — untouched by this slice, correctly, because §14.2 fences it and the on-disk format is unchanged — still opens "It is written against the 0.1 build" and says "**There is no migration path in 0.1, and no repair path at any point**" and "there is no request-id or exactly-once retry in 0.1". A 0.2 reader cannot tell from those sentences whether 0.2 has a migration path or a request-id, and the README's "What smut promises" section hands them this document as the source.

Evidence: README.md's promise section links docs/store-format.md; the file's only version words are the three 0.1-scoped ones above (`grep -n "0\.1" docs/store-format.md` → lines 4, 9, 301). `git diff b47dd79..HEAD -- docs/store-format.md` is empty, so the slice neither changed nor stale-dated it.

Not repaired here, and not a reconcile edit: the fix is a second scope change inside a §14.2-fenced file, which the audit cannot grant and the operator did not authorise. Every statement remains true of format_version 1, so the exposure is reader confusion, not a false promise. Named as an escalation the operator may take (a one-line scope change) and otherwise owned by IMP-002's documentation pass. PHASE-07 recorded this handoff explicitly ("it remains true of `format_version` 1 and is left for the audit to weigh").'''
disposition = "tolerated"
response = """
Tolerated, with the boundary stated rather than blurred.

The statements are true: `format_version` is 1, the format did not change in 0.2, and there is no migration path or request-id retry in either release. What is stale is the scope of the wording, not the promise, and the fix would be a second scope change inside a §14.2-fenced file — a change this audit may not grant and the operator did not authorise. Editing it would break the fence that proves the slice did not touch the on-disk format, which is a more valuable property than the phrase.

What would make this a defect rather than a tolerate: if 0.2 had changed the format, added a migration path, or if the document's guarantee had been narrowed by this release. None holds — `git diff b47dd79..HEAD -- docs/store-format.md` is empty and §14.2's unchanged set is proven by the same diff.

Carried as an operator escalation in the brief (one-line scope change, "unchanged since 0.1" wording) and otherwise owned by IMP-002's documentation pass. No reconcile edit, no backlog mint: the owner already exists."""

