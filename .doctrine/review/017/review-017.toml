[[finding]]
id = "F-4"
status = "answered"
severity = "minor"
title = "A test comment cites a defect record that existed in no artefact at that commit"
detail = """`tests/selection.rs:278-281`, verbatim: "...the earlier position of `traversal_budget` is asserted where that reason is introduced, PHASE-02's reason-order test in `tests/traversal.rs`; this is recorded plan defect DEF-1, and this comment is the re-cut's reason." At `45983c7`, `DEF-1` appeared nowhere except that comment and the diff — not in `plan.toml`, `plan.md`, `notes.md`, `design.md`, nor any ledger under `.doctrine/review/`. The underlying gap is real and should be recorded, not merely referenced: `VT-9` requires the reason order when both reasons occur, which is unsatisfiable at PHASE-01 because `traversal_budget` cannot occur while `budget` is a refused key. Status since raising: the seat recorded DEF-1 in `notes.md` `## Harvest`/`### Open` at `7a0c717` (after this review's snapshot), so the citation is now true; the remaining repair is to name PHASE-02's test inline so the comment is self-contained rather than pointing at an id."""
disposition = "fix-now"
response = "Conceded, and partly overtaken by the seat's C1-close commit: `DEF-1` is now recorded in `.doctrine/slice/002/notes.md` (`## Harvest` / `### Open`) at `7a0c717`, one commit after the reviewed tree, so the citation is true in the repository even though it was dangling at `45983c7`. The comment was also stale in a second way the review did not have to see — it claimed `budget` was still a refused key, which PHASE-02 made false the next day. It now names PHASE-02's `both_reasons_appear_once_in_the_order_they_can_occur` inline and carries its DEC-019 reason. Fixed in `b499a60`."

