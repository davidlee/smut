[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "`smut learn` prints statements the binary now contradicts, and no criterion re-cuts them"
detail = """`src/learn.rs:88-89` and `:110-111`. Verbatim: "where, follow, backlinks, depth and budget arrive in 0.2, and are refused here / by name with that release." and "Reporting dangling references belongs to / traversal, which arrives in 0.2." Against the tree: `follow`, `backlinks` and `depth` are accepted (`src/spec.rs:125-127`) and dangling references are reported (`src/select.rs:293`), so the shipped guide's own answer is false for three of the five keys it names. This is a plan gap, not only a code defect: EX-11's rationale ("accepting `follow` falsifies it in this commit") applies to this prose verbatim, yet §14.1 assigns `src/learn.rs` to PHASE-06 and PHASE-06 EX-4 presumes the notice still exists at its entrance. Raised route: tolerated with a named home (PHASE-06 EX-4). Responder route: fix-now — a released surface stays false for three charters otherwise, the edit is two clauses, and PHASE-06 rewrites the guide wholesale regardless."""
disposition = "tolerated"
response = "Conceded as a true defect and as a plan gap, then routed rather than fixed now: the plan has no criterion that re-cuts `src/learn.rs`'s prose in PHASE-01/02/03, and PHASE-06 EX-4 owns the guide's rewrite. My first position was fix-now on the grounds that it read as two clauses. Reading the guide falsified that: the stale text is the key list, the 0.2 notice, the envelope description and the dangling sentence — i.e. the guide section PHASE-06 rewrites wholesale with its own re-cut test and its own VT. A partial repair now would be rewritten in two phases and would leave a half-truthful guide in the meantime. Evidence, not preference, flipped the disposition. Residual, accepted: until PHASE-06 lands, `smut learn` overstates what is refused. Bounded and named: PHASE-06 EX-1/EX-4 and its VT-1 (which asserts the notice is absent). PHASE-06's charter carries an explicit instruction to prove no sentence in `learn` claims a working key is refused. Recorded in the slice notes as a plan gap, not an oversight."

