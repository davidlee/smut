[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "The walker test module still says it is expected to be RED and that the keys are refused"
detail = """`tests/traversal.rs:10-15` (also `:41-42`, `:442`). Expected: a committed test file's module doc describes the file as it is in this commit. Observed, verbatim: "This file is expected to be RED until the walker lands. 0.1's `spec::parse` refuses `follow`, `backlinks` and `depth` by name, so every walk test stops at that refusal ... Once parsing accepts the keys, the same tests fail on the envelope's missing `traversal` member until the walker exists." Plus `walked`'s doc "or the red this file expects: first the parse refusal, then a missing member" (`:41-42`) and `traversal_member`'s "or the red this file expects" (`:442`). Against the tree: `src/spec.rs:125-127` accepts all three keys and all 20 tests in the file drive a green walk, so none of that narration is true. This is the file VT-2 certifies against and the paragraph asserts the inverse of what it proves; left in the committed file it invites a later worker to "restore" a refusal the design has retired — the DEC-019 failure mode in the opposite direction. Route: fix-now — replace `:10-15` with one sentence stating the file is green against the walker and naming the six determinism rules it pins; drop the two "the red this file expects" clauses."""
disposition = "fix-now"
response = 'Conceded. `tests/traversal.rs` is now green against the walker: the module doc states that `follow`, `backlinks` and `depth` are accepted and the `traversal` member is present, and the two "the red this file expects" clauses on `walked` and `traversal_member` are gone. Fixed in `b499a60`. The drafting artefact was the red-first pass: the file was authored red and its narration was never re-cut when the walker landed — which is DEC-019 applied to prose, and exactly the failure mode this review exists to catch.'

