[[finding]]
id = "F-7"
status = "answered"
severity = "nit"
title = "The third field's vocabulary is not disjoint from its content"
detail = """
`listing` interpolates `set.summary` verbatim (`src/conventions.rs:696`), so a file declaring `summary: shadowed` (or `-`, or `did not load: x`) renders a row shaped exactly like the demoted or failed states, and a summary or path containing two spaces yields a five-field row — which breaks the suite's own `split("  ")` reading (`row_naming`, `tests/conventions.rs:1515`, and the `row.len() == 4` assertions).

Not an EX-2 violation: the criterion says the field *is* the summary, and no escaping is specified anywhere. The "no two states can claim one row" guarantee holds for the renderer's choice, not for the bytes."""
disposition = "follow-up"
response = "Recorded as a design question, not a defect. The renderer cannot fix this without inventing an escaping rule that no design sentence authorises, and inventing one here would be exactly the kind of silent spec-growth the reconcile pass exists to surface. Goes to reconcile with the other obligations: either the third field's vocabulary is declared disjoint from author-supplied summaries and the two-space rule becomes total, or the listing gains a delimiter its helpers can trust."

