[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Code-impact table gives the walker an Edge type the design abolished"
detail = """
design.md §14.1 lists the walker module as carrying `Fields`, `Walk`, `Edge`, `Dangling`. §4 says the opposite in two places: the module map lists `Walk`, `Dangling`, `Fields`, and the prose under the struct listing states plainly that the walk does not carry the edge set, because edges are derived from the returned entities after the limit. DEC-014 records the same consequence. The `Edge` in §14.1 is left over from before that correction and is the only place a walker-owned edge list survives, so it is exactly the kind of residue a planner would implement from.
"""
disposition = "fix-now"
route = "dedupe"
response = """
Accepted. The duplicate that goes is the Edge token in the §14.1 code-impact row for the walker. The surviving owner is §4: the module map row lists Fields, Walk and Dangling, and the prose beside the struct listing states that the walk does not carry the edge set because edges are derived from the returned entities after the limit. DEC-014 records the same consequence, so the owner is corroborated outside the section being repaired.

Class swept: every place that enumerates what the walker owns - the §4 module map, the §4 struct listing and prose, the §13.1 walker test row, and the §14.1 row. The sweep test is a positive one: search the design for the walker's type names and require that Edge appears only where the induced derivation is described, never as a walker-owned value.
"""

