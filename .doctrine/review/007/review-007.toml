[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Fixture test pins exact entity counts that the privacy gate may change"
detail = """
design.md §13.1 pins the fixture test to the first-use store as measured today: 66 entities, 44 distinct targets, 22 with nothing pointing at them. §11 and §12 gate the fixture on a fresh-agent privacy read-through that may remove content before the fixture is committed (DEC-018), and the design explicitly does not assume what that read finds. If the read removes anything, or normalisation drops a private field, those three numbers in the test map become a red test that the gate itself produced, and the plan has no stated way to settle it.

The assertion should be about the committed fixture, not about the pre-redaction measurement: either the counts are re-derived at commit from the fixture and provenance note and recorded then, or the test asserts the properties the acceptance case actually needs - at least one entity with no incoming reference, a superseded record, a retracted finding, mutually-referencing clusters - with counts asserted as whatever the committed array holds.
"""
disposition = "fix-now"
route = "review"
response = """
Accepted. The commitment to accept and its consequence is the question: whether the fixture test may pin three numbers measured before the privacy read-through, when the read-through is allowed to remove content. It may not, because then the gate that protects the operator is the same gate that reddens the suite.

Resolution, in prose in this review: §13.1 asserts the properties the acceptance case needs - the committed array is non-empty, it contains at least one entity with no incoming reference, a superseded record, a retracted finding, and a mutually-referencing cluster - and it pins the counts of whatever the committed array holds, measured at the phase that commits it and recorded in that phase sheet, with the pre-redaction figures in §2 kept as evidence of the source store rather than as an assertion. §11 says the same thing in its own words: the redaction gate may change the fixture, and the assertion follows the fixture.

Swept: the §2 measurements keep their role as source evidence, the §13.1 row, and the acceptance scenario 2 steps of §13.3, which must not depend on a count either.
"""

