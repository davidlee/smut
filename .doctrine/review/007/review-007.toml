[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Presence of the traversal member: §10.3 suppresses it for from: [], §8.1 and invariant 5 say it appears exactly when follow or backlinks is supplied"
detail = "design.md §8.1 and invariant 5 (and DEC-012) state one presence condition: the traversal member appears exactly when the request supplied follow or backlinks, including an empty array, and nothing else. The §10.3 edge-case row for an empty from says the opposite - selects nothing, no traversal member even if follow is supplied - which invents a second condition (supplied and at least one root). The condition is load-bearing: it is what keeps every 0.1 response byte-identical under the full-envelope compatibility pin, and it is the thing the envelope tests assert. Two live accounts of one fact, one of which no test table row covers."
disposition = "fix-now"
route = "dedupe"
response = """
Accepted. The duplicate account that goes is the suppression clause in the §10.3 edge-case row for an empty from array. The surviving owner is the single condition in §8.1 and invariant 5: the traversal member appears exactly when follow or backlinks was supplied, including an empty array and including a root set that selects nothing. That owner is the one DEC-012 states and the one the 0.1 compatibility pin depends on, because it keys presence on the request rather than on the store or the root list.

Class swept: every statement of the presence condition - §8.1, invariant 5, the §10.3 row, the envelope row of the test map, and DEC-012. The sweep criterion: grep the design and slice scope for turn "traversal" plus "supplied" and require one condition and no exception. The §10.3 row will read that the member is present with empty depths, edges and frontier, which is also what makes the from: [] case assertable rather than merely describable.
"""

