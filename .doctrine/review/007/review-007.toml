[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Edge order drifts: scope says discovery order, design and DEC-014 say result order, DEC-012 says encounter order"
detail = """
Edge order is stated two ways across the governing records. slice-002.md objective 5 and the settled-decisions table in the same file both say edges are deduped in "discovery order, DEC-014". design.md §7.2 and §8.2 say result order: scan each returned id in result order, keep first occurrence. DEC-014 says result order and was amended for it. DEC-012 still says discovery order in its facet and "in the order the walk encountered them" in its body, so it lags the same amendment.

The two orders coincide only when the request supplies no ordered key. With an ordered key they diverge, so the scope currently asserts a claim the design contradicts, and the DEC-012 body asserts a third. This is also the runbook review.scope item: the scope must assert nothing these decisions contradict and omit nothing they add.
"""
disposition = "fix-now"
route = "refresh"
response = """
Accepted. The design and DEC-014 are right and the scope and DEC-012 lag. Edges are derived from the returned entities after the ordering and the limit, so the order that survives is result order; discovery order would describe the walk rather than the result, and the whole point of the amendment was that the digestible edge set belongs to the result.

Records edited: slice-002.md objective 5 and its settled-decisions table, and DEC-012 both in its choice facet and in the body bullet that says the walk encounter order. Records swept for the same claim: design §7.2, §8.2 and the §15 decision row (already result order), the slice notes, and the research artefact if it restates edge order. The verb is knowledge edit for DEC-012 and a direct edit for the scope, since the scope is a slice artefact.
"""

