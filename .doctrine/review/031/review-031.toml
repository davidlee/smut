severity = "major"
title = "--has and --missing on one field overwrote each other silently"
detail = "Both flags write the same (field, $exists) slot of the where map, so the later flag won and a contradictory question got a plausible answer. The silent last-wins class is what this slice exists to remove. Fixed by extending the one-condition-per-operator rule to $exists, with a sentence that is true of this case: $exists is given both true and false."
disposition = "fix-now"
route = "control"
response = "Section 2 extends the one-condition rule to $exists and states the refusal; section 3's table carries the sentence."

