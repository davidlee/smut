id    = 31
slug  = "design-review-of-sl-010"
title = "design review of SL-010"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Two adversarial pi passes over design revision 26 — one on the surface and the compiler, one on the refusals, the verb, the guide, the code impact and the verification — then a disposer that adjudicated every finding on evidence, an author that applied eleven revisions, and a verify-only pass over the revised text that confirmed each and named seven sentences the revisions had made false."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-010"

[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "The JSON-operand refusal had no detecting branch"
detail = "The classifier in the surface section tested only for =, != and ~, so a token carrying a JSON specification became a root id: it compiled to from[], the store answered exit 0 with objects empty and the token echoed in missing, and the refusal promised by the refusals section and asserted by a named verification case was unreachable. Fixed by a first-character rule: a token beginning { takes the refusal, with --from=ID as the escape and the diagram stating the precedence."
disposition = "fix-now"
route = "control"
response = "Design sections 1 and 2 now carry the first-character rule, the diagram edge and the relabelled table row; section 7 asserts the refusal and the escape."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "control"
response = "Design sections 1 and 2 now carry the first-character rule, the diagram edge and the relabelled table row; section 7 asserts the refusal and the escape."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Verified: the rule, the diagram precedence and the row label are consistent, and --from=ID reaches parse_roots unchanged."

[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Satisfiable repeats were refused in a voice that called them unsatisfiable"
detail = "The compiler section extended the two-= contradiction to a second != and a second ~, calling their JSON spellings equally impossible. Both are satisfiable (a value that is neither, a title containing both) and both are spellable in JSON with $and arrays of predicate objects, which predicate::parse accepts. Rendered through ContradictoryFieldConditions the sentence would read 'field status cannot be satisfied' about a predicate some entity satisfies, outside DEC-027's decidability premise and DEC-039's scope. Fixed by the emit-shape rule: one condition per operator, exact repeats collapse, and a repeat the front-end cannot emit is refused in the caller's tokens."
disposition = "fix-now"
route = "control"
response = "Design section 2 now states one condition per operator per field, the exact-repeat collapse, and the emit-shape reason a second != or ~ is refused in the caller's tokens rather than as a contradiction."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
