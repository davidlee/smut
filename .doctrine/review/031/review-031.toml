role = "responder"
disposition = "fix-now"
route = "control"
response = "Design section 2 now states one condition per operator per field, the exact-repeat collapse, and the emit-shape reason a second != or ~ is refused in the caller's tokens rather than as a contradiction."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Verified: the sentence is gone, the rule is stated as the emit shape allows, and no satisfiable predicate is described as unsatisfiable."

[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "status=open status!=resolved was described as refused and is answered"
detail = "Two sections claimed the pair reaches predicate::parse's pinned contradiction sentence, and a verification row asserted exit 2. predicate::contradiction step 3 pins the field to the $eq value and evaluates the rest, so $ne resolved holds against open and the walk returns None: the command exits 0 with the entities. Fixed by correcting both claims, keeping status=open status!=open as the refused pair, and adding the exit-0 row; DEC-039's illustration joins the obligations owed at reconcile."
disposition = "fix-now"
route = "control"
response = "Both claims corrected in sections 2 and 7; status=open status!=open is the refused pair, status=open status!=resolved has its exit-0 row, and DEC-039's illustration is banked as a sixth reconcile obligation."

