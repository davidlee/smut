id    = 19
slug  = "code-review-of-sl-002-phase-04-phase-05-the-fixtures-properties-and-the-conventions-seed"
title = "code review of SL-002 PHASE-04 + PHASE-05 — the fixture's properties and the conventions seed"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "code-review"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "reviewer"
responder = "implementer"
rounds_base = 0
contests_base = 0

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

[[finding]]
id = "F-1"
status = "open"
severity = "minor"
title = "The provenance note's round-trip claim is asserted only as a count"
detail = """`tests/fixtures/interview/PROVENANCE.md:94-96` against `tests/fixture.rs:271-296`. The note asserts that declared into an empty directory the array creates 66 entities and a full `query` reads back an array "structurally identical" to the file; the nearest test asserts only `ids_of(&envelope).len() == declared.entities.len()` plus `truncated: false`. A normalisation that dropped a field, coerced a value or reordered an array inside one entity would leave the test green while falsifying the note — a documentation claim with no falsifier, in the one artefact EX-2/EX-4 make the phase's evidence. Route: assert the objects array equals the committed entities (the query's default order is ascending id and the array is sorted by id, so the sides already line up), or soften the sentence to a manual check. Batched to the PHASE-06 boundary because that phase owns `tests/fixture.rs`."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-2"
status = "open"
severity = "minor"
title = "The fixture suite re-implements the reference walk it should share or cross-check"
detail = """`tests/fixture.rs:228-268` against `src/entity.rs:71`. `targets_of`/`collect_references` re-walks JSON depth-first, treats an object with a string `id` as a reference and declines to descend — a behavioural copy of `scan_refs`, whose comment concedes the mirror. `scan_refs` is `pub` and reachable as `smut::entity::scan_refs`. The fixture's "22 entities with no incoming reference" and its mutual-reference assertion are computed with the test's definition, so a divergence (e.g. a nested array-of-references case) silently makes the property a statement about a different relation than the walker's. Counter-argument that keeps this minor: an independent computation is evidence, not circularity, so the copy is defensible. Route: either consume `smut::entity::scan_refs`, or keep the independence and assert the two agree over the whole fixture — the second is stronger than either alone, and it is what this batch will do."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-3"
status = "open"
severity = "nit"
title = "`seed()`'s doc claims a field order the printer cannot produce"
detail = '`src/conventions.rs:115-117`: "ordered by `id`, `type`, `version`, `title`, `body`". The `fields` array is built in that order but inserted into a `serde_json::Map` (a `BTreeMap`, design §10.2) and printed through `entity::serialise`, whose entity-node rule hoists `id` and sorts the rest (`src/entity.rs:305-315`). Actual printed order: `id`, `body`, `title`, `type`, `version`. In this codebase comments are the audit trail, and the slice notes already record the lexical order as an illustrative deviation, so this comment is now the only place claiming otherwise. Route: say it prints `id` first and the remaining four keys lexically.'

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-4"
status = "open"
severity = "nit"
title = "`body_of`'s doc says one trailing newline; the code strips all of them"
detail = '''`src/conventions.rs:162-165`: `trim_end_matches('\n')` removes every trailing newline while the doc (and the module doc at `:15-17`) say one. Harmless today because `hygiene.md` ends with exactly one, but a blank line added later would silently shorten `body` and leave the trailing-newline story wrong in two places. Route: `strip_suffix('\n')`, or say "any trailing newlines".'''

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-5"
status = "open"
severity = "nit"
title = "The fixed id is a literal in the shipped prose with nothing tying it to `id_of`"
detail = """`src/conventions/hygiene.md:31` against `src/conventions.rs:180-182`. EX-2's "so no second copy can drift" is applied to title and body but not the id: `id_of` derives `conventions-<name>`, the prose hard-codes `conventions-hygiene`, and `tests/conventions.rs:274-291` pins the seed id as a literal without comparing it to the prose. Renaming `HYGIENE.name` would leave the printed set telling the reader to look for an id the seed no longer emits, with everything green. Route: one assertion in the existing prose test that the printed set contains the seed's emitted id."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-6"
status = "open"
severity = "nit"
title = "The set's pointer to `smut learn` names a recipe the guide does not carry on this tree"
detail = """`src/conventions/hygiene.md:41` against `src/learn.rs:88`: the set says the two-call recipe and its guard live in `smut learn`, while `learn` still says traversal "arrive[s] in 0.2, and are refused here" and contains neither. PHASE-06 owns them (`plan.toml`), and the test certifying EX-5 asserts only that the string `smut learn` appears. So the pointer is true at release *provided PHASE-06 lands*; if that phase were dropped or re-scoped, the shipped set would be false and nothing would go red. Route: no edit; record the cross-phase obligation so the audit can check it, and let PHASE-06's handback be the evidence."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-7"
status = "open"
severity = "nit"
title = """EX-3's "mutually-referencing cluster" is pinned as a mutual pair, and the noun drifted unrecorded"""
detail = """`tests/fixture.rs:349`, `plan.toml:136`, `design.md` §2. No two `type: cluster` entities reference each other — every cluster's only reference is `part-of` to `session` — so the suite pins `finding-smut-17` <-> `prop-conventions-library` (verified both directions in the committed array) and the phase sheet calls it "a mutually referencing pair". Design §2 additionally describes the source store as holding "mutually-referencing clusters", which the committed array does not. An auditor comparing EX-3's wording to the test will find a noun that changed without a recorded reason. Route: one clause in `PROVENANCE.md`'s counts section recording what actually holds; the design sentence is locked and belongs to the deferred drift item at reconcile."""

[[finding.turn]]
act = "raise"
role = "raiser"

