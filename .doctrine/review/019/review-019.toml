title = "The fixed id is a literal in the shipped prose with nothing tying it to `id_of`"
detail = """`src/conventions/hygiene.md:31` against `src/conventions.rs:180-182`. EX-2's "so no second copy can drift" is applied to title and body but not the id: `id_of` derives `conventions-<name>`, the prose hard-codes `conventions-hygiene`, and `tests/conventions.rs:274-291` pins the seed id as a literal without comparing it to the prose. Renaming `HYGIENE.name` would leave the printed set telling the reader to look for an id the seed no longer emits, with everything green. Route: one assertion in the existing prose test that the printed set contains the seed's emitted id."""
disposition = "fix-now"
response = "Conceded. The prose test now reads the seed's emitted id and asserts the printed set contains it, so a renamed set whose prose still named the old id goes red. Fixed in `850488c`."

