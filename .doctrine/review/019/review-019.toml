[[finding]]
id = "F-4"
status = "answered"
severity = "nit"
title = "`body_of`'s doc says one trailing newline; the code strips all of them"
detail = '''`src/conventions.rs:162-165`: `trim_end_matches('\n')` removes every trailing newline while the doc (and the module doc at `:15-17`) say one. Harmless today because `hygiene.md` ends with exactly one, but a blank line added later would silently shorten `body` and leave the trailing-newline story wrong in two places. Route: `strip_suffix('\n')`, or say "any trailing newlines".'''
disposition = "fix-now"
response = """Conceded. The doc says "any trailing newline" rather than "the one", which is what `trim_end_matches`' behaviour actually is. Chose the wording over `strip_suffix` because stripping every trailing newline is the intended behaviour for a body that feeds a declaration, not an accident to narrow. Fixed in `850488c`."""

