[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "The fixture suite re-implements the reference walk it should share or cross-check"
detail = """`tests/fixture.rs:228-268` against `src/entity.rs:71`. `targets_of`/`collect_references` re-walks JSON depth-first, treats an object with a string `id` as a reference and declines to descend — a behavioural copy of `scan_refs`, whose comment concedes the mirror. `scan_refs` is `pub` and reachable as `smut::entity::scan_refs`. The fixture's "22 entities with no incoming reference" and its mutual-reference assertion are computed with the test's definition, so a divergence (e.g. a nested array-of-references case) silently makes the property a statement about a different relation than the walker's. Counter-argument that keeps this minor: an independent computation is evidence, not circularity, so the copy is defensible. Route: either consume `smut::entity::scan_refs`, or keep the independence and assert the two agree over the whole fixture — the second is stronger than either alone, and it is what this batch will do."""
disposition = "fix-now"
response = "Conceded, and resolved the way the reviewer framed the tension rather than by picking a side: the fixture keeps its independent walk (independence is evidence, and the reviewer said so), and now asserts it agrees with `smut::entity::scan_refs` over every one of the 66 entities. Two accounts forced to agree is stronger than either alone, and the comment records why the second definition is worth its cost. Fixed in `850488c`; the assertion passes, which is itself evidence the two definitions had not yet diverged."

