[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Plan C6 understates the hyphen-led-word behaviour on both verbs, and no decision record owns the silent misparse it accepts"
detail = """
Expected: C6, the correction design.md owes for hyphen-led words, describes every shape a reader can hit, and an accepted silent misparse has a decision record (DEC-037's rationale names silence as the danger this corner must avoid).

Observed (built binary):
1. C6 says "a hyphen-led word starting with a display letter is silently a flag: `-title` is `-t itle`". The silent set is wider: any word clap reads as a cluster of `-s`/`-i` ending optionally in `-t<value>`, e.g. `smut r -site` = `-s -i -t e`, exit 0. Words led by `-f`/`-l` are refused loudly (unknown format / invalid level), so the silent letters are exactly `-s`, `-i`, `-t`.
2. C6 says on `q` "-j… words are read as -j's value, refused loudly unless valid JSON". The refusal is `smut: malformed JSON: expected value at line 1 column 1` (same on `r`): it names neither the word the caller typed, nor `-j`, nor `--` — not DEC-030's voice. Before this slice `q -jane` was clap's error with the `-- -j` tip (DEC-037's "-weird-id stays the error that teaches --", src/cli.rs:243-244 comment).

Neither is a code defect to fix here: PHASE-01/EX-5 requires a bad `-j` value to get `query`'s own message for the same operand, and recognising the word would need argv inspection, which DEC-037 rejects; DEC-008/IMP-007 keep the display letters. The guide covers both (short form: "On r, a hyphen-led id always goes after --"; Opaque ids: "-- ... reaches that id and nothing else does").

Governance gap: C6 lives only in plan.md. DEC-037 records that the bare positional keeps `-weird-id` an error that teaches `--` (its alternatives table: `allow_hyphen_values` "makes -weird-id legal, deleting the guard -- exists for"); that guard is now narrowed on `q` (`-j…`) and on `r` (`-j…`, and silently `-s`/`-i`/`-t…`). DEC-043 (the flatten that put the display letters beside the positional) lists its consequences without this one. Design § Reconcile obligations does not name either record.
"""
disposition = "design-wrong"
response = """
Confirmed on both counts. Behaviour is accepted as built — EX-5 binds a bad `-j` value to `query`'s message, DEC-037 rejects argv inspection, DEC-008/IMP-007 keep the letters — and the guide's two rules cover every shape. What is wrong is the record of it.

Reconcile pays:
1. design.md C6 (the § The command line / R2 amendment) states the whole behaviour: on `r`, a hyphen-led word that clap reads as a cluster of `-s`/`-i` optionally ending in `-t<value>` (`-title`, `-site`) is silently display flags, exit 0, and `-f…`/`-l…` words are refused as a format or level; on `q` and `r`, a `-j…` word is `-j`'s value and, unless it is JSON, is refused with the JSON reader's message (`malformed JSON: …`), which names neither the word nor `--`. The rescue on every verb is `--`.
2. DEC-037 amended (REV / knowledge edit): the bare positional's `-weird-id` guard is clap's, and holds only for words led by a letter the verb does not own — narrowed on `q` by `-j` and on `r` by `-j` and the display letters (SL-011, plan C6).
3. DEC-043 consequences gain the same clause (the flatten put the display letters beside the id positional; a silent `-t`/`-s`/`-i` read is the accepted cost, taught by the guide).
"""

