[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "README says a hyphen-led id without -- is a usage error; on r it is a silent different query, on q a JSON refusal"
detail = """
Expected: every sentence the README prints is true of the verbs it now teaches (PHASE-04/VA-1: "none it refuses is shown"; the RV-031 F-2 / RV-034 class — a sentence true of the case it was written for, generalised to cases where it is false).

Observed: README.md:476-478, "**`--` reaches an opaque id.** Ids are opaque, case-sensitive strings and may begin with a hyphen, so `smut get -- -weird-id` names that id. Without `--` it is a usage error."

On the built binary (store holding `-title`, `-jane`, `q-query`):
- `smut r -title` → exit 0, three entities rendered by identity: clap reads `-t itle`, the heading field `itle`, no tokens, so the line is `{}` (plan C6, pinned by `r_reaches_ids_the_short_form_cannot_carry_bare`).
- `smut r -site` → exit 0, every entity with fields shown: `-s -i -t e`.
- `smut q -jane` / `smut r -jane` → exit 2, `smut: malformed JSON: expected value at line 1 column 1` — `-j ane`; not a usage error and no `--` tip.
- `smut q -weird` → still clap's usage error with `tip: ... use '-- -w'` (the sentence's original case).

`r` is the first verb whose positional *is* an id, so the README now teaches a verb for which its own opaque-id sentence leads a reader to a silent wrong answer — the exact failure DEC-037's rationale calls the danger ("not failure but silence"). The guide is right (src/learn.rs:159-161 "On r, a hyphen-led id always goes after --"; Opaque ids "nothing else does"); the README is not.

The autonomy log's PHASE-04 line "README omits the `r` hyphen rule · EX-6 permits one step and does not list the rule; guide carries it · decided" rests on the omission being harmless. It is not an omission: the README states the opposite. EX-6 is satisfied as written; design § The guide and the README scoped the README edit to the commands table and operand paragraph and did not see this bullet.
"""
disposition = "design-wrong"
response = """
Confirmed, and the design owns the gap: design § The guide and the README scoped the README to the commands table and the operand paragraph, and nobody re-read README's opaque-id bullet against a verb whose positional is an id. The autonomy log's "omits the r hyphen rule" decision is withdrawn by this finding — the README does not omit the rule, it states its opposite.

Reconcile pays, in this order (one wording, authored once):
1. design § The guide and the README gains a README bullet: the opaque-id sentence ("Without `--` it is a usage error") is narrowed — `--` is how a hyphen-led id is reached on every verb; on `r` a word such as `-title` is read as display flags without an error, and on `q`/`r` a `-j…` word is read as `-j`'s value.
2. README.md:476-478 mirrors that sentence (the guide's src/learn.rs:159-161 wording is the model; do not invent a third voice).

Constraint on the replacement: true of `get`, `delete`, `q` and `r` alike; it may not say "usage error" of a case that exits 0 or answers with a JSON refusal. No test pins README:476-478 (README harness runs only console blocks), so no pin moves; `just check` must stay green.
"""

