act = "conclude"
role = "raiser"
note = "Second opinion over ADR-001, IDE-002, IMP-005, IMP-007, ISS-002 and ISS-003 for candidate v0.2 interface stability. Examined current canonical entity reads, entity extraction/hoisting and reserved sentinel semantics, declaration responses, CLI flag and id generation definitions, loader validation and store format/version contract. Fresh offline debug build passed; temporary-store CLI probes independently reproduced identity collisions, cyclic one-batch declaration, dangling delete behavior, malformed nested identity panic and DROP behavior. Recorded 1 major record-contract inconsistency and 2 minor findings (qualification of the ADR argument and reconfirmed IMP-005). Recommendations and verification limits are in the prose companion. No implementation/acceptance changes; findings remain for responder adjudication."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "ISS-002"

[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Linked records prescribe competing identity-envelope contracts and acceptance states"
detail = "Expected: one reviewable proposed identity contract before v0.2 is locked. Observed: doctrine show ADR-001 reports proposed and explicitly chooses changes[].smut_id; doctrine show ISS-002 calls ADR-001 accepted and recommends retaining changes[].id in its Decided section; ISS-003 also calls ADR-001 accepted. ADR-001 Status says envelope vocabulary is decided, while ISS-002 still calls it an implementation question. The current implementation emits changes[].id (src/declare.rs:107-110). A design consuming the linked items can preserve the wrong public key or treat the proposal as accepted. Verified by current entity reads, not runtime speculation. Repair before acceptance: reconcile both linked items to the ADR's actual proposed state and current intended envelope rule; do not record acceptance until the operator accepts the reviewed proposition. No acceptance or governing text was changed in this review."
disposition = "fix-now"
response = """
Agreed, and repaired. The disagreement was mine: ISS-002's addendum and ISS-003's addendum were written while ADR-001 still read 'accepted' and before the envelope rule was settled, and neither was updated when the ADR was set back to proposed.

Repairs, all on the records rather than in prose about them:
- ISS-002's 'Decided' section is now 'Direction recorded (ADR-001 proposed, not yet accepted)'. Its recommendation to retain changes[].id is explicitly withdrawn, with the reason the ADR gives: a field name also works in where/select, an envelope name does not, and using the wrong one fails silently. It defers to ADR-001 for the rule instead of restating a competing one.
- ISS-003's 'Direction' section no longer claims ADR-001 accepted, and no longer asserts that minting depends on the rename (see F-2). It records the operator's framing: settled separately, works under either spelling, two calls and one atomic graph write.
- ADR-001 stays proposed, with its Status section naming the operator's acceptance act as the outstanding step, per this finding's instruction not to record acceptance before it is given.
- SL-004 was also carrying the stale framing (minting in scope, IDE-002 'dispositioned'); its scope is revised: minting out to ISS-003, IMP-005 folded in, IDE-002 deferred rather than resolved. Its title claimed a deliverable its scope no longer contains, so the title now reads 'the format break, and a loader that refuses what it cannot trust'.

doctrine validate: corpus clean; doctrine doctor: 0 findings."""

