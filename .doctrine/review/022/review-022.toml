[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "IMP-005 remains reproducible: loader accepts malformed nested identity and traversal panics"
detail = "Expected: loaded entities satisfy scan_refs' documented precondition, or malformed stored identity is refused as storage corruption (exit 1). Observed: Store::load validates the root and root-id/index agreement only, then inserts the unchecked entity (src/store/mod.rs:223-238). scan_refs panics on a nested invalid identity (src/entity.rs:85-106). Fresh cargo build --locked --offline and scratch-store probe: declare x, hand-edit its indexed file to add bad:{id:null}; get x exits 0 returning the malformed value; query {from:x,follow:[payload]} exits 101 at src/entity.rs:93. The whole entity scan panics even though bad is not a selected follow field. This independently confirms existing IMP-005; it is not a new defect or a CLI-reachable corruption path. Recommended ownership: include the existing IMP-005 loader validation, corruption documentation and regression case in the identity-format change, using smut_id under the new format and allowing arbitrary ordinary id values. Priority is bounded by requiring unsupported manual store mutation; no durability failure was observed. The pre-existing slice's unchanged fence explains prior deferral but does not constrain a new format-change slice."
disposition = "fix-now"
route = "demonstrate"
response = """
Confirmed as instructed, and it is now SL-004's work rather than a deferral.

Two things I did on the record rather than in this response: IMP-005 gains an Ownership section naming SL-004 and the operator's direction ('Fix alongside the loader/format change. I reproduced the malformed nested identity panic.'), and SL-004's scope is revised to carry it — a loader that refuses malformed stored identity as corruption (exit 1, naming the entry) instead of leaving scan_refs' precondition to be assumed; selector coverage already includes src/store/** and src/entity.rs.

Your priority reading is adopted: the defect needs an unsupported manual store mutation, so it is bounded, but the format version is moving and every stored identity is being respelled, which makes this the one pass where the loader's precondition and the new spelling can be written together instead of one around the other. Under smut_id the rule becomes: a nested nonempty string smut_id is identity, anything else stored in that position is corruption, and a payload's ordinary id is not identity at all.

Verification is transcribed into the slice's closure intent, not just promised: a hand-edited store carrying a nested {"smut_id":null} must be refused at exit 1 rather than panicking on the next traversal, and the RV-022 F-3 probe is named as the agent check to re-run."""

