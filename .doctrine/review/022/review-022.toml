[[finding]]
id = "F-2"
status = "answered"
severity = "minor"
title = "ADR-001 overstates the removal of reservations and the dependency of minting on the rename"
detail = "Expected: the ADR distinguishes the benefit of namespacing identity from independent authoring choices. Observed: Why says 'With no reserved spelling in the value space' and 'nothing reserved at all', yet the Decision still reserves smut_id at every depth. This is a narrower, less collision-prone reservation, not arbitrary-JSON transparency. It also claims the rename makes minting possible/cheap, although any externally supplied nonempty ids can already author a cyclic graph in one declare batch (src/declare.rs:181-230; src/entity.rs:31-45,159-174). A fresh-build scratch probe declared two prechosen ids with reciprocal references in one batch, missing=[], then traversed both edges successfully. Minting substitutes generated strings for those prechosen strings and is independent of the key spelling. It gives mint+declare (two invocations, one mutation), not one-call graph authoring. Repair: describe one reserved identity namespace explicitly, justify it by collision reduction, and describe minting as an additive independent verb. Retain the operator's rejection of placeholders/markers and accepted race; this finding does not reopen them. IDE-002 should remain deferred rather than treated as resolved: generated ids reduce naming pressure but cannot retarget existing references or fix existing semantic ids."
disposition = "fix-now"
response = """
Agreed on both counts, and both were overclaims of mine; the rationale is rewritten.

1. The reservation moves, it does not disappear. The first draft said 'with no reserved spelling in the value space' and 'nothing reserved at all' while the Decision reserves smut_id at every depth. Corrected: the Why now argues that a namespaced reservation is proportionate where a bare one is not — the store must reserve something for identity to be recognisable, and smut_id keeps the reservation while making it collide only with a key nobody's payload carries. Your framing is the one recorded: the current collision can silently turn an imported payload into graph structure; namespacing identity is a proportionate fix.

2. Minting is independent of the rename. The draft claimed the rename makes minting possible and cheap. Prechosen ids already author a cyclic graph in one declare batch — your probe reproduces what I had measured earlier and then failed to carry into the ADR. The ADR now says minting supplies generated strings for ids the caller would otherwise prechoose: mint then declare, two invocations, one mutation, working under either spelling. It is an additive independent verb, recorded as ISS-003's separate contract.

Also added, from your qualification: an explicit section 'The boundaries this leaves' — smut_id structural at every depth; the DROP sentinel meaning the literal string "DROP" cannot be stored as a top-level field value; null as an ordinary value distinct from absence; `$` reserved one level up in predicates. So the ADR no longer implies arbitrary-JSON transparency; it claims exactly what improves (the collision) and states what does not (a reserved key exists, and three other limits remain).

IDE-002: the ADR no longer treats it as resolved, and its own record now says 'stays deferred', with the withdrawn 'drains the motivation' note replaced by your distinction — generated ids reduce naming pressure, they do not repair existing identities, and a reference-preserving rename remains an additive option.

The operator's rejection of placeholders/markers and the accepted minting race are untouched."""

