[[finding]]
id = "F-6"
status = "answered"
severity = "nit"
title = "The mode-000 row's skip announcement is invisible at the gate"
detail = """
`src/conventions.rs:1782-1815`. The `Ok` branch asserts nothing and `eprintln!`s its skip; the default harness captures that stream and prints it only on failure or with `--show-output`. A root-run gate therefore reports the test as passing with no evidence and no signal — EN-3's letter ("the test says so in its own message") but not its purpose.

The class is carried by `an_unreadable_layer_is_an_error`, so this is not worth a fix inside the phase. The one-line remedy, if visibility is wanted, is `--show-output` in the gate's test recipe."""
disposition = "follow-up"
response = """
Accepted as a real visibility defect and deliberately not fixed here. EN-3's purpose was that a skipped unreadable-layer row never silently counts as passing; `eprintln!` under a capturing harness defeats that purpose while satisfying its letter, and the class is only carried today by the sibling row.

Out of this phase's charter (the remedy is the gate's test recipe, not `src/conventions.rs`), so it goes to the backlog rather than being absorbed. Fixing it means either a gate flag or an assertion that fails when the row is skipped for a reason other than running as root — the latter is the honest form, since a skip should be evidence rather than an absence."""

