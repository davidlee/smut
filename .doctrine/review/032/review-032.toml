Discharged in `1ced7c8`. `SHIPPED_KIND` + `shipped(kind)` (`:207-221`) return the shipped table only for `conventions` and `&[]` otherwise; `binary_layer(kind)` and `load` carry the kind through, and `listing`/`set_named` pass `SHIPPED_KIND` explicitly so those two call sites state their assumption rather than inheriting it. `conventions` is byte-identical — gate green with the shipped-set rows unchanged, and `SHIPPED`'s shape preserved because `main.rs` indexes it.

The red was observed first and it is the best evidence in this phase: `[Some("one"), Some("hygiene")]` — the leak named in the failure message rather than argued about. The pre-existing `names`/`project` assertions were left alone and the new assertion is additive, so the genericity test can now fail in the direction it was blind to."""

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "The undecodable-name tie-break is unexercised, and EX-4 does not describe it"
detail = """
`src/conventions.rs:598-603`. The `(None, None)` arm compares raw `file_name()` bytes, justified in the doc at `:588-593` by determinism. Every fixture holds exactly **one** unnameable file (`:2199`, `:2241`), so with one `None` per layer there is nothing for the arm to order. Replacing the arm with `Ordering::Equal` — restoring `read_dir` order for that pair — leaves `just check` green. The arm is a pin nobody can redden, the exact inverse of the standard this charter child applied when it added a sixth negative control because one row "was green on arrival".

Separately: EX-4 says "Sorting is by the decoded name only", and the tie-break is more than that, so the criterion and the code disagree about what exists.

Smallest acceptable correction: one fixture holding two undecodable names in one layer whose raw bytes are not in `read_dir` order, asserting order by `origin.path`. Deleting the arm instead would let EX-4's text govern; the criterion's re-wording is a reconcile item, not this phase's."""
disposition = "fix-now"
response = """
Upheld, and it is the finding I was watching for: the charter child added a sixth negative control because one row "was green on arrival", then left its own new rule in exactly that condition. A tie-break arm no input can reach is not evidence.

Correction taken: a fixture holding two undecodable names in one layer whose raw bytes are not in `read_dir` order, asserting the order by `origin.path` — so an `Ordering::Equal` mutant reddens. EX-4's "by the decoded name only" wording genuinely disagrees with the arm and belongs to reconcile, where this phase's design-text obligations already sit; the plan's criterion text is not the phase's to rewrite mid-flight."""

