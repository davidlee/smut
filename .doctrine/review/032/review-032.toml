[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "load(roots, kind) appends the shipped conventions sets to every kind"
detail = """
`src/conventions.rs:349-374` + `:411-413`. `binary_layer()` takes no `kind`; `SHIPPED: [(&str, &str); 1]` is `("hygiene", …)`; `load` appends it unconditionally. So `load(&roots, "shapes")` returns a `Layer::Binary` entry named `hygiene` out of a directory that never held it, and `set_in_force(&shapes_entries, "hygiene")` resolves a conventions set for a shapes lookup.

This contradicts `load`'s own doc at `:399-400` ("Nothing in it is specific to the `conventions` kind: the kind is a parameter, so the same loader reads every kind from every layer"), **EX-1's third clause**, and the discharge of RV-029 F-14. The genericity test cannot see it: `a_second_kind_uses_the_same_loader` (`:1868`) computes `names` over all entries at `:1878-1882` then filters to `Layer::Project` at `:1887-1890`, so it asserts only what the file layer contributed — the leak is untestable by it in either direction.

Latent today only because EX-8 forbids a caller this phase, which is why it is not a blocker. It is an exit criterion not met as written.

Raised from independent review run `37a0a516` over `9829de0..cfae50f` + `9281f64`."""
disposition = "fix-now"
response = """
Upheld, and it is the one finding here that changes behaviour rather than prose. EX-1's third clause says the kind is a parameter so nothing in the function is specific to `conventions`; the binary layer makes that false, and it makes `set_in_force` able to resolve a conventions set inside any other kind's lookup. Latent only because EX-8 forbids a caller this phase — which is exactly the sort of thing that stops being latent in PHASE-04.

Correction taken: make the binary layer kind-aware, so a kind nothing ships contributes no `Layer::Binary` entries, and close the hole in the genericity test with an assertion that a second-kind load carries **no** binary entry. The doc sentence at `:399-400` is then true as written rather than needing narrowing."""

