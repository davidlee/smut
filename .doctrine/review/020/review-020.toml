status = "answered"
severity = "nit"
title = "Three further pins are satisfiable by a sentence other than the one they are named for"
detail = """`src/learn.rs:344`, `:418`, `:450`. `"100"` is satisfied by the preamble at `:97`, so the `limit` default is unpinned; `the_guide_points_at_smut_conventions_once` asserts presence while `"smut conventions"` occurs three times; `"nine"` is satisfied by `:96`/`:203` rather than the client-side paragraph the test is about. Same failure mode as F-1 at lower stakes: the assertion passes for a reason the test name disclaims, so an editor can weaken the guide's real claim with the suite green. Route: assert `"default 100"`/`"default 10000"`, count the pointer inside the Conventions section, and name the client-side paragraph's own sentence."""
disposition = "fix-now"
response = """Contested twice, fixed on the third attempt in `91e15a8`. First answer: keyword presence. Second: "default 100"/"default 10000"/"default 1" — which the verifier showed are substrings of each other, so deleting the limit or depth sentence still left the pin green; my strengthening was itself an instance of the family it was fixing. Third: each default is pinned by its own clause ("cap on the result, default 100", "cap on entity expansions, default 10000", "default 1. 0 is roots-only"), and the conventions pointer by its section's sentence ("a set never validates, never selects and never touches a store") rather than the phrase the header also carries. Negative controls run per pin: deleting the limit line reddens with "the guide omits cap on the result, default 100"; replacing the pointer sentence reddens. Recorded honestly: my first control used a global substitution that rewrote the assertion alongside the guide, so it proved nothing — the valid control deletes a line."""

