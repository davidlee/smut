[[finding]]
id = "F-6"
status = "verified"
severity = "nit"
title = "The fixture-to-`scan_refs` agreement is a regression guard, not evidence about this data"
detail = '`tests/fixture.rs:303-322`. Both walks encode the same rule (an object with a string `id` is a leaf, arrays positional) and both collapse to a `BTreeSet` of targets, so labels are never compared — and every reference in `entities.json` is a flat `[{"id": ...}]` list, a shape on which the two definitions cannot differ. It is NOT vacuous (a change to either algorithm reddens it), but it proves the definitions have not diverged yet rather than that either is right over this data; the discriminating embedded case already lives at `src/walk.rs:590`. Route: keep the assertion, soften the comment from evidence to regression guard. This is a fair correction to my own RV-019 F-2 disposition, which claimed more for it than it does.'
disposition = "fix-now"
response = """Conceded, and the correction is to my own record: RV-019 F-2's disposition claimed the cross-check was "two accounts forced to agree… stronger than either alone". It is not — both walks encode the same rule, both collapse to unordered target sets, and every reference in this data is a flat one-element list, so it cannot differ. The assertion stays (it would catch either algorithm changing) and the comment now calls it the regression guard it is. Two reviewers have now corrected an overstatement of mine; both corrections are on the ledger rather than absorbed."""

