[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Projected entities bypass the shared wrapper: envelope entity roots are lexical, not id-first"
detail = """
Expected: §4.2/DEC-007's mechanism clause — "entity serialisation at the final boundary through one shared Entity wrapper … used for stored entity files and for projected entities alike", with the entity root naming id first and its remaining keys lexical.
Observed on the built binary at abf690e, in a scratch store: an entity *file* is `{"id":"smut","body":"First.","kind":"note","title":"Alpha"}` (id first), but `query {"from":["smut"],"select":["body","title"]}` emits `{"dangling":[],…,"objects":[{"body":"First.","id":"smut","title":"Alpha"}],…}` — lexical inside `objects`, so the shared wrapper is applied to files only.
Cause: `src/entity.rs`'s `Canonical` carries an `id_first` flag that `render` sets only for `serialise_entity`'s single root; the stdout document path (`serialise_document` → `Form::Stdout`, reached from `cli.rs::serialise`) renders every object lexically. The same entity therefore serialises two ways depending on where it appears, which is exactly what "one shared wrapper" exists to prevent.
Blast radius if repaired: `objects[]`, `changes[]` entries and `changes[].previous` (each carries a nonempty string id, i.e. an entity node by DEC-005's predicate); index.json/manifest.json carry no entity node and keep their bytes; entity files are unchanged. JSON key order is semantically insignificant, so no consumer breaks — but the README's `console` transcript and `docs/store-format.md`'s canonical-bytes section both have to follow the ruling."""
disposition = "fix-now"
response = """Accepted: the code is the defect, not the design. DEC-007's mechanism clause names one shared wrapper "used for stored entity files and for projected entities alike", and §4.2 states one ordering convention; the build applies it at the file root only. Fix, in this unit of work, TDD: make the ordering structural — an entity node (an object whose id is a nonempty string, DEC-005's one predicate) names id first *wherever it appears*, every other object stays lexical — which collapses `serialise_entity`/`serialise_document` into one wrapper and removes the root-flag that produced the divergence. Pinned by a unit test on the envelope path and by the README's console transcript being regenerated against the built binary. `docs/store-format.md`'s canonical-bytes section gains the one sentence that says projected entities use the same wrapper. The design clarification this rests on (an embedded entity node is not an "embedded ordinary object") goes in the reconciliation brief."""

