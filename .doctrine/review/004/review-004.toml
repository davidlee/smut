[[finding]]
id = "F-15"
status = "verified"
severity = "minor"
title = "A symlinked `.smut/lock` is followed"
detail = """
Expected: the design's symlink posture — §4.1/§5.2 refuse symlinked entity files and `index.json` ("the store never follows one"), and §5.1 says the lock is opened without truncation and never replaced, renamed or unlinked.
Observed: replacing `.smut/lock` with a symlink to `/tmp/reallock` is accepted; `declare` succeeds and the symlink is left in place, so the lock is flock'd through the link. `O_NOFOLLOW` is absent from the open.
Tolerated with rationale: no bytes are ever read from or written to the lock (it is an empty flock target, opened without truncation), so following a link cannot corrupt store data; the residual harm is lock-domain confusion in a `.smut` directory a user has deliberately tampered with, which is outside the threat model (§8.2: single user, single host) and already documented as unsupported ("editing .smut/ by hand is not supported"). A race-free refusal needs `O_NOFOLLOW` and therefore `libc`, which §12's declared dependency set does not permit."""
disposition = "tolerated"
response = """Tolerated, on the same posture the design takes elsewhere: no bytes flow through the lock (empty, opened without truncation, never replaced), so a followed symlink cannot corrupt store data; the residual is lock-domain confusion in a store the user has tampered with, which §8.2 puts outside the threat model and the portability note already calls unsupported. A race-free refusal needs `O_NOFOLLOW` and therefore `libc`, which §12's declared dependency set does not include — so "fix it now" would cost a design change for a hazard the design has already excluded."""

