   Correction to this finding's detail: it says 8 `recovery_interrupted__*`. Measured is 7 — the eighth grep hit is the coverage guard's `format!("fn recovery_interrupted__{}(", ...)` literal at L1259, not a test. 15 + 7 = 22.

2. Every test arms the boundary its name claims (checked per test site, not assumed from the helper).

3. Repeated recovery is explicit per step. Each `recovery_interrupted__*` aborts inside recovery (child process, SIGABRT asserted) and then requires the next command to converge on the tree of an uninterrupted twin (`settled()`), so convergence — not mere survival — is what each recovery boundary asserts.

4. Failure reactions cover §4.3's asymmetry and §4.5: 7 `a_failed_*_is_pre_commit` tests, 6 `*_rolls_forward` tests over exactly the post-decision boundaries (`ParentDirectorySynced`, `PutsApplied`, `IndexApplied`, `RemovalsApplied`, `DoneRenamed`, `CleanupRemoved`), and 4 `a_failed_recovery_*` tests.

5. The file claims only code-path ordering (module doc L14–19); nothing in it claims kernel or disk behaviour.

Green at head: `cargo test --features fault-injection --test durability_crash` → 44 passed, 0 failed; 0 by default by construction.

No new finding. The one gap the read exposes is the registry's, not the suite's: four post-decision `.smut` fsyncs share three boundary names, so they cannot be interrupted in isolation. That is F-7's design gap, corroborated independently by this read; its fix is the §4.3/§4.4 write already in the reconciliation brief.
"""

