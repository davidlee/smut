[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "A closed stdout panics with exit 101, outside the brief's 0/1/2 exit table"
detail = """
Expected: §7.2 — Reject → 2, StoreError → 1, success → 0 — and §5.3, which says a stdout failure after a commit is documented, not engineered around.
Observed: `smut get smut | true` prints the Rust panic message ("failed printing to stdout: Broken pipe (os error 32)") on stderr and exits 101. `src/main.rs` uses `print!`, whose failure path is a panic; a reader that closes the pipe early is ordinary use (the same defect is recorded in notes.md's PHASE-07 hand-back, where it was ruled outside that phase's bar).
The prepared bytes are already complete at that point (§5.3), so the honest outcomes are: delivered (0) or delivery failed (1). A panic is neither, and it is the one exit code the brief does not name."""
disposition = "fix-now"
response = "Accepted: a panic is outside the exit table and a closed pipe is ordinary use. Fix, in this unit of work: `main` writes the already-prepared bytes with a fallible write instead of `print!`, and a failed write exits 1 — the delivery-failure code the brief already names — with a diagnostic only when the error is not BrokenPipe, since `| head -1` is not an error worth reporting. Pinned by a unit test over a writer that fails, not by a signal test."

