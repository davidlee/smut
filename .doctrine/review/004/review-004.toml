[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "§4.3/§4.4 leave three `.smut` fsyncs unnamed, so the implementation borrows a neighbour's boundary name"
detail = """
Expected: the design's protocol sections to name every durable step the interruption evidence has to distinguish.
Observed: §4.3 names the staged puts and manifest, the staging directory and the post-rename parent fsync, but not the post-apply `fsync(.smut)` that precedes the `commit → done` rename, nor the `fsync(.smut)` after the `done` rename before cleanup; §4.4's recovery recipe ("replay, rename to `done`, fsync, clear") omits the fsync after replay and before the rename. The implementation therefore reuses `RemovalsApplied`, `DoneRenamed` and `RecoveryDoneRenamed` as boundary names for these four steps (notes.md, PHASE-05 autonomy log: "all four are post-decision steps with the same roll-forward reaction").
The borrowing is defensible and the tests pass, but a boundary name is the audit's unit of evidence: a shared name means a step cannot be interrupted in isolation, which is precisely what §4.3 claims the barrier tests do for every member. The design should name them and say why they share a name, or the registry should grow four names."""
disposition = "design-wrong"
response = "Accepted as a design gap with a real cost: a boundary name is the audit's unit of evidence, and four post-decision steps sharing three names means they cannot be interrupted in isolation — the tests are right to exist, the protocol text is what is incomplete. Reconciliation brief — per-slice, `design.md §4.3` names the post-apply and post-done `.smut` fsyncs (and says the roll-forward reactions are identical, if the shared names stand), and `§4.4`'s recovery recipe gains the fsync after replay and before its `commit → done` rename, with why it mirrors §4.3's apply rule. Whether the registry grows four names is an implementation choice the design text should leave room for, not pre-empt."

