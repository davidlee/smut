[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "§6 grounds STD-002 compliance in a plan criterion and drops its operative clauses — the design leaning on its own downstream"
detail = """
§6 now reads: "their version supplies an unambiguous refusal boundary once the version moves, and a tree mid-slice is not a release candidate for any version (PHASE-01/EX-5)."

The criterion it cites is narrower and stronger than the paraphrase: "No tree of **this phase** is a release candidate **or a supported reader of any version-1 store**: it is not tagged or published, it is run only against scratch stores, and the stricter loader enters service only with PHASE-02's version bump." The design (a) generalises "this phase" to every mid-slice tree, and (b) drops the two clauses that actually discharge STD-002's hazard — not being a supported reader of a version-1 store, and running only against scratch stores rather than a live one.

Net effect: the design's STD-002 compliance rests on text it does not own, and on the weaker half of that text. A design must not ground an obligation in a plan criterion, since the plan is downstream of the design.

State the fact in the design instead, keeping EX-5 as a cross-reference rather than the ground: "While the stricter loader runs at format 1, this tree is neither tagged nor published, is run only against scratch stores, and does not open the operator's live store until PHASE-02's version bump (PHASE-01/EX-5, PHASE-02/EN-4).""""
disposition = "fix-now"
response = "Refreshed: §6 now states the mid-slice release fact in the design's own voice with PHASE-01/EX-5 and PHASE-02/EN-4 as cross-references. The authority order is restored by construction — nothing in the design depends on a criterion for its truth, and the criteria check the design."
