[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The new recovery sentence states the acceptance-set relation backwards; STD-002's rationale carries the same error"
detail = """
The amendment reads: "Recovery runs before validation, so recovery's acceptance set never grows with the loader's, and no test can observe a tightening that forgets the bump."

That states the mechanism backwards. `validate_staged` (src/store/journal.rs:611-660) checks presence, regular-file, symlink and listed-set shape and never parses a payload; `replay_commit` publishes the staged bytes immediately after `manifest.validate()` and `validate_staged` (:569-600). So no loader rule changes what recovery accepts — recovery's acceptance set is not merely "not growing with" the loader's, it is unconditionally larger, and it is the version gate that stops an earlier build's committed manifest from being replayed at all.

The sentence imported STD-002's rationale without its conclusion, so it reads as a safety claim about publish-then-refuse when the actual position is that within one version a payload a stricter loader refuses is still published, and STD-002 records that residual.

Replace with: "Recovery never parses a payload — `validate_staged` checks shape only — so no loader rule changes what recovery accepts; the version gate is the only thing that stops an earlier build's committed manifest from being replayed. Within one version a payload a stricter loader refuses is still published, which is the residual STD-002 records."

The same wrong-direction phrasing is in STD-002's Rationale ("Recovery's acceptance set never grows with the loader's") and should be corrected there in the same pass, since the design now quotes it."""
disposition = "fix-now"
response = "Both the design sentence and STD-002's rationale were refreshed to describe recovery accurately. No gate is needed because the corrected claim is about mechanism, and STD-002's own review trigger (any change to the pre-replay contract in validate_staged) is what keeps it current."
route = "refresh"

