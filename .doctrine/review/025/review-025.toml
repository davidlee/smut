id = "F-1"
status = "verified"
severity = "blocker"
title = """"README is not gated" is false: just check runs the README's executed block, which still records id envelopes"""
detail = """
The design now says the README is "not gated" (three places: §4's table row, §5's amended sentence, §6) while §5 also requires `just check` green. Those cannot both hold. `justfile` defines `check: build lint fmt test` and `test: cargo test` over all targets, which runs `tests/readme_example.rs`. Its `worked_example()` matches exactly one fence — `line.trim() == "```console"` at :78 — and `the_readme_worked_example_runs_and_prints_what_it_records` (:204) executes every command and compares the recorded JSON. README.md:95 is that fence, and the block records `[{"id":"smut",...}]`, `"changes":[{"id":"smut",...}],"ids":["smut"]`, an `get`/`query`/`render` envelope and a `previous` — all of which move when ENTITY_ID becomes `smut_id`. There is no `#[ignore]` or feature gate in the file. So the README's executed block gates the slice, and it is order-independent: whichever side moves first, the test is red until both move. Plan criteria require the same red gate (PHASE-02/EX-6, VA-2, PHASE-03/EX-3).

This reverses part of F-6's disposition. F-6 de-scoped the README on the operator's 0.2 rewrite and CHR-001; that is right for the prose being rewritten, and wrong for the one block a test executes. The minimal correction narrows the de-scoping rather than reverting it: the README's single exact-fenced block is in scope and must carry `smut_id` by the time PHASE-02's gate runs — by CHR-001 landing it or by this slice editing that block, whichever comes first; the surrounding prose stays the operator's and is never swept. That keeps the gate satisfiable without touching their draft.

Needs an operator decision because it changes scope; raised as a blocker so the ledger holds it until then."""
disposition = "fix-now"
response = "Fixed and verified. The control is the gate itself: PHASE-02/EN-3 requires the executed block to carry smut_id before the gate run (by CHR-001 or by the phase editing only that block), and VA-2 confirms it, so a phase cannot close with the block and the binary out of step. CHR-001 holds the prose rewrite and records the fence requirement."
