[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "A contradiction inside `$or` or `$not` is refused though the predicate is satisfiable"
detail = """The check runs at the end of `parse_field`, which is re-entered for every `$and`/`$or`/`$not` operand. `{"$not":{"status":{"$eq":"open","$ne":"open"}}}` returns the whole store at exit 0 today; an entity satisfies it. `{"$or":[{"f":{"$eq":1,"$ne":1}},{"g":{"$eq":2}}]}` is likewise satisfiable. Refusing either is a false positive and falsifies §2's claim that a refusal can never be wrong about a correct query. Repair: refuse only where the conditions are required (reached through `And` alone), and pin both non-refusals."""
disposition = "fix-now"
response = "Repaired in the design. Pinned by the demanded-position table and the $and-spanning pin."
route = "control"

