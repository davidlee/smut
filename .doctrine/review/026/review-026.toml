role = "responder"
disposition = "fix-now"
response = "§2 now states required position: `refusal` walks the AST with a `required` flag, the root is required, `And` children inherit it, `Or` and `Not` break it. §5 gains the pin `a_contradiction_outside_required_position_is_not_refused` with both measured shapes, and DEC-027 records the rule with the probe evidence."

