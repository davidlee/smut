[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Design §2 names `$HOME` as the user root's source; the binary resolves a home for an unset *and* an empty `$HOME`, so a container with no home still reads a user layer"
detail = """
**Expected** (design §2, *User root*, verbatim): "`$XDG_CONFIG_HOME` when set and non-empty, else `$HOME/.config`. … when neither variable resolves — **a container with no home** — there is no user root and the user layer is simply absent."

**Observed.** `src/main.rs:134` hands `user_root` whatever `std::env::home_dir()` reports, and `home_dir()` falls back to the passwd entry when `$HOME` is absent *or empty*. Measured on the pinned toolchain (a three-line probe, `rustc 1.100.0-beta.7`):

    HOME=None        home_dir=Some("/home/david")
    HOME=Some("")    home_dir=Some("/home/david")
    HOME=Some("/tmp/fakehome") home_dir=Some("/tmp/fakehome")

So the container §2 names — a process with no `$HOME` — gets a user layer at the passwd home's `.config/smut`, not an absent layer. The design's rule and the binary disagree in exactly the case the design calls out.

This is not a phase defect. PHASE-04/EX-5 authorised the call ("home comes from `std::env::home_dir()` when that call is clippy-clean on the pinned toolchain") and PHASE-04/EN-4 built its fixtures around the fallback ("the spawn helper … never unsets them, because `std::env::home_dir()` falls back to the passwd entry"). The plan knew; the **design never recorded it**, and design is what a future reader consults for the rule. Sub-second reproducer: `env -u HOME smut conventions` in a container reads `/root/.config/smut`, while §2 promises it reads nothing.

Two readings, one of which reconcile must pick: (a) amend design §2 to state the source as `std::env::home_dir()` — `$HOME` when set and non-empty, else the passwd entry, absent only when both are missing — keeping "no home at all is an absent layer"; or (b) hold the design's literal and gate on `$HOME` alone, which is a code change the plan deliberately declined. This audit recommends (a): the fallback is the more usable behaviour and the code already ships it, so the design sentence is what is stale. `major` rather than `blocker`: nothing is broken for a caller with a home, and reconcile lands the correction in this same unit of work."""
disposition = "design-wrong"
response = """
Upheld as a design-text defect, reading (a). The code is what the plan authorised and what the tests were built around; the design is the artifact that never recorded it, and design is what a future reader consults for the rule. Nothing in the code should move: gating on `$HOME` alone would trade a measured passwd fallback for a worked-around one, and PHASE-04/EX-5 chose the other way with the gate green.

Reconcile write surface: **per-slice direct edit, `design.md` §2.** Replace the *User root* paragraph's source rule with the value the binary actually hands the pure function — `std::env::home_dir()`: `$HOME` when set and non-empty, else the passwd entry — keep "the layer root is `<config-home>/smut`", and keep "no home at all is an absent layer" (now meaning: no `$HOME`, no passwd entry). The pure signature `user_root(config_home: Option<&Path>, home: Option<&Path>)` is unchanged, so §2's shape claim — "the binary is the only code that reads the environment" — gets *stronger*, because it now names the whole environment read rather than a variable."""

