[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = 'The `.config/smut` segment is built in two places, and the two plan criteria that say "one place"/"nowhere else" are lodged with reconcile — which cannot edit `plan.toml`'
detail = """
**Expected / observed.** Design §2 never says *who* joins the `.config/smut` segment, and four separate sentences then overstated it — RV-033 F-6 already found `src/main.rs`'s and `Roots::under`'s and both were corrected in `e692735`. What survives is in the **plan**, and it is still false:

- `plan.toml` PHASE-01/EX-3: "this is the one place that `.config/smut` is joined".
- `plan.toml` PHASE-04/EX-5: "so the `.config/smut` segment is joined by PHASE-01/EX-3's function and **nowhere else**".

The compound segment is built in two places, and both are mandated: `Roots::under` joins the literal `.config/smut` onto the repository root (`src/conventions.rs:68`), and `user_root` builds the same sequence for the home fallback, `home.join(".config").join("smut")` (`:112`) — PHASE-01/EX-2 requires exactly that. The property the sentences protect does hold: no root is spelled in `roots()`, and `load` joins only `<kind>`. Only the literals are wrong.

**Why this is an audit finding and not a reconcile line item as recorded.** RV-033 F-6's verify turn ends "The criterion wording stays for reconcile, as dispositioned", and the handover repeats it ("the criteria wording is owed to reconcile"). That route does not exist: `plan.toml` `EX-/EN-/VT-` ids and their rows are a completed plan's approved text, not a per-slice write surface (`lib:reference/review-ledger.md` §6, and the audit brief-surface guardrail: "never a reconcile direct-edit surface"). A reconcile brief naming `plan.toml` stalls.

**Smallest resolution.** Give the truth an authoritative home the writer can actually reach: one sentence in `design.md` §2 saying the compound segment is deliberately constructed twice — `Roots::under` for the project layer, `user_root` for the home fallback — because a config home already names `.config`. Then the two plan literals read as the plan's own looser shorthand rather than as a rule the code violates, and no approved criterion is rewritten. Audit does not "fix" the code to match the false sentence; the code is right."""
disposition = "design-wrong"
response = """
Upheld, including the routing correction. RV-033 F-6 fixed the two code-adjacent sentences and left the two plan criteria to reconcile; reconcile cannot write `plan.toml`, so the residue has no owner and would be re-discovered at closure. `plan.md`'s item 1 disposition (`P` — the plan was the defect, no design change owed) stands as the plan stage's judgement, but post-completion the only surface that can carry the truth is the design.

Reconcile write surface: **per-slice direct edit, `design.md` §2**, one sentence after "The declaration-kind segment is joined **exactly once**, inside `load`": the *compound* `.config/smut` segment is deliberately constructed twice — `Roots::under` joins it onto the repository root for the project layer, and `user_root` builds it for the home fallback (`<home>/.config` then `smut`), because a config home already names `.config`. Say plainly that "one join per layer root" is the rule and "one join for the segment" is not.

Not a `plan.toml` edit: `EX-3`/`EX-5`'s literals stand as approved text, read as shorthand. No code change: the code implements the true property."""

