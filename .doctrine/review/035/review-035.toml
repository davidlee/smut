[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = """`load`'s doc claims the module "reaches a filesystem in three places, and this is the middle one" — there are two, and `load` is neither"""
detail = """
**Expected.** A doc comment that counts the places a module reaches a filesystem should count them correctly — especially this one, which is the *replacement* text for RV-032 F-3 ("load's doc claims a filesystem-read monopoly it does not have"), discharged in `1ced7c8`.

**Observed.** `src/conventions.rs:436-439`, added by that very commit:

    /// This module reaches a filesystem in three places, and this is the middle one:
    /// [`project_root`] above walks the ancestors looking for a `.git` entry, this
    /// function turns each root into that layer's one `<root>/<kind>` directory, and
    /// [`read_layer`] below reads the directory's entries.

`load` performs no filesystem access. It builds two `PathBuf`s (`roots.project.join(kind)`, `user.join(kind)` — `Path::join`, pure), calls `read_layer`, sorts, and extends. The reaches are **two**: `project_root` (`symlink_metadata`) and `read_layer` (`read_dir`, `metadata`, `read`). `binary_layer` reads nothing (the bytes are `include_str!`). So the count is wrong and the "middle one" is not one of them — the same overclaim F-3 was raised for, inverted into a count.

This is the fourth false doc sentence in this slice after RV-032 F-3's monopoly and RV-033 F-6 and F-8, and the second produced *by the fix for a previous one*. That pattern, not the sentence, is the durable lesson: each was found by review after a run declared the docs clean, so a doc sentence introduced to discharge a finding needs the same falsification as code. Corrected text: "This module reaches a filesystem in two places: [`project_root`] above … and [`read_layer`] below; `load` only joins and orders what they return."

Not repaired here: the audit stage does not write code — `src/conventions.rs`'s last change is PHASE-05's concluded delta (`e54f7aa..c6cebe2`), and a source edit now would leave the phase registry describing code that no phase concluded. Captured as a backlog chore with F-4."""
disposition = "follow-up"
response = """
Upheld. The sentence is false arithmetic, not a false rule — the property it guards (`parse` is pure; `project_root` and `read_layer` are the module's only filesystem reaches) is true in the code and pinned elsewhere by VA-2's greps. So the correction is one comment, and it belongs with F-4 in CHR-006 rather than in a second backlog item.

Reconciled: **CHR-006** carries it, with the replacement text written down. Not repaired at audit for the reason given on F-4 (no code after the last concluded delta), and not `tolerated`: this slice has now produced four false doc sentences, three of them found by review after a green run, and letting the fourth stand would make "the docs are honest" a claim the slice's own record contradicts. The pattern goes to `notes.md` § Harvest → Learned as a durable lesson: a sentence introduced to discharge a doc finding needs the same falsification as code."""

