[[finding]]
id = "F-3"
status = "verified"
severity = "nit"
title = "Obligation 6 quotes §6 text the design does not contain — the quoted sentences are plan EX-4's, and §6's actual clause is one line different"
detail = '''
**Expected.** Obligation 6 (`notes.md` § Obligations owed at reconcile) tells reconcile that "§6 (and EX-4, which restates it) has no tie-break among unnameable entries" and quotes the offending text: *"Sorted by name … a `name: None` entry sorts last … sorting is by the decoded name only"*, then says "Owed: one sentence in §6."

**Observed.** Design §6 contains no such sentences. `grep -n 'None\|sort' .doctrine/slice/008/design.md` returns exactly one hit in the whole file — `:246`, "sorts each layer's entries by name (a directory's order is arbitrary, and the listing is the diagnostic)". The string `None` does not appear in `design.md` at all. The quoted wording is `plan.toml` PHASE-03/EX-4's ("a `name: None` entry sorts last within its layer … Sorting is by the decoded name only"), which the obligation's own parenthetical half-acknowledges but then attributes to §6 anyway.

**The gap is real**; only its evidence is misquoted. §6's one clause sorts entries "by name" without saying what the key is when an entry has no name — and §1 permits a nameless entry ("A file whose name is not UTF-8 never becomes an `Entry` with a name"), so §6's sort is under-determined by its own vocabulary. PHASE-03 ruled the tie (decoded name, `None` last, raw `OsStr` among `None`s, `src/conventions.rs:642`) and RV-032 F-2 pinned it (`two_undecodable_names_break_their_tie_on_the_raw_filename`), so the code needs nothing.

Reconcile would hunt §6 for a sentence that is not there and might "correct" the wrong clause. The brief must quote §6 as it stands (`:246`) and name the tie-break the code implements, not the plan's paraphrase.'''
disposition = "design-wrong"
response = """
Upheld. The gap obligation 6 names is genuine and stays on the brief; its quotation is wrong and would send reconcile to a clause that does not exist. `design.md` :246 is the only sorting text in the file ("sorts each layer's entries by name"), and `None` never appears in `design.md` — so the obligation's quoted sentences are PHASE-03/EX-4's paraphrase, as its own parenthetical half-admits.

Reconcile write surface: **per-slice direct edit, `design.md` §6**, one clause appended to :246's sentence — "sorted by name; an entry whose filename is not UTF-8 sorts last, and two such entries order by their raw filename, so the order is total whatever `read_dir` returns". The brief must quote §6 as it stands, not the plan's wording, and must name `src/conventions.rs:642` (`sort_layer`) as the implementation and `two_undecodable_names_break_their_tie_on_the_raw_filename` as the row, so the sentence lands against evidence."""

