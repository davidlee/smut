[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "A recorded seat ruling on an empty `home` is neither implemented nor pinned, and the handover and notes both claim a pin that does not exist"
detail = """
**Expected.** `notes.md:373–381` records a PHASE-01 residual and the seat's ruling on it:

> "**Seat ruling:** the non-emptiness EX-2 already applies to `config_home` reads onto `home`, since an empty `home` resolves no config home either — that is what 'neither resolves' already means, not a new rule. **Pinned by one row in PHASE-04's owned `src/conventions.rs`** (charter 4 brief), not by reopening PHASE-01."

The handover repeats the claim: "an empty `home` yields a relative layer root — ruled unreachable from the binary, **pinned by one row**".

**Observed, twice over.**

1. **The ruling is not implemented.** `user_root(None, Some(Path::new("")))` returns `Some(".config/smut")` — a *relative* layer root read against the cwd (`src/conventions.rs:110-115`: the non-emptiness test is applied to `config_home` only). The ruling says an empty `home` "resolves no config home" and so should be `None`.
2. **The pin does not exist.** `grep -n 'Path::new("")' src/conventions.rs tests/conventions.rs` returns one line: `:1524`, inside `an_empty_config_home_falls_through_to_home`, which passes the empty path as *`config_home`*, not as `home`. No row exercises an empty `home`. `grep -n 'empty home'` has no test.

Reachability: from the binary, none — `home_dir()` is absolute or `None` (measured: `HOME=` empty still reports the passwd home), so the branch cannot be entered through `roots()`. From the crate's public API, trivially: `user_root` is `pub`, and the behaviour is the "relative root resolves against the cwd and reads the wrong layer without a symptom" class this module's own doc comment argues against ("An empty config home is no config home, because an empty path is what an unset variable looks like once it has been joined onto anything").

Not a blocker and not this stage's repair: it is unreachable from the shipped caller, and PHASE-01/EX-2 pins only that *`config_home`* be non-empty, so the code meets its criterion and the ruling is an extension of it. Both halves — the guard (`home.filter(|home| !home.as_os_str().is_empty())`) and the absent row — are owned work outside the audit's stage; captured as a backlog chore below, and the false "pinned by one row" claim is corrected in `notes.md` by this audit's harvest."""
disposition = "follow-up"
response = """
Upheld on both halves, and neither belongs to reconcile: a guard on a pure function and a test row are code, and the design and slice documents say nothing false here — the *notes* and the handover do. Reconciled in two places.

1. **Owned work:** CHR-006 (`doctrine backlog inspect CHR-006`) carries the guard plus the missing row (`fn an_empty_home_is_an_absent_layer`), with the reversal path recorded in case the ruling is dropped instead.
2. **The false claim, corrected now:** this audit's harvest amends `notes.md` § Harvest → Open so the residual no longer asserts "pinned by one row in PHASE-04's owned `src/conventions.rs`" — it says what is true, that the ruling is unimplemented, the pin is absent, and the reachability argument is the whole reason it is off the close-gate.

Not `fix-now`: a source edit at audit would leave `src/conventions.rs` changed after PHASE-05's concluded delta with no phase that concluded it, which is a worse defect than an unreachable branch. Not `tolerated`: the record was wrong, and wrong records are corrected rather than tolerated."""

