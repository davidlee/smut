[[finding]]
id = "F-9"
status = "answered"
severity = "major"
title = "The silent old-spelling query is decided by DEC-027 but the design never says so — it needs a citation, not an adjudication"
detail = """
The design never answers the question its own slice body hands to it. slice-004.md's risks say a caller left on `id` fails every predicate operator except `$exists`, so a stale `where:{"id":...}` returns an empty result at exit 0 rather than an error — "the design should decide whether that is a test or just a documented sharp edge". No section decides it. The class is nevertheless settled by DEC-027: a `where` naming a field no scanned root carries is TAUGHT, never refused, because refusing punishes filtering-as-probe and the check is only sound store-wide. After the rename `id` is exactly such a field.

So this needs a citation and a sentence, not an adjudication. Minimal wording: in §4 or §6, "A query naming a field no entity carries is taught, never refused (DEC-027): after this rename an old-spelling `id` is such a field, and the guide says so." The exhausted sentence, already adopted for PHASE-02/EX-8: "a field no entity carries fails every operator exactly as a missing field on one entity does."

Operator has assented to D1 ("seems reasonable"); this is the record of what was assented to, reframed per Seat C so the design cites DEC-027 rather than re-deciding it."""
disposition = "fix-now"
response = 'Operator assented to D1 ("seems reasonable") on 2026-11-02. Adjudicated as Seat C-2 reframed it: no new decision is taken, DEC-027 already settled the class, so the design gains a sentence in §4/§6 citing DEC-027 and the guide carries the drafted sentence ("a field no entity carries fails every operator exactly as a missing field on one entity does"), which PHASE-02/EX-8 now requires verbatim.'

