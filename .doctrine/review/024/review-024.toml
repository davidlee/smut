[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Recovery replays before validation, so it can publish exactly the bytes the loader then refuses — with no repair path"
detail = """
Design §3 orders recovery strictly before store validation (docs/store-format.md:208-210 records it), and DEC-021/the slice's own rule make malformed stored identity corruption with no repair path and no migration. Composed: a committed manifest whose staged put carries malformed structural identity is replayed by recovery, the store is rewritten, and the load that follows refuses the store it just wrote. The store is then permanently unloadable, and by design there is no verb to fix it.

Reachability is narrow — a version-2 manifest is normally written only by this build — but the failure is total and the refusal promise and the no-repair promise compose into loss rather than a diagnostic. This is not a plan repair: the design must choose one of

(a) validate staged put payloads before replay (recovery then refuses before publishing, and the source is bounded: the same predicate the loader uses, applied to replayed payloads), or
(b) state explicitly in §3 and in docs/store-format.md that recovery may publish bytes the loader will subsequently refuse, and that the store is then unrecoverable.

Recommendation: (a). It keeps the two promises composable and costs one predicate call per replayed put on a path that already parses the payload. (b) is honest but leaves a documented way to destroy a store with no recovery story.

Raised as a blocker because it is the only finding here whose resolution changes behaviour rather than wording; it stays open until the operator rules."""
disposition = "tolerated"
response = """
Operator ruled: tolerated, 2026-11-02, with the invariant enshrined in governance rather than left as an unenforced rule.

Adjudicated on measured likelihood rather than the seat's "permanent loss" framing, which overstates it. What closes most of the class: malformed identity is refused at the request boundary (Reject::InvalidId, src/entity.rs:43/530/745 and src/declare.rs:916), so a validating build cannot stage it; a mid-staging crash lands in the `prepare` state, which recover() discards rather than replays (src/store/journal.rs:493-6); and a cross-version manifest is refused by version before replay (this slice's EX-7). A publish-then-refuse therefore requires a writer bug or a hand edit inside `journal.commit/` during the commit window.

Correction recorded against D7 as originally stated: neither option bricks the store permanently. store/mod.rs:295-6 runs recover() before load(), so a pre-replay refusal also leaves every command refusing; the difference is only which artefact is repaired and whether the pre-crash content survives. Documentation alone was therefore sufficient for the hand-edit leg — "don't edit the journal" is worthless advice, the format's corruption contract already owns hand edits, and the ordering plus its rationale is already in docs/store-format.md:208-210.

Carried as an invariant with a home, not as machinery: **a stricter stored-validity rule lands with a version bump, or proves it cannot refuse an in-flight manifest.** That invariant is what EX-7/VT-6 already relies on silently.

Its home is now STD-002 — "Recovery replays a committed manifest before the loader validates it — every stored-validity rule that tightens lands with a version bump, or proves it cannot refuse an in-flight manifest" — minted at operator direction on the ground that the defence is process, and unenshrined process is not a defence. The title names the trigger so it rides boot context and is surfaced for every slice; the statement carries the two obligations and the pre-replay review table; the rationale records why recovery must run first, that the window widens monotonically with the loader's rule count, and that no test can observe the violation. RSK-001 (the unenforced-invariant gap) is resolved `promoted`. The residual writer-bug leg is left to the write-set tests rather than to a design decision.

Design consequence for this slice: §3 gains the invariant sentence as a statement, not a new rule — SL-004 discharges it by example, version 1 → 2 with the old-manifest refusal pinned pre-replay."""

