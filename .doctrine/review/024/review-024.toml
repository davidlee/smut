[[finding]]
id = "F-8"
status = "open"
severity = "major"
title = "The guide must say old stores are refused, while learn.rs is chartered never to pin a version — the design picks neither"
detail = """
Two design obligations collide and the design picks neither. §4's documentation contract requires the guide to state that a store written by an older build is refused. src/learn.rs:3-13 charters the guide module as "Descriptive and version-scoped, never version-pinning ... a version figure would be PHASE-07's to change". An implementer must therefore either pin a version figure (violating the module's charter) or state the refusal without one (leaving the design silent on the wording it asked for).

Minimal wording, appended to the §4 refusal sentence: "stated without a release or format figure."

The plan already requires the versionless phrasing (PHASE-02/EX-5: "the guide states that a store written by an older build is refused without pinning a release figure"); assent makes that the design's choice rather than the plan's invention. Note F-5's teaching duty and the index refusal wording (F-1) land in the same sentences, so all three should be written together."""

