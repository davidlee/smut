[[finding]]
id = "F-3"
status = "open"
severity = "major"
title = "§2 and §4 state as fact that two production literals already use ENTITY_ID; the code contradicts both, and they are the remaining wire surface"
detail = """
Design §2 asserts in the present tense that src/declare.rs and src/conventions.rs use the constant when emitting, and §4's table concludes "a listed consumer that already reads `ENTITY_ID` needs no production rewrite solely to replace the spelling". Measured: src/declare.rs:110 writes entry.insert("id".to_owned(), ...) and src/conventions.rs:126 writes ("id", id_of(set)); `rg -n ENTITY_ID src/conventions.rs src/declare.rs` matches nothing. So the two files that spell the wire key as raw literals are the ones the design says need no change — the whole remaining production surface.

Same class: §4's src/order.rs row claims the sort tiebreak carries the key, but ordering is over Id values and `rg -n ENTITY_ID src/order.rs` finds nothing, so the row overstates the work.

Minimal wording: §2 "uses the constant when emitting" / "uses it for" becomes "must emit ... from the constant"; §4's sentence becomes "A listed consumer that already reads `ENTITY_ID` needs no change beyond inspection, except the change-receipt subject in `src/declare.rs` and the conventions seed in `src/conventions.rs`, which spell the key as literals today"; the order.rs row becomes "verify no identity key enters ordering".

Consequence: PHASE-02/EX-1 and VA-2 already require the routing and the "wire spelling only at ENTITY_ID" check; assent makes them design obligations rather than plan readings."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-4"
status = "open"
severity = "major"
title = """§4 says "retain rendering behavior", but the renderer's suppression set is the constant — a data id changes the visible output"""
detail = """
Design §4's src/render_markdown.rs row says "retain rendering behavior and identity display as a value". That is unsatisfiable as written: the renderer's suppression set IS the identity constant — src/render_markdown.rs:186 forces ENTITY_ID into the selection, and :211 filters `*field != ENTITY_ID` out of the attribute lines. So "the key moves" and "behaviour is retained" cannot both hold for a data field named `id`: today a probe with {"id":"a","smut_id":"x","body":"hello"} prints `- **smut_id:** x`, and after the swap an ordinary data `id` renders as an attribute while `smut_id` is suppressed. The design decides neither outcome, so the visible output changes without a decision.

Minimal wording, appended to that row: "Retain the mechanism: identity display remains keyed on `ENTITY_ID`, so an ordinary `id` renders as an ordinary attribute and `smut_id` is the suppressed identity. Pin the new output."

Consequence: PHASE-02/EX-10 and VT-8 (tests/render.rs) already pin the mechanism and the before/after bytes; assent makes the render change a design decision rather than a plan inference."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-5"
status = "open"
severity = "major"
title = "smut_id stays reserved at every depth, but no section assigns the sentence that teaches it — ISS-002 survives re-spelled"
detail = """
Design §6 states as a boundary that the format "still reserves `smut_id` at every depth". Nothing else in the design assigns the duty of telling anyone. ISS-002's failure mode therefore survives re-spelled and undocumented: a caller who read the 0.1 story ("a payload's own `id` cannot be stored") will reasonably conclude a field named `smut_id` is now free, store it, and lose its identity semantics exactly as before. The rename frees `id`; it does not free identity-shaped fields.

Minimal wording, appended to that §6 paragraph: "The guide must say that a payload field named `smut_id` is still interpreted structurally, so such a payload cannot be stored verbatim; `smut_id` frees `id`, not every identity-shaped field."

Note the collision this must be written against: design §4's documentation contract also requires learn to say a store written by an older build is refused, while src/learn.rs:3-13 is chartered "never version-pinning". Both belong in the same guide sentence or two."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding]]
id = "F-6"
status = "open"
severity = "major"
title = "Three sections still bind the slice to README.md, which is now the operator's 0.2 rewrite outside this slice"
detail = """
Three design obligations still bind this slice to README.md, which the operator has moved out of scope: they are rewriting it for the 0.2 release and will land it before `cargo publish` (tracked as CHR-001). The obligations are §4's code-impact row ("Update declarations, response examples and sharp edges while preserving the operator's active draft"), §4's documentation contract ("README and `learn` describe the shipped surface"), and §5's "execute the README transcript" evidence requirement.

Left as written the design gates the slice on a surface the plan no longer owns, and an implementer following the design faithfully would sweep a file being rewritten in parallel.

Minimal wording: replace the §4 row with "README.md is out of this slice's write scope: the operator rewrites it for 0.2 and it lands separately (CHR-001). This slice must not edit, sweep or stage it and is not gated on its content."; in the documentation contract change "README and `learn` describe the shipped surface" to "`learn` describes the shipped surface; the README is the operator's rewrite and lands outside this slice"; in §5 keep "execute the ... guide examples using their existing tests" and drop the README transcript from the slice's evidence, noting the suite still runs it. §4's "README remains the operator's live draft" and §6's preservation paragraph stay as written — they are the boundary.

The plan already reflects this (PHASE-02/EN-3, EX-5, EX-10, VA-2; PHASE-03/EX-4, VA-4); this finding is the design catching up."""

[[finding.turn]]
act = "raise"
role = "raiser"

