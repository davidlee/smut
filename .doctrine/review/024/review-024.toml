detail = """
§4 introduces its table as "the code-impact contract", but src/error.rs is absent from it, and PHASE-02/EX-9 respells two messages that live there: Reject::InvalidId (src/error.rs:282) and StoreError::IdDisagreement (:389), plus describe()'s absent-identity text. The file was also absent from this slice's selectors, so the gap was invisible to the review-prime path and was found only by reading the plan against the code.

