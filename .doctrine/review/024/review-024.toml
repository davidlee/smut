Minimal wording: replace "A proposed exact reason is:" with "The corruption reason is exactly `identity at <path> must be a nonempty string`. Every diagnostic that names identity names `smut_id`: the invalid-identity refusal, the entity-file index disagreement, the absent-identity description and the `scan_refs` assertion. `docs/store-format.md` quotes the resulting strings."

Consequence of assent: PHASE-02/EX-9 becomes a design obligation rather than a plan reading of §3."""
