[[finding]]
id = "F-13"
status = "answered"
severity = "nit"
title = "Optional: name the absence of a migration in the version refusal (operator's call)"
detail = """
The version refusal is the first thing a 0.1 store's owner meets after the upgrade, and DEC-022 decided there is no migration ("we're not writing a migration script, let alone legacy handler. blow up loudly"). The design's §3 refusal text says what it read and what it reads, and deliberately gives no migration advice. Whether to say the absence out loud is the operator's call, not a defect.

Option: append ", and no migration is provided" to the refusal text. Argument for: the owner's first question is "can I convert it?" and silence reads as "maybe". Argument against: it invites a support conversation the design deliberately refuses, and the loud-failure posture is already unambiguous.

Either disposition is acceptable; if declined, drop it and record nothing. Raised as a nit so the decision is visible rather than an oversight, and because the same string is now pinned by F-1."""
disposition = "fix-now"
response = """
Operator ruled 2026-11-02: put it in `learn`, with maximum concision. The version refusal keeps its current wording — no appended clause — so the contractual diagnostic stays two clauses, stays quoted by STD-001 in docs/store-format.md, and stays as PHASE-02/EX-9 pins it. Both refusal strings (index and manifest) are therefore untouched.

The fact lands in the guide's opening store paragraph, beside "Declaring is the only thing that creates it; a read or a delete against a store that is not there exits 1 and creates nothing":

