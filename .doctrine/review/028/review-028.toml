[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The format record states as current that conventions sets live in `.config/smut/conventions/` — the shipped binary reads no such file"
detail = """
Expected (STD-001): the format document records what the reader does; a mechanism decided but not shipped is either marked as the adopted home for a future loader or left out.

Observed: `docs/store-format.md:54-60` — "Sets live under `.config/smut/conventions/` — in the project root, in the user config home, or in the shipped binary (DEC-026, DEC-028)". Probed against the built binary: a project `.config/smut/conventions/local.md` is not listed and `smut conventions local` refuses at exit 2 ("the sets are: hygiene"); `src/conventions.rs` embeds exactly one set with `include_str!` and reads no path. IMP-013 records that gap as open, and DEC-026's own consequence says "docs/store-format.md and STD-001 stay untouched because no file appears inside `.smut/`" — the paragraph this slice added goes beyond that.

The negative rule the design actually needs ("the store layout reserves nothing for conventions ... never inside `.smut/`") is true and worth keeping. Design §3 repeats the same present-tense source sentence, so the correction is a design edit mirrored in the document.

Remedy: state the layout reservation and name `.config/smut/conventions/` as DEC-026/028's decided home for the loader IMP-013 will build, not as a shipped reader."""
disposition = "design-wrong"
response = """
Confirmed by probe: a project `.config/smut/conventions/local.md` is invisible to the binary, and `smut conventions local` refuses at exit 2. The paragraph therefore states a decided mechanism as a shipped one, which is exactly the drift STD-001 exists to prevent — and design §3 carries the same present-tense sentence, so the design is the surface to correct, with the document as its mirror.

Reconcile action: in design §3 and `docs/store-format.md`, keep the true negative rule ("the store layout reserves nothing for conventions; nothing under `.smut/` is read back as a set") and re-time the positive claim — "`.config/smut/conventions/` is DEC-026/028's decided home for the layered loader IMP-013 tracks; the shipped binary embeds its one set." No behaviour changes and no new scope: IMP-013 already owns the loader."""

