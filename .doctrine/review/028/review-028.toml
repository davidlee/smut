[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "`src/predicate.rs` was edited (§4 never lists it) so conformance reads it undeclared — the registry, not the code, is the gap"
detail = """
Expected: every path the design declared as a design target covers every source path the slice edits, so `doctrine slice conformance 4` separates foreign work from this slice's own touches.

Observed: `doctrine slice conformance 4` reports `M src/predicate.rs` under **undeclared**. The edit is 8 lines of inline-test fixture respell (`{"id":"a","status":"open"}` → `{"smut_id":...}` in `src/predicate.rs:566,582,630`) — legitimate, because those fixtures name structural identity — but design §4's code-impact table has no row for the file and `.doctrine/slice/004/slice-004.toml` declares no selector for it. The predicate module never reads identity (it evaluates field predicates), so the design's impact analysis missed it while the repo-wide occurrence count had named it.

The same cell also carries two non-defects which must not be read as one: the operator's and SL-006's `.doctrine` work that landed inside the recorded phase range (named in `45bc4a0`), and this slice's own `notes.md`/`slice-004.toml`/`decision-amendments.md`. Only `src/predicate.rs` is this slice's own undeclared source touch.

Remedy, load-bearing first: `doctrine slice selector add 4 src/predicate.rs --intent design-target`; the design §4 table row is its human mirror, not the fix — a prose-only change leaves conformance red."""
disposition = "fix-now"
response = """
Confirmed, and the remedy is the registry rather than the code. `src/predicate.rs` holds no identity logic; its fixtures named structural identity because they build entity-shaped values, so the respell was unavoidable and correct. The defect is that design §4's code-impact analysis enumerated the occurrence count's files incompletely and no selector covers the path.

Reconcile action, load-bearing first: `doctrine slice selector add 4 src/predicate.rs --intent design-target`. Human mirror: a design §4 row ("`src/predicate.rs` | Evaluate field predicates only; no identity read. Update the inline fixtures that name structural identity; keep the operator grammar unchanged"). The undeclared cell's other members are carried in the synthesis as foreign/out-of-scope, not as slice findings: the operator's and SL-006's `.doctrine` commits that landed inside the recorded phase range, and this slice's own notes/toml/decision-amendments artefacts."""

