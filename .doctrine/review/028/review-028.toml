[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The DEC-007 amendment omits its title, its slug and its first rejected alternative, all of which still say `id`-first"
detail = """
Expected: DEC-025 and design §4 require the six targeted amendments to leave no facet field or prose passage asserting that an ordinary `id` carries identity; the proposal's own cross-record check 6 states that as the goal ("after the amendment no facet field and no prose passage in any of the six records says an ordinary `id` carries identity").

Observed: `.doctrine/slice/004/decision-amendments.md` (DEC-007 section) maps `choice` and four prose passages, then explicitly retains "all four rejected alternatives" — but the first alternative is:

  `- Fully key-sorted entities (no `id`-first) — rejected: `id` is what a reader looks for first, in output and in files, for a small amount of code.` (`record-007.md:78-80`)

which is a rule about the identity key's canonical position, not about id values. The same stale claim is in the record's header facet: `title = "0.1 projection and envelope: ... id-first canonical order"` (`record-007.toml:7`) and the derived `slug = "...-entity-serialisation-id-first"` (`record-007.toml:6`). The proposal names neither, so a reconcile that follows it lands an amendment while three passages in the same record still reverse it.

Remedy: the reconciliation brief must name the title ("smut_id-first canonical order") and the rejected-alternative bullet ("no `smut_id`-first"), and record that `knowledge edit` exposes no slug edit (`--title/--tags/--body` only), so the slug is tolerated as an immutable identifier with that rationale stated — not silently left."""
disposition = "fix-now"
response = """
Confirmed on evidence. Reading `record-007.toml:6-7` and `record-007.md:78-80` shows three passages the proposal neither maps nor flags, and the proposal's own claim to retain "all four rejected alternatives" is what hides the first one — it is the alternative that names `id`-first as the rule it rejects.

Reconcile action, in the same REV as the rest of DEC-007: amend `title` to "`smut_id`-first canonical order" (`knowledge edit --title`); amend the rejected-alternative bullet to "`- Fully key-sorted entities (no `smut_id`-first) — rejected: `smut_id` is what a reader looks for first, in output and in files, for a small amount of code.`"; and record the slug as tolerated in the amendment note, because `doctrine knowledge edit` exposes title/tags/body and facet subverbs only — no slug edit — so `...-entity-serialisation-id-first` stays as a derived identifier. The brief carries the exact texts."""

