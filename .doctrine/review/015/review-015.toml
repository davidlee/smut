id    = 15
slug  = "design-review-of-sl-002"
title = "design review of SL-002"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Rebinding pass, not a fifth adversarial window. Opened at revision 57 because the deferred-set refactor was adopted at revision 55 after RV-014 had opened, which staleness the run reported. Examined: the whole adopted delta of commit 603c718 and the harvest commit 96556fa — §3 caveat, §9.2 rewritten to one set with the retraction/supersession distinction kept as lifecycle advice, §9.3 ids generalised to the set pattern, §10.2 assumption dropped and §11's approval gate replaced, §12 risk row, §13.1 test row and §13.3 scenario 5 re-pointed at hygiene with epistemic-records refused by name, §14 code-impact row, §15 DEC-017 summary — together with the cross-references the refactor could have stranded: no surviving reference to a shipped second set or to an operator schema approval remains in design.md, slice-002.md or DEC-017; DEC-017's three tiers, §9.3, the 9.2 prose note and the §13.1 Conventions row all state the same ownership contract, that a supplied field including body is replaced while a user-added field survives. Nothing new was found, and nothing was raised. The substantive adversarial examination of this design remains RV-007 through RV-014 (four windows, twelve findings, eleven verified); RV-012's F-4 stays answered and awaits the raiser's verification, which is a ledger question about the accuracy of a durable answer and not a design defect."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

# Findings are append-only `[[finding]]` tables, added by `review raise`.
# Empty here at creation — a fresh review is Active, awaiting the raiser.
