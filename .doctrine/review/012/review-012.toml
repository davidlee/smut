[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "DEC-016 walks containment in the wrong direction and returns no open questions"
detail = """
What the design says: §9.4 and §13.3 scenario 2 make DEC-016's two-call idiom the normative answer to open questions under session. DEC-016's prose gives the exact first call as {"from":"session","follow":["part-of"],"depth":2,"select":["id"]}. Design §9.2 defines part-of as child -> container.

Concrete instance: jq over all 66 indexed entities in interview.local/.smut confirms session has no part-of field and each cluster points to session. Applying the specified outgoing relation for two hops yields only ["session"]. Filtering those ids for status:open gives no objects. Both envelopes are untruncated, so the new guard passes. Inverting the traversal with backlinks:["part-of"] at depth 2 reaches eight open question ids: q-audit-cost, q-channel-fix, q-fix-order, q-impact-query, q-more-friction, q-promotion, q-split, q-variance-mechanism. This is a deduction from verified JSON and the specified walker, not execution of an unbuilt 0.2 binary. finding-smut-18 in the source store contains the same erroneous example; it is evidence, not authority to propagate it.

What it should say/do: change the normative DEC-016 example to backlinks:["part-of"], and require the guide's actual example (not a separately handwritten equivalent) to run against the fixture and assert the expected open-question ids. This challenges the direction of the published recipe, not roots-only where or the settled edge direction semantics. Severity major: following the normative recipe returns the wrong answer on the designated acceptance store even with fully satisfied truncation guards.
"""
disposition = "fix-now"
route = "dedupe"
response = """
Accepted, and it is the more damaging of the two composition defects: the guard I added protects against truncation, and the recipe it protects walks the wrong way, so both envelopes are complete and both are useless. Verified independently before disposing: session has no part-of field; five clusters point to session by part-of; the eight open questions sit at depth two via backlinks from session (q-audit-cost, q-channel-fix, q-fix-order, q-impact-query, q-more-friction, q-promotion, q-split, q-variance-mechanism); the outgoing walk reaches session alone and filters to nothing.

The duplicate that goes is the first call in DEC-016's prose and every restatement of it. The owner that survives is the direction discipline in 9.2: part-of is child to container, so a question about what hangs off a container is a backlink question, and the inverse is what follow answers. That discipline was already written down; the example contradicted it, and an example carries more weight than a rule a reader has to apply.

Class swept: DEC-016 prose, the 9.4 bullet, 13.3 scenario 2, the README row in 14.1, and 13.1's guide row. The store's own finding-smut-18 carries the same inverted example - it is data and stays as it is, but it is where the error came from, so the sweep's rule is: no example may be copied from the store without being run.

Two additions make the repair falsifiable rather than merely corrected: the guide's worked example must be the one the fixture test runs, and the test asserts the expected open-question ids, so a hand-written example cannot drift from the direction again.
"""

