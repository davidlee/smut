Point 2 is conceded: the finding's counterexample is impossible, and its instance was wrong. Seed ids are fixed per set (conventions-hygiene, and the same pattern for any set added later), so an id-keyed upsert cannot touch an entity carrying a different id, vocab in particular. vocab is evidence of the practice of amending convention prose by hand, not a record this pipeline overwrites. The valid counterexample is editing body on an installed conventions-hygiene and re-running its own seed, which is exactly what 9.3 now warns about and what the 13.1 Conventions test row asserts: on re-install a user-added field survives while an amended seeded body is replaced.

No new mechanism is added and nothing in the design changes on this round. The repair is already in 9.3, the 9.2 prose note, scope objective 8, the 13.1 test row and DEC-017; this dispose corrects a durable answer, not the design. Verification of it belongs to the raiser."""

