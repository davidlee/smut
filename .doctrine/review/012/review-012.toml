[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Composition negative control has no specified executable subject or observable rejection"
detail = """
What the design says: §13.1 Composition row (line 782) requires the guarded recipe to report a partial answer and an unguarded recipe/test to be rejected by the assertion; §13.3 scenario 6 (815-819) repeats the reporting property. §9.4 specifies prose instructions and two independent queries, but names no executable composition/reporting surface, output shape, or failure assertion. src/learn.rs currently tests GUIDE text with contains checks; src/select.rs::envelope produces diagnostics only for the current Selection. The design adds no prior-response input to the second query.

Concrete instance: let s reference 100 questions and let only the final one be open. First query at default limit returns s plus 99 questions with result_limit; second query filters those ids and correctly returns objects:[], truncated:false. These two ordinary CLI outputs are identical whether a caller later says 'partial answer' or 'no open questions'. A test that merely asserts first.truncated and second.objects.is_empty() cannot reject the bad composition. A test-local report helper that is not the documented recipe would only test the helper; a GUIDE.contains('truncated') check can pass even if the executable example discards the envelope before consulting it.

What it should say/do: specify the subject and observable failure for the control: for example, an executable client-side recipe included in learn, run by the acceptance harness, whose partial outcome retains first-response reasons; run the same assertion against a variant that drops that guard and require it to fail. Alternatively classify the reporting behavior as human verification, retaining automated tests only for envelope facts and guide presence. No new smut query key or automatic provenance propagation is required. Severity minor: the guard itself is implementable by retaining the first envelope, but its automated verification promise is underspecified; it is not evidence of an incorrect current envelope.
"""
disposition = "fix-now"
route = "review"
response = """
Accepted. The row asserted that a bad composition is rejected by an assertion without naming the subject, the output, or the observation that rejects it, and the two envelopes alone cannot distinguish a guarded reading from a naive one. The 13.1 row will name all three.

The discriminating fact, which is what the criterion must assert: in an over-cap store the open question that answers the query is stored and open, is absent from the truncated first result, and the second envelope over the ids you did receive is complete-looking and empty. That is a fact about the mechanism, not a preference, and it is what makes the naive composition wrong rather than merely unlucky.

The control candidate, concretely: a deliberately naive helper in the test suite that takes the first envelope and filters its ids without consulting truncation, then asserts the answer is no open questions. It must be shown producing exactly that, and the guarded conclusion - a partial answer naming result_limit - must differ from it, so the two readings are distinguishable inside one test. The target-id assertion is what rejects the naive result: the store holds the answer, the truncated set does not, so the naive composition is falsified by the store rather than by the reviewer's opinion.

No mechanism is added to smut: no prior-response input to the second query, no automatic propagation. Propagation stays client-side, which is what the guard asks of a client that retains the first envelope, and 9.4 will say so in those words so nobody later tries to put it in the envelope.
"""

