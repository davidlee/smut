[[review.turn]]
act = "conclude"
role = "raiser"
note = "Hostile self-pass over design.md at revision 29, held to five invariants recorded in the RV brief: (1) every brief-mandated behaviour is stated or delegated by citation to a DEC that states it; (2) no section contradicts another or a decision; (3) an implementor cannot read a section into brief-violating behaviour; (4) diagrams agree with prose and carry the branches that matter; (5) code impact and design-target selectors agree. Probed specifically: §5's pipeline branches against DEC-004 line by line, §4.3–4.4's write set for full determination, §2's module map against §12's table, and §6.1's numeric comparator for the transitivity defect that killed its first version. Three findings raised (one major, two minor), all fixed in the design and verified. The declared set is closed; the human lane's section attestations and the pass disposition remain outstanding."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
