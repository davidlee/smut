id    = 29
slug  = "design-review-of-sl-008"
title = "design review of SL-008"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Adversarial pass over the seven drafted sections of design.md at revision 21: every load-bearing claim verified against the code and the governing decisions, 20 findings raised across all seven sections (nine major, eleven minor), all disposed fix-now and verified after the sections were revised and re-materialised (revision 25). The pass also confirmed the research artefact's code claims independently."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-008"

