[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Two-call filtering needs an explicit completeness guard before discarding the traversal envelope"
detail = """
Expected: the normative recipe for answering graph questions must preserve the first call's incompleteness or establish completeness before presenting the filtered answer. Observed: design §9.4 (lines 615-616), §13.1 fixture row and §13.3 scenario 2 prescribe extracting ids then filtering those roots, without requiring inspection/propagation of the first envelope's truncation. The default limit is 100 and the acceptance fixture has fewer than 100 entities, so the acceptance scenario cannot expose this failure.
Counterexample (design deduction): session s references q001..q100 in array order; only q100 is an open question. A depth-1 traversal discovers 101 entities, returns s and q001..q099 under the default limit, and sets result_limit. Passing just these ids into the second query produces no open questions and a fresh truncated:false envelope. Budget truncation has the same composition hazard. No predicate or traversal implementation bug is needed.
Repair: require the guide recipe to inspect both truncation reasons before extracting ids, retry with adequate explicit bounds where possible or retain an explicit incomplete-answer warning across the second call; do not treat a nontruncated second envelope as proof of complete graph coverage. Add an acceptance graph above the default cap with its sole matching question beyond the cap, plus a budget-cut case. Keep roots-only where and the existing limits; the defect is in the composition contract and its verification.
"""
disposition = "fix-now"
route = "review"
response = """
Accepted, on the observation that the recipe as written composes two envelopes with no completeness obligation, and that the acceptance graph sits under the default limit so neither the guide text nor the suite can expose it. The counterexample is a design deduction I cannot fault: discovery of 101 entities with an open question ordered last returns 100 rows, the second call filters the surviving ids, and its untruncated envelope reads as a complete answer.

The claim it defeats is mine: that roots-only where plus the two-call recipe is sufficient as stated. DEC-016 fixes where the idiom lives, not that it is complete as drafted, so the decision stands and the text under it changes.

Repair in this review. Section 9.4 gains the guard as part of the normative recipe: inspect truncated and truncation_reasons on the first response; either truncation reason makes the second answer a statement about the ids you received, not about the graph; raise limit or budget where the store allows it, and otherwise say the answer is partial. A false second envelope is never evidence of coverage. A new invariant carries it: composition does not launder incompleteness. Section 13.3 scenario 2 keeps the fixture run and a new scenario 6 uses a graph above the default cap whose only matching question is ordered beyond it, plus a budget-cut case, so the suite can fail on the defect. The Guide and Fixture rows of 13.1 follow.

Separable second arm, named here rather than smuggled in: the negative control. The concrete incorrect candidate a check must reject is a guide recipe, or a fixture test, that drops the first envelope with result_limit set and then asserts the filtered answer is complete. I am placing that as a test obligation in 13.1 beside the above-cap scenario; if the raiser wants the criterion tracked on the ledger rather than in the design, raise it as a sibling and it will be disposed on its own merits.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

