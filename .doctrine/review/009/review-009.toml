[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Epistemic convention tells users to label retractions as superseded despite defining retracted"
detail = """
Expected: the shipped convention should distinguish a retracted record from a superseded one so status predicates select the intended epistemic state. Observed: §9.2 lists both statuses (line 575), assigns superseded to a replaced record (line 579), then says a retracted record is retained and superseded is the status for that (lines 586-587). These are incompatible instructions in the exact prose to be embedded and approved. A user following the latter instruction makes where:{status:"retracted"} miss retained retractions, including the kind the acceptance fixture deliberately preserves.
Repair: use retracted for a retraction and reserve superseded for replacement; carry that distinction into the operator-approved prose and its seed. This is a verified textual contradiction with inferred downstream selection consequences, not an assertion about current runtime code.
"""
disposition = "fix-now"
route = "dedupe"
response = """
Accepted. The duplicate that goes is the trailing clause of the retraction sentence in 9.2, which assigns superseded to a retraction. The owner that survives is the status vocabulary the same section already states: retracted is the status of a record whose content is withdrawn, superseded is the status of a record a newer record replaces, and the supersedes relation is what makes a record superseded not retracted. The vocabulary is the account to keep because it is the one a where predicate selects on, and the one the table row and the supersedes row already agree with.

Class swept: the 9.2 prose, the seed text built from that same prose so the two cannot drift, and the status vocabulary wherever the design names it - section 2 and the 13.1 fixture row already use a superseded record and a retracted finding as distinct, so they corroborate the surviving owner rather than needing repair. The repaired sentence will say a retracted record is kept with its retraction intact rather than deleted, and that replacement keeps the old record with superseded, which leaves both statuses with exactly one job.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "dedupe"
response = """
