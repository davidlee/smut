[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "The follow-empty edge-case row contradicts induced edges and depth/budget rules"
detail = """
Expected: follow:[] disables outgoing discovery while the independently supplied backlinks, depth, budget and induced-edge contract continue to apply. Observed: design §10.3 line 671 promises roots expanded, no edges, empty frontier without qualification. This conflicts with §§7.1, 8.2 and the adjacent edge-case rows.
Counterexamples (design deductions): store a with link:{id:b}, b stored, query from:[a,b], follow:[] must still return the induced a-link-b edge under DEC-014. Adding depth:0 puts both roots in frontier under DEC-013; using budget:1 at default depth leaves b in frontier and reports traversal_budget under DEC-015. Supplying backlinks:'*' can discover further entities despite follow:[]. The next row, a named field nobody carries implies no edges, has the same induced-edge ambiguity.
Repair: state no outgoing discoveries for empty follow, rather than no edges; qualify expansion/frontier by depth/budget and the other direction. Sweep no-edge promises for this distinction and test these combinations, rather than asserting the current unconditional row as §12 requires.
"""
disposition = "fix-now"
route = "refresh"
response = """
Accepted. Section 8.2 and DEC-014 are right and the two edge-case rows lag them: edges are induced among returned objects after the limit, so an empty follow cannot promise no edges, and the frontier is governed by depth, budget and the other direction rather than by follow alone. Both counterexamples hold on the current text - two roots joined by a reference under an empty follow still induce that edge, and depth zero, a budget cut or a supplied backlinks each change the frontier.

Records edited: the follow-empty row and the named-field-nobody-carries row in section 10.3. The follow-empty row will state no outgoing discoveries, with induced edges among returned objects unchanged and the frontier following depth, budget and the other direction. The named-field row will state no outgoing discoveries from that label, with the same qualification.

Class swept: every no-edge or empty-frontier promise in the design, which today means those two rows and the risk table line about a named field; the tests must construct the combinations rather than assert the unconditional rows - empty follow with an induced edge between roots, empty follow with depth zero, and empty follow with backlinks supplied.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "refresh"
response = """
