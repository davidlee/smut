[package]
name = "smut"
version = "0.2.0"
edition = "2024"
description = "A permissive notebook for an agent's mutable entity graph: declare linked JSON entities, read them back as JSON or Markdown."
license = "GPL-3.0-only"
repository = "https://github.com/davidlee/smut"
homepage = "https://doctrinal.systems"
readme = "README.md"
keywords = ["json", "graph", "cli", "markdown", "notes"]
categories = ["command-line-utilities", "database"]
# Project governance, the implementation brief and the Nix devshell are not part
# of the crate; the code, its tests, its documents and the README image are.
exclude = [".doctrine/", ".pi/", "AGENTS.md", "smut-implementation-brief.org", "smut.jpg", "flake.nix", "flake.lock"]

[lib]
name = "smut"
path = "src/lib.rs"

[[bin]]
name = "smut"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs4 = "1"
nanoid = "0.5"
serde = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"

[features]
fault-injection = []
